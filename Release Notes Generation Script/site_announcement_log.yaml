    <p><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">This update includes the addition of two new analytic tools&mdash;the <em>Cancer Research Institute (CRI) iAtlas</em> and <em>The Cancer Proteome Atlas (TCPA)&mdash;</em>and the addition of one new repository&mdash;the <em>Childhood Cancer Repository</em>. The CRI iAtlas is an interactive web platform that provides a set of analytic tools for studying interactions between tumors and the immune microenvironment. The TCPA provides a data portal for users to access and interact with proteomics datasets. The Childhood Cancer Repository banks and distributes validated cell lines and patient-derived xenografts (PDXs) established from childhood cancers to investigators seeking to do research. <span style="background-color:white"><span style="color:black">Additionally, three existing resources have been updated to include new participant and sample count information.</span></span></span></span></p><p><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">This update also includes a new guide providing information about how to access, query, and process data from the Childhood Cancer Data Initiative (CCDI) stored at the NCI&rsquo;s Cancer Data Service (CDS). The CCDI studies that submit data to the CDS are registered with the National Center for Biotechnology Information&#39;s database of Genotypes and Phenotypes (dbGaP), which maintains a list of the subject IDs, sample IDs, and consents. </span></span></p><p><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">Explore the data and site updates in more detail below.</span></span></p><h1><span style="font-size:16pt"><span style="font-family:&quot;Calibri Light&quot;,sans-serif"><span style="color:#2f5496">Data Updates</span></span></span></h1><h2><span style="font-size:13pt"><span style="font-family:&quot;Calibri Light&quot;,sans-serif"><span style="color:#2f5496">New Participating Resource and Dataset</span></span></span></h2><p><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">The CCDC has added <strong>3</strong> new catalog resources.</span></span></p><ul><li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif"><span style="color:black">Cancer Research Institute (CRI) iAtlas</span></span></span></li><li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif"><span style="color:black">Childhood Cancer Repository</span></span></span></li><li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif"><span style="color:black">The Cancer Proteome Atlas (TCPA)</span></span></span></li></ul><p style="margin-left:48px">&nbsp;</p><h2><span style="font-size:13pt"><span style="font-family:&quot;Calibri Light&quot;,sans-serif"><span style="color:#2f5496">Existing Participating Resources and Datasets</span></span></span></h2><p><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif"><strong><span style="background-color:white"><span style="font-family:&quot;Calibri&quot;,sans-serif"><span style="color:black">3&nbsp;</span></span></span></strong><span style="background-color:white"><span style="color:black">existing resources have been updated with additional<strong>&nbsp;</strong>data and information.</span></span></span></span></p><ul><li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">St. Jude Cloud</span></span><ul style="list-style-type:circle"><li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">Updated case counts, case disease diagnosis information, and sample counts for multiple datasets</span></span></li></ul></li><li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">Therapeutically Applicable Research to Generate Effective Treatments (TARGET) </span></span><ul style="list-style-type:circle"><li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">Updated case counts, case disease diagnosis information, and sample counts for multiple datasets</span></span></li></ul></li><li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">Patient-Derived Xenograft and Advanced In Vivo Models (PDX-AIM)</span></span><ul style="list-style-type:circle"><li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">Updated case counts, case disease diagnosis information, and sample counts</span></span></li></ul></li></ul><p>&nbsp;</p><h1><span style="font-size:16pt"><span style="font-family:&quot;Calibri Light&quot;,sans-serif"><span style="color:#2f5496">General Site Updates</span></span></span></h1><ul><li><span style="font-size:11pt"><span style="background-color:white"><span style="color:black"><span style="font-family:Calibri,sans-serif">The &lsquo;CCDI Studies&rsquo; menu bar item has been updated to include both the existing link to the CCDI resource page and a new link to a guide for accessing CCDI data</span></span></span></span><ul style="list-style-type:circle"><li><span style="font-size:11pt"><span style="background-color:white"><span style="color:black"><span style="font-family:Calibri,sans-serif">The new &#39;CCDI Resource &amp; Datasets&#39; submenu item now provides a direct link to the CCDI Resource page</span></span></span></span></li><li><span style="font-size:11pt"><span style="background-color:white"><span style="color:black"><span style="font-family:Calibri,sans-serif">The new &lsquo;Accessing CCDI Data&rsquo; submenu item links to a PDF guide that provides information about how to access, query, and process data from the CCDI stored at the NCI&rsquo;s Cancer Data Service (CDS).</span></span></span></span></li></ul></li><li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">The Glossary has been updated with new acronyms and abbreviations.</span></span></li><li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">The User Guide is updated to reflect new and updated resource information.</span></span></li></ul><p>&nbsp;</p><h1><span style="font-size:16pt"><span style="font-family:&quot;Calibri Light&quot;,sans-serif"><span style="color:#2f5496">Additional Support and Inquiries</span></span></span></h1><p><span style="font-size:12pt"><span style="font-family:&quot;Times New Roman&quot;,serif"><span style="font-size:11.0pt"><span style="font-family:&quot;Calibri&quot;,sans-serif">Users requiring any additional support or with any questions about the CCDC can contact the Childhood Cancer Data Initiative at </span></span><a href="mailto:NCIChildhoodCancerDataInitiative@mail.nih.gov"><span style="font-size:11.0pt"><span style="font-family:&quot;Calibri&quot;,sans-serif"><span style="color:#0563c1">NCIChildhoodCancerDataInitiative@mail.nih.gov</span></span></span></a><span style="font-size:11.0pt"><span style="font-family:&quot;Calibri&quot;,sans-serif">.&nbsp; Please include a name and a reference to the CCDC with the submitted inquiry.</span></span></span></span></p>
