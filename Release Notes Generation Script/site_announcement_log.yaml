    <p><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">The National Cancer Institute is pleased to announce the addition of Epidemiologic as a data content type to the Childhood Cancer Data Catalog website: <a href="https://datacatalog.ccdi.cancer.gov/" style="color:#0563c1; text-decoration:underline">https://datacatalog.ccdi.cancer.gov/</a>. This new data type allows the Catalog to better categorize data relating to the study of the distribution and determinants of health-related states or events (including disease) in populations, and the application of this study to the control of diseases and other health problems. Both the Childhood Cancer &amp; Leukemia International Consortium (CLIC) and the National Childhood Cancer Registry Explorer (NCCR) have been re-categorized to capture their inclusion of epidemiologic data.</span></span></p><p><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">The Catalog is also expanded to add 1 new resource, Fibrolamellar Registry, with 1 new dataset.</span></span></p><p><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">There are several small site improvements in this update.</span></span></p><h1><span style="font-size:16pt"><span style="font-family:&quot;Calibri Light&quot;,sans-serif"><span style="color:#2f5496">Data Updates</span></span></span></h1><h2><span style="font-size:13pt"><span style="font-family:&quot;Calibri Light&quot;,sans-serif"><span style="color:#2f5496">New Data Content Type&nbsp; </span></span></span></h2><p><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">The CCDC has added a new data content type &lsquo;Epidemiologic.&rsquo;</span></span></p><ul><li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">Childhood Cancer &amp; Leukemia International Consortium (CLIC) <span style="background-color:white"><span style="color:black">resource is now categorized as epidemiologic</span></span></span></span></li><li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif"><span style="background-color:white"><span style="color:black">The </span></span>National Childhood Cancer Registry Explorer (NCCR) in now categorized as both clinical and epidemiologic</span></span></li></ul><h2><span style="font-size:13pt"><span style="font-family:&quot;Calibri Light&quot;,sans-serif"><span style="color:#2f5496">New Participating Resource and Datasets</span></span></span></h2><p><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">The CCDC has added <strong>1</strong> new resource that includes <strong>1</strong> new dataset.</span></span></p><ul><li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif"><span style="color:black">Fibrolamellar Registry</span></span></span><ul style="list-style-type:circle"><li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif"><strong><span style="background-color:white"><span style="font-family:&quot;Calibri&quot;,sans-serif"><span style="color:black">New dataset</span></span></span></strong><span style="background-color:white"><span style="color:black">&nbsp;-&nbsp;Fibrolamellar Registry</span></span></span></span></li></ul></li></ul><h2><span style="font-size:13pt"><span style="font-family:&quot;Calibri Light&quot;,sans-serif"><span style="color:#2f5496">Existing Participating Resources and Datasets</span></span></span></h2><p><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif"><strong>8 </strong>existing resources have been updated to include the additional<strong> </strong>data and information. </span></span></p><ul><li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">Childhood Cancer Data Initiative (CCDI)</span></span><ul style="list-style-type:circle"><li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">Molecular Characterization Initiative</span></span><ul style="list-style-type:square"><li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">Added Case Disease Diagnosis, Number of Samples, Sample Analyte Type, Sample Is Normal, Sample Anatomic Type, and Sample Assay Method Core Data Elements</span></span></li><li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">Updated case count information</span></span></li></ul></li><li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">OncoKids - NGS Panel for Pediatric Malignancies</span></span><ul style="list-style-type:square"><li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">Added Case Disease Diagnosis, Number of Samples, and Sample Analyte Type Core Data Elements</span></span></li><li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">Updated case counts</span></span></li></ul></li></ul></li><li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">Childhood Cancer &amp; Leukemia International Consortium (CLIC)</span></span><ul style="list-style-type:circle"><li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">Updated the CLIC dataset name to &lsquo;International Agency for Research on Cancer&rsquo; to better reflect the data available</span></span></li></ul></li><li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">Gene Expression Omnibus (GEO) </span></span><ul style="list-style-type:circle"><li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">&lsquo;The Genomic Analysis of Medulloblastoma&rsquo; and the &lsquo;The Genomic Complexity of Early T-Cell Progenitor Acute Lymphoblastic Leukemia&rsquo; datasets were moved to the dbGaP resource</span></span></li></ul></li><li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">The database of Genotypes and Phenotypes (dbGaP)</span></span><ul style="list-style-type:circle"><li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">Multiple datasets were updated to now include a GEO Study Identifiers</span></span></li></ul></li><li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">Kids First Data Resource</span></span><ul style="list-style-type:circle"><li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">Updated case counts for multiple datasets</span></span></li><li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">Added Sample ID, Sample Assay Method, and Case Proband elements to multiple datasets</span></span></li></ul></li><li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">MicroRNA Childhood Cancer Catalog (M3Cs)</span></span><ul style="list-style-type:circle"><li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">Updated case counts and disease names</span></span></li></ul></li><li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">PedcBioPortal for Integrated Childhood Cancer Genomics (PEDC)</span></span><ul style="list-style-type:circle"><li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">Updated case counts and disease names</span></span></li></ul></li><li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">Therapeutically Applicable Research to Generate Effective Treatments (TARGET)</span></span><ul style="list-style-type:circle"><li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">Updated ALL Phase 2 dataset case counts</span></span></li></ul></li></ul><h1><span style="font-size:16pt"><span style="font-family:&quot;Calibri Light&quot;,sans-serif"><span style="color:#2f5496">General Site Updates</span></span></span></h1><ul><li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">The Glossary has been updated with new acronyms and abbreviations.</span></span></li><li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">The Site Update page now includes icons for the Cell Lines and Epidemiologic Data Content Types.</span></span></li><li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">The User Guide is updated to reflect new and updated resource information.</span></span></li></ul><h1><span style="font-size:16pt"><span style="font-family:&quot;Calibri Light&quot;,sans-serif"><span style="color:#2f5496">Search Catalog</span></span></span></h1><ul><li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">The Card View cards, on the Search Catalog page, have been updated to allow functional links in the description.</span></span></li></ul><h1><span style="font-size:16pt"><span style="font-family:&quot;Calibri Light&quot;,sans-serif"><span style="color:#2f5496">Participating Resources</span></span></span></h1><ul><li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">Users can now filter by the new Data Content Type &lsquo;Epidemiologic&rsquo;</span></span></li></ul><p style="margin-left:48px">&nbsp;</p><h1><span style="font-size:16pt"><span style="font-family:&quot;Calibri Light&quot;,sans-serif"><span style="color:#2f5496">Additional Support and Inquiries</span></span></span></h1><p><span style="font-size:12pt"><span style="font-family:&quot;Times New Roman&quot;,serif"><span style="font-size:11.0pt"><span style="font-family:&quot;Calibri&quot;,sans-serif">Users requiring any additional support or with any questions about the CCDC can contact Childhood Cancer Data Initiative at </span></span><a href="mailto:NCIChildhoodCancerDataInitiative@mail.nih.gov" style="color:#0563c1; text-decoration:underline"><span style="font-size:11.0pt"><span style="font-family:&quot;Calibri&quot;,sans-serif"><span style="color:#0563c1">NCIChildhoodCancerDataInitiative@mail.nih.gov</span></span></span></a><span style="font-size:11.0pt"><span style="font-family:&quot;Calibri&quot;,sans-serif">.&nbsp; Please include a name and a reference to the CCDC with the submitted inquiry.</span></span></span></span></p>
