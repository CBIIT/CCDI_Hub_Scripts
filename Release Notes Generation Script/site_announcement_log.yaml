    <p style="line-height:107%;margin:0in 0in 8pt;"> <span style="color:black;font-family:Calibri, sans-serif;font-size:11pt;">The latest release of the Childhood Cancer Data Initiative Data Catalog features the annual update to the GENIE dataset, one additional updated dataset, and a new resource with a new dataset – Pediatric Cancer Registry from the Florida Association of Pediatric Tumor Programs (FAPTP). The Glossary page was updated to adhere to 508 compliance best practices and a new field was added to the resource digests to distinguish between person and website contacts for each resource. The User Guide was updated to reflect the added resource and other update dates for version 1.5.6.</span> <span style="font-family:Calibri, sans-serif;font-size:11pt;"></span> </p><h1 style="break-after:avoid;font-weight:normal;line-height:107%;margin:12pt 0in 0in;"> <a name="_Hlk174970223"> <span style="color:rgb(47,84,150);font-family:&quot;Calibri Light&quot;, sans-serif;font-size:16pt;">Statistics at a Glance</span> </a> </h1> <h2 style="break-after:avoid;font-weight:normal;line-height:107%;margin:2pt 0in 0in;"> <span style="color:rgb(47,84,150);font-family:&quot;Calibri Light&quot;, sans-serif;font-size:13pt;"> <span>v1.5.6 Summary</span> </span> </h2> <p style="line-height:107%;margin:0in 0in 8pt;"> <span style="color:black;font-family:&quot;Calibri&quot;,sans-serif;font-size:11pt;"> <strong>32nd</strong> </span> <span style="color:black;font-family:Calibri, sans-serif;font-size:11pt;"> Release</span> </p><p style="line-height:107%;margin:0in 0in 8pt;"> <span style="color:black;font-family:&quot;Calibri&quot;,sans-serif;font-size:11pt;"> <strong>364</strong> </span> <span style="color:black;font-family:Calibri, sans-serif;font-size:11pt;"> Datasets</span> </p><p style="line-height:107%;margin:0in 0in 8pt;"> <span style="color:black;font-family:&quot;Calibri&quot;,sans-serif;font-size:11pt;"> <strong>65</strong> </span> <span style="color:black;font-family:Calibri, sans-serif;font-size:11pt;"> Resources</span> </p><ul style="padding-left:48px;"> <li> <p style="line-height:107%;margin:0;"> <span style="color:black;font-family:Calibri, sans-serif;font-size:11pt;"> <span> <strong>9</strong></span> Analytical Tools</span> </p> </li> <li> <p style="line-height:107%;margin:0;"> <span style="color:black;font-family:Calibri, sans-serif;font-size:11pt;"> <span> <strong>6</strong></span> Biorepositories</span> </p> </li><li> <p style="line-height:107%;margin:0;"> <span style="color:black;font-family:Calibri, sans-serif;font-size:11pt;"> <span> <strong>8</strong></span> Catalogs</span> </p> </li> <li> <p style="line-height:107%;margin:0;"> <span style="color:black;font-family:Calibri, sans-serif;font-size:11pt;"> <span> <strong>19</strong></span> Data Repositories</span> </p> </li> <li> <p style="line-height:107%;margin:0;"> <span style="color:black;font-family:Calibri, sans-serif;font-size:11pt;"> <span> <strong>3</strong></span> Knowledgebases</span> </p> </li> <li> <p style="line-height:107%;margin:0;"> <span style="color:black;font-family:Calibri, sans-serif;font-size:11pt;"> <span> <strong>14</strong></span> Programs</span> </p> </li> <li> <p style="line-height:107%;margin:0;"> <span style="color:black;font-family:Calibri, sans-serif;font-size:11pt;"> <span> <strong>1</strong></span> Project</span> </p> </li> <li> <p style="line-height:107%;margin:0;"> <span style="color:black;font-family:Calibri, sans-serif;font-size:11pt;"> <span> <strong>5</strong></span> Registries</span> </p> </li> </ul><h1 style="break-after:avoid;font-weight:normal;line-height:107%;margin:12pt 0in 0in;"> <a name="_Hlk174970223"> <span style="color:rgb(47,84,150);font-family:&quot;Calibri Light&quot;, sans-serif;font-size:16pt;">Data Updates</span> </a> </h1> <h2 style="break-after:avoid;font-weight:normal;line-height:107%;margin:2pt 0in 0in;"> <span style="color:rgb(47,84,150);font-family:&quot;Calibri Light&quot;, sans-serif;font-size:13pt;"> <span>New Resources</span> </span> </h2> <p style="line-height:107%;margin:0in 0in 8pt;"> <span style="color:black;font-family:&quot;Calibri&quot;,sans-serif;font-size:11pt;"> <strong>1</strong> </span> <span style="color:black;font-family:Calibri, sans-serif;font-size:11pt;"> new resource has been added.</span> <ul style="padding-left:48px;"> <li> <p style="line-height:107%;margin:0;"> <span style="color:black;font-family:Calibri, sans-serif;font-size:11pt;">Florida Association of Pediatric Tumor Programs (FAPTP)</span> </p> <ul style="padding-left:48px;"> <li> <p style="line-height:107%;margin:0;"> <span style="color:black;font-family:Calibri, sans-serif;font-size:11pt;"> <span> <strong>New Dataset</strong> – </span>Pediatric Cancer Registry</span> </p> </li> </ul> </li> </ul><h2 style="break-after:avoid;font-weight:normal;line-height:107%;margin:2pt 0in 0in;"> <span style="color:rgb(47,84,150);font-family:&quot;Calibri Light&quot;, sans-serif;font-size:13pt;"> <span>Existing Participating Resources and Datasets</span> </span> </h2><p style="line-height:107%;margin:0in 0in 8pt;"> <span style="color:black;font-family:&quot;Calibri&quot;,sans-serif;font-size:11pt;"> <strong>4</strong> </span> <span style="color:black;font-family:Calibri, sans-serif;font-size:11pt;"> existing resources have been updated with additional data and information or with datasets removed.</span> <ul style="padding-left:48px;"> <li> <p style="line-height:107%;margin:0;"> <span style="font-family:Calibri, sans-serif;font-size:11pt;"> <span style="font-family:Symbol;"></span> </span> <span style="color:black;font-family:Calibri, sans-serif;font-size:11pt;">Childhood Cancer Data Initiative (CCDI)</span> <span style="font-family:Calibri, sans-serif;font-size:11pt;"></span> </p> <ul style="padding-left:48px;"><li> <p style="line-height:107%;margin:0;"> <span style="color:black;font-family:Calibri, sans-serif;font-size:11pt;">Updated dataset – Childhood Cancer Data Initiative (CCDI): Molecular Characterization Initiative</span> </p> </li> </ul> </li><li> <p style="line-height:107%;margin:0;"> <span style="font-family:Calibri, sans-serif;font-size:11pt;"> <span style="font-family:Symbol;"></span> </span> <span style="color:black;font-family:Calibri, sans-serif;font-size:11pt;">The database of Genotypes and Phenotypes (dbGaP)</span> <span style="font-family:Calibri, sans-serif;font-size:11pt;"></span> </p> <ul style="padding-left:48px;"> <li> <p style="line-height:107%;margin:0;"> <span style="color:black;font-family:Calibri, sans-serif;font-size:11pt;">Moved dataset Gabriella Miller Kids First Pediatric Research Program in Novel Cancer Susceptibility in Families (from BASIC3) to Kids First Data Resource</span> </p> </li> </ul> </li><li> <p style="line-height:107%;margin:0;"> <span style="font-family:Calibri, sans-serif;font-size:11pt;"> <span style="font-family:Symbol;"></span> </span> <span style="color:black;font-family:Calibri, sans-serif;font-size:11pt;">Genomics Evidence Neoplasia Information Exchange (GENIE)</span> <span style="font-family:Calibri, sans-serif;font-size:11pt;"></span> </p> <ul style="padding-left:48px;"> <li> <p style="line-height:107%;margin:0;"> <span style="color:black;font-family:Calibri, sans-serif;font-size:11pt;">Dataset GENIE Cohort v17.0-public was replaced by dataset GENIE Cohort v18.0-public</span> </p> </li></ul> </li><li> <p style="line-height:107%;margin:0;"> <span style="font-family:Calibri, sans-serif;font-size:11pt;"> <span style="font-family:Symbol;"></span> </span> <span style="color:black;font-family:Calibri, sans-serif;font-size:11pt;">Kids First Data Resource</span> <span style="font-family:Calibri, sans-serif;font-size:11pt;"></span> </p> <ul style="padding-left:48px;"> <li> <p style="line-height:107%;margin:0;"> <span style="color:black;font-family:Calibri, sans-serif;font-size:11pt;">Moved dataset Gabriella Miller Kids First Pediatric Research Program in Novel Cancer Susceptibility in Families (from BASIC3) from dbGaP and updated