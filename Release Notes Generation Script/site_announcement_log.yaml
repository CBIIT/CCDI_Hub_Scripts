    <p style="line-height:107%;margin:0in 0in 8pt;"><span style="color:black;font-family:Calibri, sans-serif;font-size:11pt;">The December Catalog release includes the addition of two new resources—the Specimen Resource Locator and the Pediatric Malignancies: Inventory of DCEG Research—alongside eight new datasets from existing resources: Cancer Research Institute iAtlas Pancancer Analysis of Whole Genomes (PCAWG) and The Cancer Genome Atlas Program (TCGA); cBioPortal’s Pediatric European MAPPYACTS Trial, Gastrointestinal Stromal Tumors, and Mature B-Cell Neoplasms; Imaging Data Commons CCDI Molecular Characterization Initiative (MCI); and Single-cell Pediatric Cancer Atlas (ScPCA) Single-cell RNA sequencing of diverse pediatric leukemias, and Identification of drug-resistance-related cell states in paired pre- and post-treatment neuroblastoma PDXs. Updates were also made to CCDI’s NCCR Data Platform description, titles for two ScPCA datasets, and counts for numerous datasets. Two new features were added, the first to enable users to download all dataset digests from the user interface menu, and the second to link to available TARGET datasets in dbGaP. Finally, the Site Updates page was redesigned to improve a better and more consistent experience across CCDI resources. Detailed updates are described below. </span><span style="font-family:Calibri, sans-serif;font-size:11pt;"></span></p> <h1 style="break-after:avoid;font-weight:normal;line-height:107%;margin:12pt 0in 0in;"><a name="_Hlk174970223"><span style="color:rgb(47,84,150);font-family:&quot;Calibri Light&quot;, sans-serif;font-size:16pt;">Data Updates</span></a></h1> <h2 style="break-after:avoid;font-weight:normal;line-height:107%;margin:2pt 0in 0in;"><span style="color:rgb(47,84,150);font-family:&quot;Calibri Light&quot;, sans-serif;font-size:13pt;"><span>New Resources</span></span></h2> <p style="line-height:107%;margin:0in 0in 8pt;"><span style="color:black;font-family:&quot;Calibri&quot;,sans-serif;font-si