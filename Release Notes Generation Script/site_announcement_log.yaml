  - >
    <p><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">The National Cancer Institute is pleased to announce an update to the Childhood Cancer Data Catalog website: <a href="https://datacatalog.ccdi.cancer.gov/" style="color:#0563c1; text-decoration:underline">https://datacatalog.ccdi.cancer.gov/</a>. </span></span></p><p><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">This update includes the addition of the Xena Browser as a new analytic tool resource. &nbsp;Xena Browser is an online exploration tool that allows users to look at functional genomic data sets for correlations between genomic and/or phenotypic variables.&nbsp; Additionally, 8 existing resources have been updated to include 7 new datasets, 5 of which come from The Cancer Imaging Archive (TCIA).</span></span></p><p><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">Explore the data and site updates in more detail below:</span></span></p><h1><span style="font-size:16pt"><span style="font-family:&quot;Calibri Light&quot;,sans-serif"><span style="color:#2f5496">Data Updates</span></span></span></h1><h2><span style="font-size:13pt"><span style="font-family:&quot;Calibri Light&quot;,sans-serif"><span style="color:#2f5496">New Participating Resource and Dataset</span></span></span></h2><p><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">The CCDC has added <strong>1</strong> new analytic tool resource.</span></span></p><ul><li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif"><span style="color:black">Xena Browser</span></span></span></li></ul><h2><span style="font-size:13pt"><span style="font-family:&quot;Calibri Light&quot;,sans-serif"><span style="color:#2f5496">Existing Participating Resources and Datasets</span></span></span></h2><p><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif"><strong>8 </strong>existing resources have been updated with additional<strong> </strong>data and information, including <strong>7</strong> new datasets. </span></span></p><ul><li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">Central Brain Tumor Registry of the United States (CBTRUS)</span></span><ul style="list-style-type:circle"><li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif"><strong>New dataset</strong> - CBTRUS Fact Sheet 2022</span></span></li></ul></li><li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">Clinical Interpretation of Variants in Cancer (CIViC)</span></span><ul style="list-style-type:circle"><li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">Added case disease diagnosis information</span></span></li></ul></li><li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">The database of Genotypes and Phenotypes (dbGaP)</span></span><ul style="list-style-type:circle"><li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif"><strong><span style="color:black">New dataset </span></strong><span style="color:black">- NSD2 E1099K Drives Relapse in Pediatric Acute Lymphoblastic Leukemia by Disrupting 3D Chromatin </span></span></span></li></ul></li><li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">The Jackson Laboratory PDX Models </span></span><ul style="list-style-type:circle"><li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">Updated case counts </span></span></li></ul></li><li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">Kids First Data Resource</span></span><ul style="list-style-type:circle"><li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">Updated case counts and case disease diagnosis information for Pediatric Brain Tumor Atlas&rsquo;s Children&#39;s Brain Tumor Network (CBTN) and Pacific Pediatric Neuro-Oncology Consortium (PNOC) datasets</span></span></li></ul></li><li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">OncoKB</span></span><ul style="list-style-type:circle"><li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">Added case disease diagnosis information</span></span></li></ul></li><li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">St. Jude Cloud</span></span><ul style="list-style-type:circle"><li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif"><strong>New dataset</strong> - St. Jude LIFE Hematopoiesis</span></span></li><li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">Removed Sickle Cell Genome Project </span></span></li><li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">Updated case count, case disease diagnosis, and sample count information across multiple datasets</span></span></li></ul></li><li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">The Cancer Imaging Archive (TCIA)</span></span><ul style="list-style-type:circle"><li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif"><strong><span style="color:black">New dataset </span></strong><span style="color:black">- </span>Annotations for Combination Chemotherapy and Radiation Therapy in Treating Young Patients With Newly Diagnosed Hodgkin Lymphoma (AHOD0831-Tumor-Annotations) - TCIA DOIs - Cancer Imaging Archive Wiki</span></span></li><li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif"><strong><span style="color:black">New dataset </span></strong><span style="color:black">- </span>Annotations for Combination Chemotherapy and Surgery in Treating Young Patients With Wilms Tumor (AREN0534-Tumor-Annotations) - TCIA DOIs - Cancer Imaging Archive Wiki</span></span></li><li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif"><strong><span style="color:black">New dataset </span></strong><span style="color:black">- </span>Annotations for Vincristine, Dactinomycin, and Doxorubicin With or Without Radiation Therapy or Observation Only in Treating Younger Patients Who Are Undergoing Surgery for Newly Diagnosed Stage I</span></span></li><li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif"><strong><span style="color:black">New dataset </span></strong><span style="color:black">- </span>Annotations for Combination Chemotherapy With or Without Radiation Therapy in Treating Young Patients With Newly Diagnosed Stage III or Stage IV Wilms Tumor (AREN0533-Tumor-Annotations) - TCIA DOIs</span></span></li><li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif"><strong><span style="color:black">New dataset </span></strong><span style="color:black">- </span>Radiation Therapy, Amifostine, and Chemotherapy in Treating Young Patients With Newly Diagnosed Nasopharyngeal Cancer (ARAR0331) - The Cancer Imaging Archive (TCIA) Public Access - Cancer Imaging A</span></span></li><li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif"><span style="color:black">Added Clinical Trial information to multiple datasets </span></span></span></li></ul></li></ul><h1><span style="font-size:16pt"><span style="font-family:&quot;Calibri Light&quot;,sans-serif"><span style="color:#2f5496">General Site Updates</span></span></span></h1><ul><li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">The Glossary has been updated with new acronyms and abbreviations.</span></span></li><li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">The User Guide is updated to reflect new and updated resource information.</span></span></li></ul><h2><span style="font-size:13pt"><span style="font-family:&quot;Calibri Light&quot;,sans-serif"><span style="color:#2f5496">Search Catalog</span></span></span></h2><ul><li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">Search Catalog exports no longer include errant database characters</span></span></li></ul><h2><span style="font-size:13pt"><span style="font-family:&quot;Calibri Light&quot;,sans-serif"><span style="color:#2f5496">Participating Resources</span></span></span></h2><ul><li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">Selecting an email point of contact for resource with multiple identified contacts will now only mail to the selected contact.</span></span></li><li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">Selecting a point of contact that links to a website will now open in a new tab and not in an email. &nbsp;</span></span></li></ul><h1><span style="font-size:16pt"><span style="font-family:&quot;Calibri Light&quot;,sans-serif"><span style="color:#2f5496">Additional Support and Inquiries</span></span></span></h1><p><span style="font-size:11.0pt"><span style="font-family:&quot;Calibri&quot;,sans-serif">Users requiring any additional support or with any questions about the CCDC can contact Childhood Cancer Data Initiative at </span></span><span style="font-size:11.0pt"><span style="font-family:&quot;Calibri&quot;,sans-serif"><a href="mailto:NCIChildhoodCancerDataInitiative@mail.nih.gov" style="color:#0563c1; text-decoration:underline"><span style="color:#0563c1">NCIChildhoodCancerDataInitiative@mail.nih.gov</span></a></span></span><span style="font-size:11.0pt"><span style="font-family:&quot;Calibri&quot;,sans-serif">.&nbsp; Please include a name and a reference to the CCDC with the submitted inquiry.</span></span></p>
