    <p><span style="font-size:12pt"><span style="background-color:white"><span style="font-family:&quot;Times New Roman&quot;,serif"><span style="font-size:11.0pt"><span style="font-family:&quot;Calibri&quot;,sans-serif"><span style="color:black">This update includes the addition of Imaging Data Commons (IDC). The IDC is a cloud-based repository of publicly available cancer imaging data co-located with the analysis and exploration tools and resources. This new resource adds the Rhabdomyosarcoma (RMS) Mutation Prediction dataset which contains manifest information on hematoxylin and eosin (H&amp;E) stained images available in IDC.</span></span></span></span></span></span></p><p><span style="font-size:12pt"><span style="background-color:white"><span style="font-family:&quot;Times New Roman&quot;,serif"><span style="font-size:11.0pt"><span style="font-family:&quot;Calibri&quot;,sans-serif"><span style="color:black">The Catalog also updated existing resources to add 4 datasets along with numerous data updates.</span></span></span></span></span></span></p><p><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">Explore the data and site updates in more detail below.</span></span><br />&nbsp;</p><h1><span style="font-size:16pt"><span style="font-family:&quot;Calibri Light&quot;,sans-serif"><span style="color:#2f5496">Data Updates</span></span></span></h1><h2><span style="font-size:13pt"><span style="font-family:&quot;Calibri Light&quot;,sans-serif"><span style="color:#2f5496">New Participating Resource and Dataset</span></span></span></h2><p><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif"><span style="background-color:white"><span style="color:black">The CCDC has added&nbsp;<strong><span style="font-family:&quot;Calibri&quot;,sans-serif">1</span></strong>&nbsp;new Data Repository resource.</span></span></span></span></p><ul><li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">Imaging Data Commons (IDC)</span></span></li></ul><p>&nbsp;</p><h2><span style="font-size:13pt"><span style="font-family:&quot;Calibri Light&quot;,sans-serif"><span style="color:#2f5496">Existing Participating Resources and Datasets</span></span></span></h2><p><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif"><strong><span style="background-color:white"><span style="font-family:&quot;Calibri&quot;,sans-serif"><span style="color:black">7&nbsp;</span></span></span></strong><span style="background-color:white"><span style="color:black">existing resources have been updated with additional<strong>&nbsp;</strong>data and information.</span></span></span></span></p><ul><li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">Childhood Cancer Data Initiative (CCDI)</span></span><ul style="list-style-type:circle"><li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">Updated sample counts for Molecular Characterization Initiative (MCI)</span></span></li><li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">Added case counts for National Childhood Cancer Registry Explorer</span></span></li></ul></li><li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">Genomic Data Commons (GDC)</span></span><ul style="list-style-type:circle"><li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif"><strong>New dataset </strong>- Molecular Analysis for Therapy Choice Program (MATCH) </span></span></li><li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">Updated case counts, case disease diagnosis information, and sample counts for Cancer Genome Characterization Initiative (CGCI), Clinical Proteomic Tumor Analysis Consortium (CPTAC), The Cancer Genome Atlas (TCGA), and Human Cancer Models Initiative (HCMI) </span></span></li></ul></li><li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">Kids First Data Resource</span></span><ul style="list-style-type:circle"><li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif"><strong>New dataset </strong>&ndash; Kids First: Intracranial Germ Cell</span></span></li><li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">Updated case counts, case disease diagnosis information, and sample counts for Kids First: Leukemia &amp; Heart Defects in Down Syndrome</span></span></li></ul></li><li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">Pediatric Cancer Data Commons (PCDC)</span></span><ul style="list-style-type:circle"><li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif"><strong>New dataset </strong>&ndash; Hodgkin Lymphoma Data Collaboration (NODAL)</span></span></li><li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">Updated case counts and case disease diagnosis information for International Neuroblastoma Risk Group (INRG)</span></span></li></ul></li><li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">Population-based Research to Optimize the Screening Process (PROSPR)</span></span><ul style="list-style-type:circle"><li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif"><strong>New dataset </strong>- PROSPR 2 - METRICS Cervical Cancer Restricted Use Dataset </span></span></li><li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">Removed PROSPR 1 Breast Cancer Public Use Dataset, PROSPR 1 Cervical Cancer Public Use Dataset, and PROSPR 2 Cervical Cancer Public Use Dataset</span></span></li></ul></li><li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">St. Jude Cloud</span></span><ul style="list-style-type:circle"><li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">Updated case counts, case disease diagnosis information, and sample counts for Real-Time Clinical Genomics</span></span></li></ul></li><li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">Surveillance, Epidemiology, and End Results Program (SEER)</span></span><ul style="list-style-type:circle"><li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">Updated case counts</span></span></li></ul></li></ul><p>&nbsp;</p><h1><span style="font-size:16pt"><span style="font-family:&quot;Calibri Light&quot;,sans-serif"><span style="color:#2f5496">General Site Updates</span></span></span></h1><ul><li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">The Glossary has been updated with new acronyms and abbreviations. </span></span></li><li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">The User Guide is updated to reflect new and updated resource information.</span></span></li></ul><p>&nbsp;</p><h1><span style="font-size:16pt"><span style="font-family:&quot;Calibri Light&quot;,sans-serif"><span style="color:#2f5496">Search Catalog</span></span></span></h1><ul><li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">The Search Catalog export file has been expanded and updated to make information more accessible.</span></span><ul style="list-style-type:circle"><li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">The identifiers for dbGaP, GEO, Clinical Trial.gov, and SRA are now listed as unique columns.</span></span></li><li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">The export now includes a unique column for the Data Repository URL, as well as columns for dbGaP, GEO, Clinical Trial.gov, and SRA URLs.</span></span></li><li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">Grant Name and Grant ID are now listed in unique columns.</span></span></li></ul></li></ul><p>&nbsp;</p><h1><span style="font-size:16pt"><span style="font-family:&quot;Calibri Light&quot;,sans-serif"><span style="color:#2f5496">Additional Support and Inquiries</span></span></span></h1><p><span style="font-size:11.0pt"><span style="font-family:&quot;Calibri&quot;,sans-serif">Users requiring any additional support or with any questions about the CCDC can contact the Childhood Cancer Data Initiative at </span></span><span style="font-size:11.0pt"><span style="font-family:&quot;Calibri&quot;,sans-serif"><a href="mailto:NCIChildhoodCancerDataInitiative@mail.nih.gov"><span style="color:#0563c1">NCIChildhoodCancerDataInitiative@mail.nih.gov</span></a></span></span><span style="font-size:11.0pt"><span style="font-family:&quot;Calibri&quot;,sans-serif">.&nbsp; Please include a name and a reference to the CCDC with the submitted inquiry.</span></span></p>

