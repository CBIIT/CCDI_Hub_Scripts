  - >
    <p><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">The National Cancer Institute is pleased to announce an update to the Childhood Cancer Data Catalog website: <a href="https://datacatalog.ccdi.cancer.gov/" style="color:#0563c1; text-decoration:underline">https://datacatalog.ccdi.cancer.gov/</a>.</span></span></p><p><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">This update includes the addition of 3 new resources: All of Us, Greehey Children's Cancer Research Institute Xenograft & Cell-Lines Core, and the Surveillance, Epidemiology, and End Results (SEER) program. With these new resources and updates to the CCDI and dbGaP resources, the catalog has added 11 new datasets. Additionally, the Catalog release includes numerous updates to the data and information for 7 existing resources across multiple datasets.</span></span></p><p><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">Those looking to access CCDI data now have a new direct link to CCDI Studies in the menu bar.</span></span></p><h1><span style="font-size:16pt"><span style="font-family:&quot;Calibri Light&quot;,sans-serif"><span style="color:#2f5496">Data Updates</span></span></span></h1><h2><span style="font-size:13pt"><span style="font-family:&quot;Calibri Light&quot;,sans-serif"><span style="color:#2f5496">New Participating Resource and Datasets</span></span></span></h2><p><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">The CCDC has added <strong>3</strong> new resources that include <strong>3</strong> new datasets.</span></span></p><ul><li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif"><span style="color:black">All of Us</span></span></span><ul style="list-style-type:circle"><li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif"><strong><span style="color:black">New dataset </span></strong><span style="color:black">- All of Us</span></span></span></li></ul></li><li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif"><span style="color:black">Greehey Children's Cancer Research Institute Xenograft & Cell-Lines Core</span></span></span><ul style="list-style-type:circle"><li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif"><strong><span style="color:black">New dataset </span></strong><span style="color:black">- Pediatric Preclinical Testing Program</span></span></span></li></ul></li><li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif"><span style="color:black">Surveillance, Epidemiology, and End Results (SEER) Program</span></span></span><ul style="list-style-type:circle"><li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif"><strong><span style="color:black">New dataset </span></strong><span style="color:black">- Surveillance, Epidemiology, and End Results Program</span></span></span></li></ul></li></ul><h2><span style="font-size:13pt"><span style="font-family:&quot;Calibri Light&quot;,sans-serif"><span style="color:#2f5496">Existing Participating Resources and Datasets</span></span></span></h2><p><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif"><strong>7 </strong>existing resources have been updated with additional<strong> </strong>data and information, including <strong>8</strong> new datasets. </span></span></p><ul><li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">Childhood Cancer Data Initiative (CCDI)</span></span><ul style="list-style-type:circle"><li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif"><strong><span style="color:black">New dataset </span></strong><span style="color:black">– Clonal Evolution During Metastatic Spread in High-Risk Neuroblastoma</span></span></span></li><li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif"><strong><span style="color:black">New dataset </span></strong><span style="color:black">- Comprehensive Genomic Sequencing of Pediatric Cancer Cases (CMRI/KUCC)</span></span></span></li><li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">Updated case counts and repository information for the Molecular Characterization Initiative</span></span></li></ul></li><li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">The database of Genotypes and Phenotypes (dbGaP)</span></span><ul style="list-style-type:circle"><li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif"><strong><span style="color:black">New dataset </span></strong><span style="color:black">- </span>Genomic Landscape of Pediatric Germ Cell Tumors</span></span></li><li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif"><strong><span style="color:black">New dataset </span></strong><span style="color:black">- </span>Circulating Tumor DNA Sequencing Provides Comprehensive Mutation Profiling for Pediatric Central Nervous System Tumors</span></span></li><li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif"><strong><span style="color:black">New dataset </span></strong><span style="color:black">- </span>RNA-Sequencing of B-Lymphoblastic Leukemia with Glucocorticoids and PI3K Delta Inhibition</span></span></li><li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif"><strong><span style="color:black">New dataset </span></strong><span style="color:black">- </span>Targeted Long-Read Sequencing of the Ewing Sarcoma 6p25.1 Susceptibility Locus</span></span></li><li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif"><strong><span style="color:black">New dataset </span></strong><span style="color:black">- </span>RB1 Loss Triggers Dependence on ESRRG in Retinoblastoma</span></span></li><li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif"><strong><span style="color:black">New dataset </span></strong><span style="color:black">- </span>Circulating Tumor DNA in Intermediate Risk Rhabdomyosarcoma</span></span></li><li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">Multiple datasets were updated to include a GEO Study Identifier</span></span></li></ul></li><li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">Genomic Data Commons (GDC)</span></span><ul style="list-style-type:circle"><li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">Updated case counts for multiple datasets</span></span></li></ul></li><li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">MyPART</span></span><ul style="list-style-type:circle"><li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">Updated Publications and clinical trial URLs in the MyPART dataset</span></span></li></ul></li><li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">Oncogenomics</span></span><ul style="list-style-type:circle"><li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">Updated case counts for multiple datasets</span></span></li></ul></li><li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">Pediatric Cancer Data Commons (PCDC)</span></span><ul style="list-style-type:circle"><li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">Updated case counts for multiple datasets</span></span></li></ul></li><li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">Texas KidsCanSeq</span></span><ul style="list-style-type:circle"><li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">Updated counts and an added dbGaP ID to the Texas KidsCanSeq dataset </span></span></li></ul></li></ul><h1><span style="font-size:16pt"><span style="font-family:&quot;Calibri Light&quot;,sans-serif"><span style="color:#2f5496">General Site Updates</span></span></span></h1><ul><li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">A direct link to the Childhood Cancer Data Initiative resource was added to the menu bar</span></span><ul style="list-style-type:circle"><li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">The ‘CCDI Studies’ link will navigate a user directly to the CCDI resource page</span></span></li></ul></li><li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">Site elements have been updated with additional HTML tagging </span></span></li></ul><p style="margin-left:48px">&nbsp;</p><h1><span style="font-size:16pt"><span style="font-family:&quot;Calibri Light&quot;,sans-serif"><span style="color:#2f5496">Additional Support and Inquiries</span></span></span></h1><p><span style="font-size:12pt"><span style="font-family:&quot;Times New Roman&quot;,serif"><span style="font-size:11.0pt"><span style="font-family:&quot;Calibri&quot;,sans-serif">Users requiring any additional support or with any questions about the CCDC can contact Childhood Cancer Data Initiative at </span></span><a href="mailto:NCIChildhoodCancerDataInitiative@mail.nih.gov" style="color:#0563c1; text-decoration:underline"><span style="font-size:11.0pt"><span style="font-family:&quot;Calibri&quot;,sans-serif"><span style="color:#0563c1">NCIChildhoodCancerDataInitiative@mail.nih.gov</span></span></span></a><span style="font-size:11.0pt"><span style="font-family:&quot;Calibri&quot;,sans-serif">. Please include a name and a reference to the CCDC with the submitted inquiry.</span></span></span></span></p>
