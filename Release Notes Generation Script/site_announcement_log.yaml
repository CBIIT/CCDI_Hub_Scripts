    <p><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">The National Cancer Institute is pleased to announce the addition of the CCDI resource to the Childhood Cancer Data Catalog website: <a href="https://datacatalog.ccdi.cancer.gov/" style="color:#0563c1; text-decoration:underline">https://datacatalog.ccdi.cancer.gov/</a>. </span></span></p> <p><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">With the addition of the CCDI project (4) as well as updates to the dbGaP (46), GDC (1), and TCIA (1) resources the catalog now includes 52 new datasets. &nbsp;Additionally, there is now a site-wide scroll back to top button in the lower right-hand corner to improve site navigation.</span></span></p> <h1><span style="font-size:16pt"><span style="font-family:&quot;Calibri Light&quot;,sans-serif"><span style="color:#2f5496">Data Updates</span></span></span></h1> <h2><span style="font-size:13pt"><span style="font-family:&quot;Calibri Light&quot;,sans-serif"><span style="color:#2f5496">New Participating Resource and Datasets</span></span></span></h2> <p><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">The CCDC has added <strong>1</strong> new resource that include <strong>4</strong> new datasets.</span></span></p> <ul> <li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif"><span style="color:black">Childhood Cancer Data Initiative (CCDI) </span></span></span> <ul style="list-style-type:circle"> <li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif"><strong><span style="color:black">New dataset</span></strong><span style="color:black"> - NCI CCSG CCDI Supplement Additional Genomic Submission</span></span></span></li> <li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif"><strong><span style="color:black">New dataset</span></strong><span style="color:black"> - UCSF Database for the Advancement of JMML - Integration of Metadata with &quot;Omic&quot; Data</span></span></span></li> <li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif"><strong><span style="color:black">New dataset</span></strong><span style="color:black"> - Feasibility and Clinical Utility of Whole Genome Profiling in Pediatric and Young Adult Cancers</span></span></span></li> <li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif"><strong><span style="color:black">New dataset</span></strong><span style="color:black"> - Childhood Cancer Data Initiative (CCDI): Molecular Characterization Initiative </span></span></span></li> </ul> </li> </ul> <h2><span style="font-size:13pt"><span style="font-family:&quot;Calibri Light&quot;,sans-serif"><span style="color:#2f5496">Existing Participating Resources and Datasets</span></span></span></h2> <p><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif"><strong>7 </strong>existing resources have been updated to include the addition of<strong> 48 </strong>new datasets and numerous updates to existing datasets<strong>.</strong></span></span></p> <ul> <li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">The Cancer Imaging Archive (TCIA)</span></span> <ul style="list-style-type:circle"> <li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif"><strong><span style="background-color:white"><span style="font-family:&quot;Calibri&quot;,sans-serif"><span style="color:black">New dataset</span></span></span></strong><span style="background-color:white"><span style="color:black">&nbsp;-&nbsp;</span></span>Annotations for Chemotherapy and Radiation Therapy in Treating Young Patients with Newly Diagnosed, Previously Untreated, High-Risk Medulloblastoma/PNET (ACNS0332-Tumor-Annotations)</span></span></li> </ul> </li> <li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">Childhood Cancer Survivor Study (CCSS)</span></span> <ul style="list-style-type:circle"> <li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">Updated Data Access link</span></span></li> </ul> </li> <li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">The database of Genotypes and Phenotypes (dbGaP)</span></span> <ul style="list-style-type:circle"> <li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif"><strong>New dataset </strong>- A Comprehensive Genomic Study of Pediatric Malignancy</span></span></li> <li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif"><strong>New dataset </strong>- Analysis of Somatic Mutations in Pediatric AML FAB-M7 Subtype by Whole Transcriptome Sequencing</span></span></li> <li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif"><strong>New dataset </strong>- Characterizing TP53 and PPM1D Mutations as Resistance Drivers to Radiation Therapy in Diffuse Intrinsic Pontine Gliomas</span></span></li> <li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif"><strong>New dataset </strong>- Defining and Overcoming Intrinsic T Cell Dysfunction to Enable Pediatric Immunotherapy</span></span></li> <li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif"><strong>New dataset </strong>-<strong> </strong>DNA Methylation Characterization of Fusion-Positive and Fusion-Negative Rhabdomyosarcoma</span></span></li> <li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif"><strong>New dataset </strong>-<strong> </strong>Elucidating Transcription Regulation by Epigenetics in Neuroblastoma</span></span></li> <li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif"><strong>New dataset </strong>-<strong> </strong>Exome Sequencing of Childhood Wilms Tumor</span></span></li> <li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif"><strong>New dataset </strong>-<strong> </strong>Exome Sequencing of Pleuropulmonary Blastoma</span></span></li> <li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif"><strong>New dataset </strong>-<strong> </strong>Gabriella Miller Kids First Pediatric Research Program for Infantile Hemangiomas Associated with Multi-Organ Structural Birth Defects</span></span></li> <li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif"><strong>New dataset</strong> - Gene Variants in Pheochromocytoma and Paraganglioma</span></span></li> <li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif"><strong>New dataset</strong> - Genetic Underpinnings of Ethnic Disparities in Bone Toxicities Between Hispanic and Non-Hispanic Children Treated for Acute Lymphoblastic Leukemia</span></span></li> <li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif"><strong>New dataset</strong> - Genome-Wide Association Study of Relapse of Childhood Acute Lymphoblastic Leukemia</span></span></li> <li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif"><strong>New dataset </strong>-<strong> </strong>Genomic Analysis of Fibrolamellar Hepatocellular Carcinoma</span></span></li> <li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif"><strong>New dataset </strong>-<strong> </strong>Genomic Analysis of Pediatric Low Grade Gliomas</span></span></li> <li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif"><strong>New dataset </strong>-<strong> </strong>Genomic Characterization of Pediatric Low-Grade Gliomas</span></span></li> <li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif"><strong>New dataset </strong>-<strong> </strong>Genomic Profiling of Relapsed and Refractory Childhood Cancers</span></span></li> <li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif"><strong>New dataset </strong>-<strong> </strong>Genomic Sequencing of Ewing Sarcoma</span></span></li> <li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif"><strong>New dataset </strong>-<strong> </strong>Genomic Sequencing of Pediatric Rhabdoid Cancers</span></span></li> <li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif"><strong>New dataset </strong>-<strong> </strong>Genomics of Pediatric Renal Medullary Carcinomas</span></span></li> <li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif"><strong>New dataset </strong>-<strong> </strong>Germline and Somatic Genetic Landscape of Pediatric Rhabdomyosarcoma</span></span></li> <li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif"><strong>New dataset </strong>-<strong> </strong>Human Pilocytic Astrocytoma Single Cell RNA Sequencing</span></span></li> <li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif"><strong>New dataset </strong>-<strong> </strong>Hyperdiploid Acute Lymphoblastic Leukemia RNA-Seq</span></span></li> <li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif"><strong>New dataset </strong>-<strong> </strong>Identification of 22 Novel Loci Associated with Susceptibility to Testicular Germ Cell Tumors</span></span></li> <li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif"><strong>New dataset </strong>-<strong> </strong>Mechanisms of Chemotherapy Resistance in T-ALL</span></span></li> <li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif"><strong>New dataset </strong>-<strong> </strong>Mechanisms of Therapy Driven Clonal Evolution in Oncogenic RAS Mutant Relapsed Acute Lymphoblastic Leukemia</span></span></li> <li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif"><strong>New dataset </strong>-<strong> </strong>Medulloblastoma exome sequence analysis</span></span></li> <li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif"><strong>New dataset </strong>-<strong> </strong>Methotrexate Clearance GWAS in Acute Lymphoblastic Leukemia (ALL) Patients</span></span></li> <li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif"><strong>New dataset </strong>-<strong> </strong>Modelling Multi-Dimensional ClinOmics for Precision Therapy of Children and Adolescent Young Adults with Relapsed and Refractory Cancer: A report from the Center for Cancer Research</span></span></li> <li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif"><strong>New dataset </strong>-<strong> </strong>National Cancer Institute - Population Structure and Natural Selection in the Epidemiology of Burkitt Lymphoma in East African Children and Minors (EMBLEM) study in Uganda</span></span></li> <li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif"><strong>New dataset </strong>-<strong> </strong>Neuroblastoma Genome-Wide Association Study</span></span></li> <li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif"><strong>New dataset </strong>-<strong> </strong>Next generation sequencing of diffuse intrinsic pontine glioma samples to identify recurrent mutations, variations, and expression patterns to define novel therapies</span></span></li> <li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif"><strong>New dataset </strong>-<strong> </strong>Pathogenesis and Immunity in Endemic Burkitt Lymphoma</span></span></li> <li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif"><strong>New dataset </strong>-<strong> </strong>Relapsed Acute Lymphoblastic Leukemia (ALL): Mutational Landscape</span></span></li> <li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif"><strong>New dataset </strong>-<strong> </strong>SLCO1B1 Variants and Methotrexate Clearance</span></span></li> <li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif"><strong>New dataset </strong>-<strong> </strong>Study of Tumor Recurrence Related to the Expression of the PAX3-FOXO1 Oncogenic Transcription Factor in Fusion-Positive Rhabdomyosarcoma</span></span></li> <li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif"><strong>New dataset </strong>-<strong> </strong>The Genetic Basis of Hypodiploid ALL</span></span></li> <li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif"><strong>New dataset </strong>-<strong> </strong>The Genomic Analysis of Medulloblastoma</span></span></li> <li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif"><strong>New dataset </strong>-<strong> </strong>The Genomic Complexity of Early T-Cell Progenitor Acute Lymphoblastic Leukemia</span></span></li> <li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif"><strong>New dataset </strong>-<strong> </strong>The genomic complexity of sporadic and inherited retinoblastoma with a matched orthotopic xenograft</span></span></li> <li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif"><strong>New dataset </strong>-<strong> </strong>The genomics of pilocytic astrocytoma formation in neurofibromatosis type 1</span></span></li> <li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif"><strong>New dataset </strong>-<strong> </strong>The Institute for Genomic Medicine at Nationwide Children&#39;s Hospital Pediatric Cancer and Blood Disorder Project</span></span></li> <li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif"><strong>New dataset </strong>-<strong> </strong>The UC San Diego Chronic Lymphocytic Leukemia (CLL) Study</span></span></li> <li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif"><strong>New dataset </strong>-<strong> </strong>Transcriptome Sequencing of Pediatric Neuroblastoma</span></span></li> <li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif"><strong>New dataset </strong>-<strong> </strong>Whole Exome Sequencing of Craniopharyngioma Tumors at Human Genome Sequencing Center, Baylor College of Medicine</span></span></li> <li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif"><strong>New dataset </strong>-<strong> </strong>Whole genome sequencing of core-binding factor leukemia</span></span></li> <li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif"><strong>New dataset </strong>-<strong> </strong>Whole-exome Sequencing of Intracranial Germ Cell Tumors performed at Human Genome Sequencing Center, Baylor College of Medicine</span></span></li> </ul> </li> <li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">Genomic Data Commons (GDC)</span></span> <ul style="list-style-type:circle"> <li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif"><strong><span style="background-color:white"><span style="font-family:&quot;Calibri&quot;,sans-serif"><span style="color:black">New dataset</span></span></span></strong><span style="background-color:white"><span style="color:black">&nbsp;-&nbsp;MP2PRT: Identification of Genetic Changes Associated with Relapse and/or Adaptive Resistance in Patients Registered as Favorable Histology Wilms Tumor on AREN03B2</span></span></span></span></li> <li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">Updated dataset &ndash; Beat AML</span></span></li> <li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">Updated dataset &ndash; The Cancer Genome Atlas (TCGA)</span></span></li> <li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">Updated dataset &ndash; Clinical Proteomic Tumor Analysis Consortium (CPTAC)</span></span></li> <li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">Updated dataset &ndash; Therapeutically Applicable Research to Generate Effective Treatments (TARGET)</span></span></li> </ul> </li> <li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">Kids First</span></span> <ul style="list-style-type:circle"> <li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">Pediatric Brain Tumor Atlas: CBTN</span></span> <ul style="list-style-type:square"> <li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">Updated Data Repository links</span></span></li> </ul> </li> </ul> </li> <li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">Pediatric Cancer Data Commons</span></span> <ul style="list-style-type:circle"> <li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">International Soft Tissue Sarcoma Consortium (INSTRuCT)</span></span> <ul style="list-style-type:square"> <li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">Updated Project titles </span></span></li> </ul> </li> </ul> </li> <li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">Texas KidsCanSeq</span></span> <ul style="list-style-type:circle"> <li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">Updated the description</span></span></li> </ul> </li> </ul> <h1><span style="font-size:16pt"><span style="font-family:&quot;Calibri Light&quot;,sans-serif"><span style="color:#2f5496">General Site Updates</span></span></span></h1> <ul> <li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">The CCDC site has been updated with a scroll back to top button in the lower right-hand corner.&nbsp; This new button will take users to the top of the page if selected.</span></span></li> <li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">The Glossary has been updated with new acronyms and abbreviations.</span></span></li> <li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">The User Guide is updated to reflect new and updated resource information.</span></span></li> </ul> <h1><span style="font-size:16pt"><span style="font-family:&quot;Calibri Light&quot;,sans-serif"><span style="color:#2f5496">Search Catalog</span></span></span></h1> <ul> <li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">Removed &lsquo;Case ID&rsquo; from the &lsquo;Projects&rsquo; field on Dataset Details page.&nbsp; This text was a relic of digest data entry.</span></span></li> </ul> <h1><span style="font-size:16pt"><span style="font-family:&quot;Calibri Light&quot;,sans-serif"><span style="color:#2f5496">Participating Resources</span></span></span></h1> <ul> <li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">Updated the search cards on the Participating Resource search page so that the &lsquo;external link&rsquo; icon will appears on the same line as the link and not the following.</span></span></li> <li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">Updated the Participating Resource Details page to allow multiple links in the Data Access field.</span></span></li> </ul> <h1><span style="font-size:16pt"><span style="font-family:&quot;Calibri Light&quot;,sans-serif"><span style="color:#2f5496">Additional Support and Inquiries</span></span></span></h1> <p><span style="font-size:12pt"><span style="font-family:&quot;Times New Roman&quot;,serif"><span style="font-size:11.0pt"><span style="font-family:&quot;Calibri&quot;,sans-serif">Users requiring any additional support or with any questions about the CCDC can contact Childhood Cancer Data Initiative at </span></span><a href="mailto:NCIChildhoodCancerDataInitiative@mail.nih.gov" style="color:#0563c1; text-decoration:underline"><span style="font-size:11.0pt"><span style="font-family:&quot;Calibri&quot;,sans-serif"><span style="color:#0563c1">NCIChildhoodCancerDataInitiative@mail.nih.gov</span></span></span></a><span style="font-size:11.0pt"><span style="font-family:&quot;Calibri&quot;,sans-serif">.&nbsp; Please include a name and a reference to the CCDC with the submitted inquiry.</span></span></span></span></p>
- - update
  - 'New Resource: dbGaP'
  - 1.2.1
  - '2022-10-18'
  - Clinical, Genomics/Omics
  - Check out the new dbGaP resource with 6 new datasets.
  - >
    <p><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">The National Cancer Institute is pleased to announce the additional of the dbGaP resource to the Childhood Cancer Data Catalog website: <a href="https://datacatalog.ccdi.cancer.gov/" style="color:#0563c1; text-decoration:underline">https://datacatalog.ccdi.cancer.gov/</a>. </span></span></p> <p><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">This addition includes six new datasets and the re-organization of two existing datasets into the new dbGaP resource. Additionally, CCDC Submission Template glossary has been updated to better assist those looking to submit additional resources.</span></span></p> <h1><span style="font-size:16pt"><span style="font-family:&quot;Calibri Light&quot;,sans-serif"><span style="color:#2f5496">Data Updates</span></span></span></h1> <h2><span style="font-size:13pt"><span style="font-family:&quot;Calibri Light&quot;,sans-serif"><span style="color:#2f5496">New Participating Resource and Datasets</span></span></span></h2> <p><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">The CCDC has added <strong>1</strong> new resource that include <strong>6</strong> new datasets.</span></span></p> <ul> <li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif"><span style="color:black">The database of Genotypes and Phenotypes (dbGaP) </span></span></span> <ul style="list-style-type:circle"> <li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif"><span style="color:black">Osteosarcoma Genomics (OG)</span></span></span></li> <li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif"><span style="color:black">Genomic Sequencing of Ewing&#39;s Sarcoma (ES)</span></span></span></li> <li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif"><span style="color:black">Genomic Sequencing of Pediatric Rhabdomyosarcoma (RMS)</span></span></span></li> <li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif"><span style="color:black">University of Michigan Clinical Sequencing Exploratory Research (CSER)</span></span></span></li> <li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif"><span style="color:black">Genomic and Transcriptomic Landscape of Fibrolamellar Hepatocellular Carcinoma (FL-HCC)</span></span></span></li> <li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif"><span style="color:black">Functionally-defined Therapeutic Targets in Diffuse Intrinsic Pontine Glioma (DIPG)</span></span></span></li> </ul> </li> </ul> <h2><span style="font-size:13pt"><span style="font-family:&quot;Calibri Light&quot;,sans-serif"><span style="color:#2f5496">Existing Participating Resources and Datasets</span></span></span></h2> <p><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif"><strong>3 </strong>resources have been updated and <strong>2 </strong>resources have been removed and their datasets have been moved to the dbGaP resource.</span></span></p> <ul> <li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">Cancer Genome Characterization Initiative (CGCI)</span></span> <ul style="list-style-type:circle"> <li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">Multiple Datasets</span></span> <ul style="list-style-type:square"> <li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">Updated dbGaP study accession information</span></span></li> </ul> </li> </ul> </li> <li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">Genomic Data Commons (GDC)</span></span> <ul style="list-style-type:circle"> <li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">Multiple Datasets</span></span> <ul style="list-style-type:square"> <li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">Updated dbGaP study accession information</span></span></li> </ul> </li> </ul> </li> <li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">Human Tumor Atlas Network (HTAN)</span></span> <ul style="list-style-type:circle"> <li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">Center for Pediatric Tumor Cell Atlas - Children&#39;s Hospital of Philadelphia dataset</span></span> <ul style="list-style-type:square"> <li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">Updated dbGaP study accession information</span></span></li> </ul> </li> </ul> </li> <li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">Removed: The Genomic Landscape of Tuberous Sclerosis Complex (TSC)</span></span> <ul style="list-style-type:circle"> <li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">The Genomic Landscape of Tuberous Sclerosis Complex dataset</span></span> <ul style="list-style-type:square"> <li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">Moved to dbGaP resource</span></span></li> </ul> </li> </ul> </li> <div class="html2pdf__page-break"></div> <li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">Removed: Sequence Read Archive (SRA)</span></span> <ul style="list-style-type:circle"> <li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">Baylor College of Medicine Advancing Sequencing in Childhood Cancer Care dataset</span></span> <ul style="list-style-type:square"> <li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">Moved to dbGap resource</span></span></li> </ul> </li> </ul> </li> </ul> <p>&nbsp;</p> <h1><span style="font-size:16pt"><span style="font-family:&quot;Calibri Light&quot;,sans-serif"><span style="color:#2f5496">General Site Updates</span></span></span></h1> <ul> <li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">The CCDC Submission Template file, available on the About CCDI Data Catalog page, has been updated with new definitions on the Glossary tab.</span></span></li> <li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">Fixed date typo on Site Updates page for the 1.0 release.</span></span></li> <li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">The Glossary has been updated with new acronyms and abbreviations.</span></span></li> <li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">The User Guide was updated with new and removed resource information.</span></span></li> </ul> <p>&nbsp;</p> <h1><span style="font-size:16pt"><span style="font-family:&quot;Calibri Light&quot;,sans-serif"><span style="color:#2f5496">Additional Support and Inquiries</span></span></span></h1> <p><span style="font-size:12pt"><span style="font-family:&quot;Times New Roman&quot;,serif"><span style="font-size:11.0pt"><span style="font-family:&quot;Calibri&quot;,sans-serif">Users requiring any additional support or with any questions about the CCDC can contact Childhood Cancer Data Initiative at </span></span><a href="mailto:NCIChildhoodCancerDataInitiative@mail.nih.gov" style="color:#0563c1; text-decoration:underline"><span style="font-size:11.0pt"><span style="font-family:&quot;Calibri&quot;,sans-serif"><span style="color:#0563c1">NCIChildhoodCancerDataInitiative@mail.nih.gov</span></span></span></a><span style="font-size:11.0pt"><span style="font-family:&quot;Calibri&quot;,sans-serif">.&nbsp; Please include a name and a reference to the CCDC with the submitted inquiry.</span></span></span></span></p>
- - update
  - New Data & Enhanced Search
  - 1.2.0
  - '2022-09-15'
  - Clinical, Genomics/Omics
  - In the 1.2 update you''ll find 19 new datasets, dozens of updates to existing data, and new enhanced search features.
  - >
    <p><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">The National Cancer Institute is pleased to announce an update to the Childhood Cancer Data Catalog website: <a href="https://datacatalog.ccdi.cancer.gov/" style="color:#0563c1; text-decoration:underline">https://datacatalog.ccdi.cancer.gov/</a>. </span></span></p> <p><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">This latest update to the site includes 19 new datasets and updates to 24 of our existing participating resources. The site now features a new site update widget on the homepage and a Site Update page dedicated to tracking changes to site data and features.&nbsp; Additionally, the Search Catalog was updated to enhance search clarity and usability.</span></span></p> <h1><span style="font-size:16pt"><span style="font-family:&quot;Calibri Light&quot;,sans-serif"><span style="color:#2f5496">Data Updates</span></span></span></h1> <h2><span style="font-size:13pt"><span style="font-family:&quot;Calibri Light&quot;,sans-serif"><span style="color:#2f5496">New Participating Resources and Datasets</span></span></span></h2> <p><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">The CCDC has added <strong>5</strong> new resources that include <strong>5</strong> new datasets.</span></span></p> <ul> <li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif"><span style="color:black">Individualized Cancer Therapy Study (iCAT)</span></span></span> <ul style="list-style-type:circle"> <li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif"><span style="color:black">Individualized Cancer Therapy Study</span></span></span></li> </ul> </li> <li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif"><span style="color:black">International Cancer Genome Consortium (ICGC)</span></span></span> <ul style="list-style-type:circle"> <li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif"><span style="color:black">Pediatric Brain Tumor Project</span></span></span></li> </ul> </li> <li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif"><span style="color:black">The Genomic Landscape of Tuberous Sclerosis Complex (TSC)</span></span></span> <ul style="list-style-type:circle"> <li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif"><span style="color:black">The Genomic Landscape of Tuberous Sclerosis Complex</span></span></span></li> </ul> </li> <li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif"><span style="color:black">MicroRNA Childhood Cancer Catalog (M3C)</span></span></span> <ul style="list-style-type:circle"> <li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif"><span style="color:black">MicroRNA Childhood Cancer Catalog</span></span></span></li> </ul> </li> <li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif"><span style="color:black">Molecular Targets Platform</span></span></span> <ul style="list-style-type:circle"> <li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif"><span style="color:black">Molecular Targets Platform</span></span></span></li> </ul> </li> </ul> <h2><span style="font-size:13pt"><span style="font-family:&quot;Calibri Light&quot;,sans-serif"><span style="color:#2f5496">Existing Participating Resources and Datasets</span></span></span></h2> <p><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif"><strong>24 </strong>existing resources have been updated to include the addition of <strong>14&nbsp;</strong>new datasets and numerous updates to existing datasets.</span></span></p> <ul> <li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">Childhood Cancer Survivor Study (CCSS)</span></span> <ul style="list-style-type:circle"> <li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">Childhood Cancer Survivor Study dataset</span></span> <ul style="list-style-type:square"> <li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">Updated publication links</span></span></li> <li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">Updated data repository link</span></span></li> </ul> </li> </ul> </li> <li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">Cancer Genome Characterization Initiative (CGCI)</span></span> <ul style="list-style-type:circle"> <li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">Multiple Datasets</span></span> <ul style="list-style-type:square"> <li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">Updated publications links</span></span></li> <li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">Added and updated data repository links</span></span></li> </ul> </li> </ul> </li> <li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">Clinical Interpretations of Variants in Cancer (CIViC)</span></span> <ul style="list-style-type:circle"> <li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">Clinical Interpretations of Variants in Cancer dataset</span></span> <ul style="list-style-type:square"> <li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">Updated Publications link</span></span></li> </ul> </li> </ul> </li> <li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">Children&#39;s Oncology Group (COG)</span></span> <ul style="list-style-type:circle"> <li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">Children&#39;s Oncology Group dataset</span></span> <ul style="list-style-type:square"> <li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">Removed publications links</span></span></li> <li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">Added clinical trials links</span></span></li> </ul> </li> </ul> </li> <li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">Genomic Data Commons (GDC)</span></span> <ul style="list-style-type:circle"> <li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif"><strong>New dataset</strong> - Radiation-related Genomic Profile of Papillary Thyroid Cancer after the Chernobyl Accident</span></span></li> <li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">Multiple Datasets</span></span> <ul style="list-style-type:square"> <li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">Added publication links</span></span></li> <li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">Added data repository links</span></span></li> </ul> </li> </ul> </li> <li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">Human Cancer Models Initiative (HCMI)</span></span> <ul style="list-style-type:circle"> <li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">HCMI Participants Under 40 Years Old dataset</span></span> <ul style="list-style-type:square"> <li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">Updated data repository link</span></span></li> <li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">Added publications link</span></span></li> </ul> </li> </ul> </li> <li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">Human Tumor Atlas Network (HTAN)</span></span> <ul style="list-style-type:circle"> <li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">Center for Pediatric Tumor Cell Atlas - Children&#39;s Hospital of Philadelphia dataset</span></span> <ul style="list-style-type:square"> <li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">Updated publications link</span></span></li> <li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">Added data repository link</span></span></li> </ul> </li> </ul> </li> <li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">The Jackson Laboratory PDX Models (JAX PDX)</span></span> <ul style="list-style-type:circle"> <li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">Mouse Models of Human Cancer database</span></span> <ul style="list-style-type:square"> <li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">Updated publications link</span></span></li> <li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">Added data repository link</span></span></li> </ul> </li> </ul> </li> <li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">Kids First</span></span> <ul style="list-style-type:circle"> <li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">Multiple Datasets</span></span> <ul style="list-style-type:square"> <li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">Updated dataset description</span></span></li> <li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">Updated publication links</span></span></li> <li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">Added links to dbGaP study accessions</span></span></li> </ul> </li> </ul> </li> <li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">My Pediatric and Adult Rare Tumor network (MyPART)</span></span> <ul style="list-style-type:circle"> <li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">MyPART - My Pediatric and Adult Rare Tumor Network dataset</span></span> <ul style="list-style-type:square"> <li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">Updated publications link</span></span></li> </ul> </li> </ul> </li> <li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">National 