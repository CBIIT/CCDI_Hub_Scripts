    <p><span style="font-size:12pt"><span style="background-color:white"><span style="font-family:&quot;Times New Roman&quot;,serif"><span style="font-size:11.0pt"><span style="font-family:&quot;Calibri&quot;,sans-serif"><span style="color:black">This release of the Catalog includes updates for 5 existing resources with 11 new datasets and other data updates.&nbsp; Among the new dataset are 2 additions to the Childhood Cancer Data Initiative resource: one new project dataset, Genomic Analysis in Pediatric Malignancies, and one new analytic tool set, Center for Computational and Genomic Medicine Analytic Tools.</span></span></span></span></span></span></p><p><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">Explore the data and site updates in more detail below.</span></span><br />&nbsp;</p><h1><span style="font-size:16pt"><span style="font-family:&quot;Calibri Light&quot;,sans-serif"><span style="color:#2f5496">Data Updates</span></span></span></h1><h2><span style="font-size:13pt"><span style="font-family:&quot;Calibri Light&quot;,sans-serif"><span style="color:#2f5496">Existing Participating Resources and Datasets</span></span></span></h2><p><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif"><strong><span style="background-color:white"><span style="font-family:&quot;Calibri&quot;,sans-serif"><span style="color:black">5&nbsp;</span></span></span></strong><span style="background-color:white"><span style="color:black">existing resources have been updated with additional<strong>&nbsp;</strong>data and information.</span></span></span></span></p><ul><li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">cBioPortal for Cancer Genomics</span></span><ul style="list-style-type:circle"><li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif"><strong>New Dataset </strong>&ndash; ALL St. Jude 2015</span></span></li><li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif"><strong>New Dataset </strong>&ndash; ALL St. Jude 2016</span></span></li><li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif"><strong>New Dataset </strong>&ndash; Pediatric Ewing Sarcoma Dana-Farber Cancer Institute</span></span></li><li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif"><strong>New Dataset </strong>&ndash; Ewing Sarcoma Institute Curie</span></span></li><li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif"><strong>New Dataset </strong>&ndash; Medulloblastoma Pediatric Cancer Genome Project</span></span></li><li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif"><strong>New Dataset </strong>&ndash; Pediatric Neuroblastoma MSK</span></span></li></ul></li><li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">Childhood Cancer Data Initiative (CCDI)</span></span><ul style="list-style-type:circle"><li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif"><strong>New Dataset </strong>&ndash; Childhood Cancer Data Initiative (CCDI): Genomic Analysis in Pediatric Malignancies</span></span></li><li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif"><strong>New Dataset </strong>&ndash; Center for Computational and Genomic Medicine Analytic Tools</span></span></li></ul></li><li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">Fibrolamellar Registry</span></span><ul style="list-style-type:circle"><li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">Added dbGaP Study Identifier</span></span></li></ul></li><li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">Texas Pediatric Cancer Drug Testing Core &amp; Pediatric Preclinical In Vivo Testing Consortium</span></span><ul style="list-style-type:circle"><li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">Updated resource description.</span></span></li></ul></li><li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">The database of Genotypes and Phenotypes (dbGaP)</span></span><ul style="list-style-type:circle"><li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif"><strong>New Dataset </strong>&ndash; Circulating Genomic Determinants of Treatment Failure in Hodgkin Lymphoma</span></span></li><li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif"><strong>New Dataset </strong>&ndash; Profiling RNA Translation in Pediatric Medulloblastoma</span></span></li><li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif"><strong>New Dataset </strong>&ndash; Retinoblastoma Aqueous Humor Liquid Biopsy Repository</span></span></li></ul></li></ul><h1><span style="font-size:16pt"><span style="font-family:&quot;Calibri Light&quot;,sans-serif"><span style="color:#2f5496">General Site Updates</span></span></span></h1><ul><li><span style="font-size:11pt"><span style="background-color:white"><span style="color:black"><span style="font-family:Calibri,sans-serif">The &lsquo;Featured Item&rsquo; carousel now includes a pause button.&nbsp; Selecting the button will pause the automatic advancement of the carousel and selecting it a second time will restart the advancement.</span></span></span></span></li><li><span style="font-size:11pt"><span style="background-color:white"><span style="color:black"><span style="font-family:Calibri,sans-serif">The Glossary has been updated with new acronyms and abbreviations.</span></span></span></span></li><li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">The User Guide is updated to reflect new and updated resource information.</span></span></li></ul><p>&nbsp;</p><h1><span style="font-size:16pt"><span style="font-family:&quot;Calibri Light&quot;,sans-serif"><span style="color:#2f5496">Additional Support and Inquiries</span></span></span></h1><p><span style="font-size:12pt"><span style="font-family:&quot;Times New Roman&quot;,serif"><span style="font-size:11.0pt"><span style="font-family:&quot;Calibri&quot;,sans-serif">Users requiring any additional support or with any questions about the CCDC can contact the Childhood Cancer Data Initiative at </span></span><a href="mailto:NCIChildhoodCancerDataInitiative@mail.nih.gov"><span style="font-size:11.0pt"><span style="font-family:&quot;Calibri&quot;,sans-serif"><span style="color:#0563c1">NCIChildhoodCancerDataInitiative@mail.nih.gov</span></span></span></a><span style="font-size:11.0pt"><span style="font-family:&quot;Calibri&quot;,sans-serif">.&nbsp; Please include a name and a reference to the CCDC with the submitted inquiry.</span></span></span></span></p>

