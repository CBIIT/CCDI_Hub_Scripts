    <p><span style="font-size:12pt"><span style="background-color:white"><span style="font-family:&quot;Times New Roman&quot;,serif"><span style="font-size:11.0pt"><span style="font-family:&quot;Calibri&quot;,sans-serif"><span style="color:black">This update includes the addition of Biorepository as a new Resource Type. This new resource type expands the available resources to include resources that act as libraries for biospecimens, allowing for the biospecimens to be available for use in future research. This initial update includes both national and international biorepositories.</span></span></span></span></span></span></p><p><span style="font-size:12pt"><span style="background-color:white"><span style="font-family:&quot;Times New Roman&quot;,serif"><span style="font-size:11.0pt"><span style="font-family:&quot;Calibri&quot;,sans-serif"><span style="color:black">The Catalog is also expanded to add 4 new resources and 10 new datasets.</span></span></span></span></span></span></p><p><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">Explore the data and site updates in more detail below.</span></span></p><h1><span style="font-size:16pt"><span style="font-family:&quot;Calibri Light&quot;,sans-serif"><span style="color:#2f5496">Data Updates</span></span></span></h1><h2><span style="font-size:13pt"><span style="font-family:&quot;Calibri Light&quot;,sans-serif"><span style="color:#2f5496">New Participating Resource and Dataset</span></span></span></h2><p><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">The CCDC has added <strong>4</strong> new resources with connections to 9 biorepositories. These resources are all part of the new Resource Type &lsquo;Biorepository.&rsquo;</span></span></p><ul><li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif"><span style="color:black">Norwegian Childhood Cancer Biobank (NCCB)</span></span></span></li><li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif"><span style="background-color:white"><span style="color:#444444">Swedish Childhood Tumor Biobank (BTB)</span></span></span></span></li><li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif"><span style="background-color:white"><span style="color:#444444">The Biopathology Center (BPC)</span></span></span></span><ul style="list-style-type:circle"><li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif"><span style="color:black">Children&#39;s Oncology Group Biorepository</span></span></span></li><li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif"><span style="color:black">Cooperative Human Tissue Network</span></span></span></li><li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif"><span style="color:black">NRG Oncology Biospecimen Bank</span></span></span></li><li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif"><span style="color:black">Gynecologic Oncology Group Foundation</span></span></span></li><li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif"><span style="color:black">SWOG</span></span></span></li><li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif"><span style="color:black">Sarcoma Alliance for Research through Collaboration</span></span></span></li></ul></li><li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif"><span style="color:black">VIVO Biobank</span></span></span></li></ul><p style="margin-left:48px">&nbsp;</p><p style="margin-left:48px">&nbsp;</p><h2><span style="font-size:13pt"><span style="font-family:&quot;Calibri Light&quot;,sans-serif"><span style="color:#2f5496">Existing Participating Resources and Datasets</span></span></span></h2><p><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif"><strong><span style="background-color:white"><span style="font-family:&quot;Calibri&quot;,sans-serif"><span style="color:black">4&nbsp;</span></span></span></strong><span style="background-color:white"><span style="color:black">existing resources have been updated with additional<strong>&nbsp;</strong>data and information.</span></span></span></span></p><ul><li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">Childhood Cancer Data Initiative (CCDI)</span></span><ul style="list-style-type:circle"><li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">Updated case counts, case disease diagnosis information, and sample counts for Molecular Characterization Initiative (MCI).</span></span></li></ul></li><li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">Cancer Genome Characterization Initiative (CGCI)</span></span><ul style="list-style-type:circle"><li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">Updated case counts, case disease diagnosis information, and sample counts for Burkitt Lymphoma Genome Sequencing Project (BLGSP).</span></span></li><li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif"><strong>New dataset </strong>- HIV+ Tumor Molecular Characterization Project - Cervical Cancer</span></span></li></ul></li><li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif"><span style="font-size:10.5pt"><span style="background-color:white"><span style="font-family:&quot;Segoe UI&quot;,sans-serif"><span style="color:#172b4d">Pediatric MATCH</span></span></span></span></span></span></li><ul style="list-style-type:circle"><li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">Added additional Clinical Trial Identifier. </span></span></li></ul></li><li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">National Childhood Cancer Registry Explorer</span></span><ul style="list-style-type:circle"><li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">&lsquo;National Childhood Cancer Registry Explorer&rsquo; dataset was moved to the CCDI resource.</span></span></li></ul></li></ul><p>&nbsp;</p><h1><span style="font-size:16pt"><span style="font-family:&quot;Calibri Light&quot;,sans-serif"><span style="color:#2f5496">General Site Updates</span></span></span></h1><ul><li><span style="font-size:11pt"><span style="background-color:white"><span style="color:black"><span style="font-family:Calibri,sans-serif">The CCDC Submission Template file, available on the About CCDI Data Catalog page, has been updated with new Resource Type, Biorepository, and a new Data Content Type, Biospecimen.&nbsp; Additionally, the &lsquo;Repository&rsquo; Resource Type has been updated to be &lsquo;Data Repository.&rsquo;</span></span></span></span></li><li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">The Glossary has been updated with new acronyms and abbreviations.</span></span></li><li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">The User Guide is updated to reflect new and updated resource information.</span></span></li></ul><p>&nbsp;</p><h1><span style="font-size:16pt"><span style="font-family:&quot;Calibri Light&quot;,sans-serif"><span style="color:#2f5496">Participating Resources</span></span></span></h1><ul><li><span style="font-size:11pt"><span style="background-color:white"><span style="color:black"><span style="font-family:Calibri,sans-serif">Users can now filter by the new Resource Type &lsquo;Biorepository.&rsquo;</span></span></span></span></li><li><span style="font-size:11pt"><span style="background-color:white"><span style="font-family:Calibri,sans-serif"><span style="color:black">In the filter, the &lsquo;</span><span style="color:black">Repository&rsquo; Resource Type has been updated to be &lsquo;Data Repository.&rsquo;</span></span></span></span></li></ul><h1><span style="font-size:16pt"><span style="font-family:&quot;Calibri Light&quot;,sans-serif"><span style="color:#2f5496">Additional Support and Inquiries</span></span></span></h1><p><span style="font-size:12pt"><span style="font-family:&quot;Times New Roman&quot;,serif"><span style="font-size:11.0pt"><span style="font-family:&quot;Calibri&quot;,sans-serif">Users requiring any additional support or with any questions about the CCDC can contact the Childhood Cancer Data Initiative at </span></span><a href="mailto:NCIChildhoodCancerDataInitiative@mail.nih.gov" style="color:#0563c1; text-decoration:underline"><span style="font-size:11.0pt"><span style="font-family:&quot;Calibri&quot;,sans-serif"><span style="color:#0563c1">NCIChildhoodCancerDataInitiative@mail.nih.gov</span></span></span></a><span style="font-size:11.0pt"><span style="font-family:&quot;Calibri&quot;,sans-serif">.&nbsp; Please include a name and a reference to the CCDC with the submitted inquiry.</span></span></span></span></p>
