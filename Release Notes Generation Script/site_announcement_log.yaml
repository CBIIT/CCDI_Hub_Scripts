pan style="font-size:11pt"><span style="font-family:Calibri,sans-serif"><strong>New dataset</strong> - Pan-Acute Lymphoblastic Leukemia (PanALL)</span></span></li> <li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif"><strong>New dataset</strong> - Pediatric Therapy-related Myeloid Neoplasms (tMN)</span></span></li> <li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif"><strong>New dataset</strong> - Pediatric Acute Myeloid Leukemia (PedAML)</span></span></li> <li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif"><strong>New dataset</strong> - Pediatric Brain Tumor Program (PBTP)</span></span></li> <li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif"><strong>New dataset</strong> - Genomics and transcriptomics of relapsed pediatric AML (RPAML)</span></span></li> <li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">Multiple Datasets</span></span> <ul style="list-style-type:square"> <li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">Updated publications links</span></span></li> <li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">Added data repository links</span></span></li> </ul> </li> </ul> </li> <li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">Therapeutically Applicable Research to Generate Effective Treatments (TARGET)</span></span> <ul style="list-style-type:circle"> <li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">Multiple Datasets</span></span> <ul style="list-style-type:square"> <li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">Added links to dbGaP study accessions</span></span></li> <li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">Added publication links</span></span></li> <li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">Added data repository links</span></span></li> </ul> </li> </ul> </li> <li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">The Cancer Imaging Archive (TCIA)</span></span> <ul style="list-style-type:circle"> <li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif"><strong>New dataset</strong> - Combination Chemotherapy and Radiation Therapy in Treating Young Patients With Newly Diagnosed Hodgkin Lymphoma (AHOD0831)</span></span></li> <li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">Multiple Datasets</span></span> <ul style="list-style-type:square"> <li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">Updated publications links</span></span></li> <li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">Added data repository links</span></span></li> </ul> </li> </ul> </li> <li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">Texas KidsCanSeq</span></span> <ul style="list-style-type:circle"> <li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">Texas KidsCanSeq dataset</span></span> <ul style="list-style-type:square"> <li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">Added publications link</span></span></li> </ul> </li> </ul> </li> <li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">Treehouse Childhood Cancer Initiative</span></span> <ul style="list-style-type:circle"> <li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif"><strong>New dataset</strong> - Cell Line Compendium v2 (Decemember 2019)</span></span></li> <li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif"><strong>New dataset</strong> - Patient-Derived Xenograft Compendium PolyA v22.03 (March 2022)</span></span></li> <li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif"><strong>New dataset</strong> - Patient-Derived Xenograft Compendium Ribodeplete v22.03 (March 2022)</span></span></li> <li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif"><strong>New dataset</strong> - Tumor Compendium v9 Public Ribodeplete (March 2019)</span></span></li> <li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">Multiple Datasets</span></span> <ul style="list-style-type:square"> <li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">Updated publications links</span></span></li> <li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">Added data repository links</span></span></li> </ul> </li> </ul> </li> </ul> <h1><span style="font-size:16pt"><span style="font-family:&quot;Calibri Light&quot;,sans-serif"><span style="color:#2f5496">General Site Updates</span></span></span></h1> <ul> <li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">A new Featured Items widget has been added to the homepage.&nbsp; The new widget highlights site changes and shares information related to the CCDI.</span></span></li> <li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">A new Site Updates page, available under the About menu, was added to share information on site data and feature changes. </span></span> <ul style="list-style-type:circle"> <li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">Site updates are listed in chronological order from newest to oldest.</span></span></li> <li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">Each update appears as a scrollable entry listing site updates and changes.</span></span></li> <li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">Updates can be exported as a PDF.</span></span></li> </ul> </li> <li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">The site header and menu bar have been updated to float at the top of the site pages.</span></span></li> <li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">External links, links that navigate away from <a href="https://datacatalog.ccdi.cancer.gov/" style="color:#0563c1; text-decoration:underline">https://datacatalog.ccdi.cancer.gov/</a> domain, are now marked with an icon and will open in a new tab or window.</span></span></li> <li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">Site free text search fields (Search Catalog &amp; Documentation Search) now include a clear icon (&lsquo;X&rsquo;) that will clear the field of all typed text. Note: &nbsp;&nbsp;This icon will not clear or reset a search. The &ldquo;X&rdquo; clears the search terms from the search field allowing data entry of different text.</span></span></li> <li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">The site tooltips were updated to address a rare issue where the definition would obscure the word being defined.</span></span></li> <li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">The Homepage carousel now includes all available resources on the site (up from 10).&nbsp; These resources will automatically advance every few seconds.</span></span></li> <li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">Homepage text was updated to better reflect the information available on the site</span></span></li> <li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">The Documentation Search page no longer includes a pagination bar when one is not needed. </span></span></li> <li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">The Glossary has been updated with new acronyms and abbreviations.</span></span></li> <li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">The User Guide file name and URL have been updated to be the document name.</span></span></li> </ul> <h1><span style="font-size:16pt"><span style="font-family:&quot;Calibri Light&quot;,sans-serif"><span style="color:#2f5496">Search Catalog </span></span></span></h1> <ul> <li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">The catalog search was enhanced and expanded to search all data fields within a dataset.&nbsp; The additional searched fields will appear on the Card View under the &lsquo;Other Match&rsquo; field.</span></span></li> <li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">The Card View display has been updated for new visual emphasis and search clarity.</span></span> <ul style="list-style-type:circle"> <li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">Searched terms now appear with a blue highlight in addition to bold emphasis.</span></span></li> <li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">The tan highlighting was removed from Case Disease Diagnosis.</span></span></li> <li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">Color emphasis was added to the Case Count (blue) and the Sample Count (green).</span></span></li> <li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">Hyperlinks are now functional.</span></span></li> <li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">Project information will now appear under &lsquo;Other Match&rsquo; and not it&rsquo;s own field on the card display</span></span></li> </ul> </li> <li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">Fixed an issue affecting the csv export not correctly exporting special characters, like apostrophes.</span></span></li> <li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">Fixed two navigation issues where the pagination bar would change size when advancing through results and an issue where the color of the Results per Page dropdown did not match the site.</span></span></li> <li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">The Dataset Details page has been updated to enhance data presentation.</span></span> <ul style="list-style-type:circle"> <li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">Long project names will now display with an adjusted font size to not overwhelm the header</span></span></li> <li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">Case Disease Diagnosis will now appear in mixed case.</span></span></li> <li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">The Additional Data Elements section has been re-arranged to appear in alphabetical order.</span></span></li> <li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">Grant ID and Grant Name have been combined into a single Grant Information table to better associate the ID and the name.</span></span></li> </ul> </li> </ul> <div class="html2pdf__page-break"></div> <h1><span style="font-size:16pt"><span style="font-family:&quot;Calibri Light&quot;,sans-serif"><span style="color:#2f5496">Participating Resources </span></span></span></h1> <ul> <li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">The Research Description filters have been updated so that both the checkbox and label text are clickable to filter the resources.</span></span></li> <li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">The Data Content Type filter was updated to include only currently available types.</span></span></li> <li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">The dataset cards on the Participating Resource Details page have been updated to include Case Disease Diagnosis.</span></span></li> </ul> <h1><span style="font-size:16pt"><span style="font-family:&quot;Calibri Light&quot;,sans-serif"><span style="color:#2f5496">Additional Support and Inquiries</span></span></span></h1> <p><span style="font-size:11.0pt"><span style="font-family:&quot;Calibri&quot;,sans-serif">Users requiring any additional support or with any questions about the CCDC can contact Childhood Cancer Data Initiative at </span></span><span style="font-size:11.0pt"><span style="font-family:&quot;Calibri&quot;,sans-serif"><a href="mailto:NCIChildhoodCancerDataInitiative@mail.nih.gov" style="color:#0563c1; text-decoration:underline"><span style="color:#0563c1">NCIChildhoodCancerDataInitiative@mail.nih.gov</span></a></span></span><span style="font-size:11.0pt"><span style="font-family:&quot;Calibri&quot;,sans-serif">.&nbsp; Please include a name and a reference to the CCDC with the submitted inquiry.</span></span></p>
