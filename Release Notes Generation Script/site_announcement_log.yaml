  - The Childhood Cancer Data Catalog (CCDC) is a new inventory of pediatric oncology data resources.
  - >
    <p><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">The Childhood Cancer Data Catalog (CCDC) is a<span style="color:black"> new resource sharing website </span><span style="color:#212529">developed as part of the </span><span style="color:black">National Cancer Institute&rsquo;s (NCI)</span> <a href="https://www.cancer.gov/research/areas/childhood/childhood-cancer-data-initiative" target="_blank"><span style="color:#0563c1"><u>Childhood Cancer Data Initiative (CCDI)</u></span></a><span style="color:black">.&nbsp; The CCDC is an </span><span style="color:#212529">inventory of pediatric oncology data resources which includes childhood cancer repositories, registries, data commons, web sites, as well as other catalogs that either manage or refer to pediatric cancer data.</span></span></span></p> <p><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif"><span style="color:#212529">The site currently includes 71 unique datasets from 21 different identified participating resources.&nbsp; These datasets represent almost 250,000 participants and 275,000 biological samples.</span></span></span></p> <p><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif"><span style="color:#212529">The initial site release includes the following pages and features:</span></span></span></p> <ul> <li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif"><span style="color:#212529">Home page</span></span></span></li> <li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif"><span style="color:#212529">Search Catalog page</span></span></span> <ul style="list-style-type:circle"> <li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif"><span style="color:#212529">Dataset Details page</span></span></span></li> </ul> </li> <li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif"><span style="color:#212529">Participating Resources page</span></span></span> <ul style="list-style-type:circle"> <li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif"><span style="color:#212529">Participating Resource Details page</span></span></span></li> </ul> </li> <li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif"><span style="color:#212529">About</span></span></span></li> <li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif"><span style="color:#212529">Glossary</span></span></span></li> <li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif"><span style="color:#212529">Document search </span></span></span></li> </ul> <p><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif"><span style="color:#212529">The aim of the CCDC is to help researchers, clinicians, and citizen scientists learn about existing pediatric resources for the development of new biomedical hypothesis, formation of new secondary analysis of data within existing resources, and to provide connections to existing pediatric oncology research sites.&nbsp; </span></span></span></p> <h1><span style="font-size:16pt"><span style="font-family:&quot;Calibri Light&quot;,sans-serif"><span style="color:#2f5496">Home page</span></span></span></h1> <p><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">The Home page is the landing page for users navigating to the site.&nbsp; It provides a brief introduction to the site, allows users to perform a search of the cataloged data resources, and shares a limited number of participating resources available on the site.&nbsp; The home page features a rotating carousel of participating resources available on the site that users can navigate.&nbsp; </span></span></p> <h1><span style="font-size:16pt"><span style="font-family:&quot;Calibri Light&quot;,sans-serif"><span style="color:#2f5496">Search Catalog Page</span></span></span></h1> <p><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">The Search Catalog page allows users to search the 71 individual datasets cataloged within the CCDC. A free text search allows users to filter datasets and review introductory information for each dataset.&nbsp; Additional information about each dataset is further available.</span></span></p> <p><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">The catalog currently includes the following types of datasets.&nbsp; </span></span></p> <div class="html2pdf__page-break"></div> <ul> <li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif"><strong>Collection</strong> - A group of datasets collected for any reason by an organization of researchers, stewards, or stakeholders either pertaining to a common theme or for a common purpose.</span></span></li> <li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif"><strong>Program</strong> - A coherent assembly of plans, project activities, and supporting resources contained within an administrative framework, the purpose of which is to implement an organization&#39;s mission or some specific program-related aspect of that mission.</span></span></li> <li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif"><strong>Project</strong> - Any specifically defined piece of work that is undertaken or attempted to meet the goals of a program and that involves one or more case studies. Also known as a Study or Trial.</span></span></li> </ul> <p><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">Each catalog search results can be exported as a comma-separated values (.csv) file for local manipulation or record keeping.&nbsp; These export files contain all the information and data elements for a dataset that has been gathered for the CCDC. </span></span></p> <h1><span style="font-size:16pt"><span style="font-family:&quot;Calibri Light&quot;,sans-serif"><span style="color:#2f5496">Dataset Details Page</span></span></span></h1> <p><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">Each dataset has a dedicated page containing a listing of all metadata the CCDC site has collected about that dataset.&nbsp; These pages contain both administrative information as well as count and summary data.&nbsp; Administrative information, such as point of contact, is available for further exploration of a dataset.&nbsp; </span></span></p> <p><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">Summary data for each dataset is broken down into either core or additional data elements.&nbsp; Core data elements describe and provide count information about data within the dataset. Additional Data Elements provide supporting information about a dataset.</span></span></p> <p><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">The following core data elements are displayed for each dataset if available:</span></span></p> <ul> <li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">Number of Cases</span></span></li> <li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">Case Sex</span></span></li> <li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">Case Age at Diagnosis</span></span></li> <li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">Case Race</span></span></li> <li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">Case Ethnicity</span></span></li> <li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">Case Disease Diagnosis</span></span></li> <li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">Case Tumor Site</span></span></li> <li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">Case Treatment Administered</span></span></li> <li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">Case Treatment Outcome</span></span></li> <li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">Number of Samples</span></span></li> <li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">Sample Assay Method</span></span></li> <li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">Sample Analyte Type</span></span></li> </ul> <p><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">The following additional data elements are displayed for each dataset if available:</span></span></p> <ul> <li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">Clinical Trial</span></span></li> <li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">Data Repository</span></span></li> <li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">Grant ID</span></span></li> <li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">Grant Name</span></span></li> <li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">Projects</span></span></li> <li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">Project ID</span></span></li> <li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">Published In</span></span></li> </ul> <div class="html2pdf__page-break"></div> <h1><span style="font-size:16pt"><span style="font-family:&quot;Calibri Light&quot;,sans-serif"><span style="color:#2f5496">Participating Resource Page</span></span></span></h1> <p><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">The Participating Resource page allows users to view and filter the 21 resources that CCDC dataset are drawn from. &nbsp;The resource page includes introductory information for each resource available on the site along with a link to view a more detailed information.&nbsp; Resources on the page can be filtered by &lsquo;Resource Type&rsquo; and by &lsquo;Data Content Type&rsquo; to view targeted resources. </span></span></p> <p><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">The catalog currently includes the following types of resources.</span></span></p> <ul> <li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif"><strong>Catalog</strong> - A data catalog is not a data repository but rather a place where data is described with an index to what is available. A collection of digests and references (e.g., URL or POC) to corresponding research artifacts. There is a consistent structure across the collection of digests to facilitate filtering and identifying research artifacts of interest. A catalog contains some combination of Summary Research Data, Summary Clinical Data, Data Overview, and Resource Metadata.</span></span></li> <li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif"><strong>Program</strong> - A coherent assembly of plans, project activities, and supporting resources contained within an administrative framework, the purpose of which is to implement an organization&#39;s mission or some specific program-related aspect of that mission.</span></span></li> <li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif"><strong>Registry</strong> - A cancer registry is an information system designed for the collection, storage, and management of data on persons with cancer. An inventory of individuals or samples, usually focused on a specific diagnosis or condition. In some cases, public health laws require collecting information in registries about individuals who have a specific disease or condition. In other cases, individuals provide information about themselves to these registries voluntarily. Thus, a registry contains Individual Clinical Data, but not Individual Research Data</span></span></li> <li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif"><strong>Research Data Repository </strong>- Biomedical data repositories accept submission of relevant data from the community to store, organize, validate, archive, preserve and distribute the data, in compliance with the FAIR Data Principles. A system for storing multiple research artifacts, provided at least some of the research artifacts contain Individual Research Data. A data repository often contains artifacts from multiple studies. Some data repositories accept research datasets irrespective of the structure of those datasets; other data repositories require all research datasets to conform to a standard reference model.</span></span></li> </ul> <h1><span style="font-size:16pt"><span style="font-family:&quot;Calibri Light&quot;,sans-serif"><span style="color:#2f5496">Participating Resource Detail Page</span></span></span></h1> <p><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">For each participating resource has a page of detailed information about that resource.&nbsp; The Participating Resource Details page contains a listing of metadata the CCDC site has collected about a resource as administrative information, descriptive information, and a listing associated datasets.</span></span></p> <p><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">The administrative data contains the name of the dataset, a link to the resources own data sharing website, and Point of Contact information for the dataset. The descriptive information about the resource includes a resource description, information on a resource&rsquo;s own analysis tools, information on data type of available data, and information on accessing data. Each resource includes a listing of all associated dataset available on the CCDC site.</span></span></p> <div class="html2pdf__page-break"></div> <h1><span style="font-size:16pt"><span style="font-family:&quot;Calibri Light&quot;,sans-serif"><span style="color:#2f5496">About CCDI Data Catalog Page</span></span></span></h1> <p><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">The CCDC About page describes the CCDC and provides information on engaging with CCDI and contributing to the CCDC. The CCDC team is continually looking to expand and improve the inventory of pediatric oncology data resources on the CCDC site. Users with knowledge of additional resources are invited to share that knowledge with the CCDI team, via </span></span><span style="font-size:11.0pt"><span style="font-family:&quot;Calibri&quot;,sans-serif"><a href="mailto:NCIChildhoodCancerDataInitiative@mail.nih.gov" style="color:#0563c1; text-decoration:underline"><span style="color:#0563c1">NCIChildhoodCancerDataInitiative@mail.nih.gov</span></a></span></span><span style="font-size:11.0pt"><span style="font-family:&quot;Calibri&quot;,sans-serif">, and contribute to the advancement of the CCDC. Users are also invited to join the </span></span><span style="font-size:11.0pt"><span style="font-family:&quot;Calibri&quot;,sans-serif"><a href="https://public.govdelivery.com/accounts/USNIHNCI/subscriber/new?topic_id=USNIHNCI_223" style="color:#0563c1; text-decoration:underline" target="_blank">CCDI mailing list</a>.</span></span></p> <h1><span style="font-size:16pt"><span style="font-family:&quot;Calibri Light&quot;,sans-serif"><span style="color:#2f5496">Glossary Page</span></span></span></h1> <p><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">The CCDC Glossary page provides a listing of terms and abbreviations used on the CCDC site. Each glossary term will include a definition and categorization and when available will also include a reference and reference URL.</span></span></p> <h1><span style="font-size:16pt"><span style="font-family:&quot;Calibri Light&quot;,sans-serif"><span style="color:#2f5496">Documentation Search Page</span></span></span></h1> <p><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">The Document Search is a free-text search tool that will search across the three static CCDC site pages - Home page, About CCDI Data Catalog, and the Glossary.&nbsp; User can use the search feature to search the site for a topic of interest. </span></span></p> <p><span style="font-size:12pt"><span style="font-family:&quot;Times New Roman&quot;,serif"><span style="font-size:16.0pt"><span style="font-family:&quot;Calibri Light&quot;,sans-serif"><span style="color:#2f5496">Additional Support and Inquiries</span></span></span>&nbsp;</span></span></p> <p><span style="font-size:11.0pt"><span style="font-family:&quot;Calibri&quot;,sans-serif">Users requiring any additional support or with any questions about the CCDC can contact Childhood Cancer Data Initiative at </span></span><span style="font-size:11.0pt"><span style="font-family:&quot;Calibri&quot;,sans-serif"><a href="mailto:NCIChildhoodCancerDataInitiative@mail.nih.gov" style="color:#0563c1; text-decoration:underline"><span style="color:#0563c1">NCIChildhoodCancerDataInitiative@mail.nih.gov</span></a></span></span><span style="font-size:11.0pt"><span style="font-family:&quot;Calibri&quot;,sans-serif">.&nbsp; Please include a name and a reference to the CCDC with submitted any inquiry</span></span>.</p>