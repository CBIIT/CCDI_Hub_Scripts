    <p style="line-height:107%;margin:0in 0in 8pt;"><span style="color:black;font-family:Calibri, sans-serif;font-size:11pt;">The April update of the Catalog includes the addition of 16 new datasets and the Genomics Evidence Neoplasia Information Exchange (GENIE) resource.<span>&nbsp; </span>The GENIE resource is a publicly accessible cancer registry of real-world clinico-genomic data assembled through data sharing between 19 leading international cancer centers coordinated through the American Association for Cancer Research (AACR).<span>&nbsp;</span></span><span style="font-family:Calibri, sans-serif;font-size:11pt;">&nbsp;<o:p></o:p></span></p> <p style="line-height:107%;margin:0in 0in 8pt;"><span style="color:black;font-family:Calibri, sans-serif;font-size:11pt;">The Catalog now features a new </span><a href="https://datacatalog.ccdi.cancer.gov/contribute"><span style="color:#0563C1;font-family:&quot;Calibri&quot;,sans-serif;font-size:11.0pt;">Contribute to the CCDC</span></a><span style="color:black;font-family:Calibri, sans-serif;font-size:11pt;"> page dedicated to providing information about submitting data and joining the CCDC’s collection of community resources.</span><span style="font-family:Calibri, sans-serif;font-size:11pt;"><span>&nbsp;<o:p></o:p></span></span></p> <p style="line-height:107%;margin:0in;"><span style="font-family:Calibri, sans-serif;font-size:11pt;"><span>Explore the data and site updates in more detail below.</span><span class="NoSpacingChar">&nbsp;<o:p></o:p></span></span></p> <h1 style="break-after:avoid;font-weight:normal;line-height:107%;margin:12pt 0in 0in;"><span style="color:rgb(47,84,150);font-family:&quot;Calibri Light&quot;, sans-serif;font-size:16pt;">Data Updates<o:p></o:p></span></h1> <h2 style="break-after:avoid;font-weight:normal;line-height:107%;margin:2pt 0in 0in;"><span style="color:rgb(47,84,150);font-family:&quot;Calibri Light&quot;, sans-serif;font-size:13pt;"><span>New Participating Resource and Datasets<o:p></o:p></span></span></h2> <ul>     <li style="line-height:107%;margin-bottom:0in;margin-right:0in;margin-top:0in;"><a name="_Hlk162948491"><span style="font-family:Calibri, sans-serif;font-size:11pt;"><span style="font-family:Symbol;"></span></span><span style="color:black;font-family:Calibri, sans-serif;font-size:11pt;">Genomics Evidence Neoplasia Information Exchange (GENIE)</span></a><span style="font-family:Calibri, sans-serif;font-size:11pt;"><span>&nbsp;<o:p></o:p></span></span></li>     <li style="line-height:107%;margin-bottom:0in;margin-right:0in;margin-top:0in;"><span style="font-family:Calibri, sans-serif;font-size:11pt;"><span style="font-family:&quot;Courier New&quot;;"></span><span><strong>New Dataset&nbsp;</strong>–&nbsp;AACR Project GENIE AKT1 Cohort<o:p></o:p></span></span></li>     <li style="line-height:107%;margin-bottom:0in;margin-right:0in;margin-top:0in;"><span style="font-family:Calibri, sans-serif;font-size:11pt;"><span style="font-family:&quot;Courier New&quot;;"></span><span><strong>New Dataset&nbsp;</strong>–&nbsp;BioPharma Collaborative Colorectal Cancer v2.0 Public<o:p></o:p></span></span></li>     <li style="line-height:107%;margin-bottom:0in;margin-right:0in;margin-top:0in;"><span style="font-family:Calibri, sans-serif;font-size:11pt;"><span style="font-family:&quot;Courier New&quot;;"></span><span><strong>New Dataset&nbsp;</strong>–&nbsp;BioPharma Collaborative Non-Small Cell Lung Cancer (NSCLC) v2.0 Public<o:p></o:p></span></span></li>     <li style="line-height:107%;margin-bottom:0in;margin-right:0in;margin-top:0in;"><span style="font-family:Calibri, sans-serif;font-size:11pt;"><span style="font-family:&quot;Courier New&quot;;"></span><strong>New Dataset&nbsp;</strong>– <span>DFCI-Profile Glioma Cohort 2013-2018<o:p></o:p></span></span></li>     <li style="line-height:107%;margin-bottom:0in;margin-right:0in;margin-top:0in;"><span style="font-family:Calibri, sans-serif;font-size:11pt;"><span style="font-family:&quot;Courier New&quot;;"></span><strong>New Dataset&nbsp;</strong>– <span>ERBB2 Cohort<o:p></o:p></span></span></li>     <li style="line-height:107%;margin-bottom:8pt;margin-right:0in;margin-top:0in;"><span style="font-family:Calibri, sans-serif;font-size:11pt;"><span style="font-family:&quot;Courier New&quot;;"></span><strong>New Dataset&nbsp;</strong>– <span>Metastatic Breast Cancer: 2013-2016<o:p></o:p></span></span></li> </ul> <h2 style="break-after:avoid;font-weight:normal;line-height:107%;margin:2pt 0in 0in;"><span style="color:rgb(47,84,150);font-family:&quot;Calibri Light&quot;, sans-serif;font-size:13pt;"><span>Existing Participating Resources and Datasets<o:p></o:p></span></span></h2> <p style="line-height:107%;margin:0in 0in 8pt;"><span style="color:black;font-family:&quot;Calibri&quot;,sans-serif;font-size:11pt;"><strong>5&nbsp;</strong></span><span style="color:black;font-family:Calibri, sans-serif;font-size:11pt;">existing resources have been updated with additional</span><span style="color:black;font-family:&quot;Calibri&quot;,sans-serif;font-size:11pt;"><strong>&nbsp;</strong></span><span style="color:black;font-family:Calibri, sans-serif;font-size:11pt;">data and information.</span><span style="font-family:Calibri, sans-serif;font-size:11pt;"><span><strong>&nbsp;<o:p></o:p></strong></span></span></p> <ul>     <li style="line-height:normal;margin-bottom:0in;margin-right:0in;margin-top:0in;"><span style="font-family:Calibri, sans-serif;font-size:11pt;"><span style="font-family:Symbol;"></span><span>cBioPortal for Cancer Genomics<o:p></o:p></span></span>         <ul>             <li style="line-height:normal;margin-bottom:0in;margin-right:0in;margin-top:0in;"><span style="font-family:Calibri, sans-serif;font-size:11pt;"><span style="font-family:&quot;Courier New&quot;;"></span><span><strong>New Dataset&nbsp;</strong>– Acute Myeloid Leukemia OHSU<o:p></o:p></span></span></li>             <li style="line-height:normal;margin-bottom:0in;margin-right:0in;margin-top:0in;"><span style="font-family:Calibri, sans-serif;font-size:11pt;"><span style="font-family:&quot;Courier New&quot;;"></span><span><strong>New Dataset&nbsp;</strong>– Breast Cancer METABRIC<o:p></o:p></span></span></li>             <li style="line-height:normal;margin-bottom:0in;margin-right:0in;margin-top:0in;"><span style="font-family:Calibri, sans-serif;font-size:11pt;"><span style="font-family:&quot;Courier New&quot;;"></span><span><strong>New Dataset&nbsp;</strong>– Breast Cancer SMC<o:p></o:p></span></span></li>             <li style="line-height:normal;margin-bottom:0in;margin-right:0in;margin-top:0in;"><span style="font-family:Calibri, sans-serif;font-size:11pt;"><span style="font-family:&quot;Courier New&quot;;"></span><span><strong>New Dataset&nbsp;</strong>– Diffuse Glioma (GLASS Consortium)<o:p></o:p></span></span></li>             <li style="line-height:normal;margin-bottom:0in;margin-right:0in;margin-top:0in;"><span style="font-family:Calibri, sans-serif;font-size:11pt;"><span style="font-family:&quot;Courier New&quot;;"></span><span><strong>New Dataset&nbsp;</strong>– Diffuse Large B-Cell Lymphoma Duke<o:p></o:p></span></span></li>             <li style="line-height:normal;margin-bottom:0in;margin-right:0in;margin-top:0in;"><span style="font-family:Calibri, sans-serif;font-size:11pt;"><span style="font-family:&quot;Courier New&quot;;"></span><span><strong>New Dataset&nbsp;</strong>– Medulloblastoma DKFZ<o:p></o:p></span></span></li>             <li style="line-height:normal;margin-bottom:0in;margin-right:0in;margin-top:0in;"><span style="font-family:Calibri, sans-serif;font-size:11pt;"><span style="font-family:&quot;Courier New&quot;;"></span><span><strong>New Dataset&nbsp;</strong>– Neuroblastoma AMC Amsterdam<o:p></o:p></span></span></li>             <li style="line-height:normal;margin-bottom:0in;margin-right:0in;margin-top:0in;"><span style="font-family:Calibri, sans-serif;font-size:11pt;"><span style="font-family:&quot;Courier New&quot;;"></span><span><strong>New Dataset&nbsp;</strong>– Pediatric Brain Cancer CPTAC/CHOP<o:p></o:p></span></span></li>         </ul>     </li>     <li style="line-height:normal;margin-bottom:0in;margin-right:0in;margin-top:0in;"><span style="font-family:Calibri, sans-serif;font-size:11pt;"><span style="font-family:Symbol;"></span><span>Childhood Cancer Data Initiative (CCDI)<o:p></o:p></span></span>         <ul>             <li style="line-height:normal;margin-bottom:0in;margin-right:0in;margin-top:0in;"><span style="font-family:Calibri, sans-serif;font-size:11pt;"><span style="font-family:&quot;Courier New&quot;;"></span><span>Updated case and sample counts for the Molecular Characterization Initiative (MCI) dataset<o:p></o:p></span></span></li>         </ul>     </li>     <li style="line-height:normal;margin-bottom:0in;margin-right:0in;margin-top:0in;"><span style="font-family:Calibri, sans-serif;font-size:11pt;"><span style="font-family:Symbol;"></span><span>Central Brain Tumor Registry of the United States (CBTRUS)<o:p></o:p></span></span>         <ul>             <li style="line-height:normal;margin-bottom:0in;margin-right:0in;margin-top:0in;"><span style="font-family:Calibri, sans-serif;font-size:11pt;"><span style="font-family:&quot;Courier New&quot;;"></span><span><strong>New Dataset&nbsp;</strong>– CBTRUS Fact Sheet 2023<o:p></o:p></span></span></li>         </ul>     </li>     <li style="line-height:normal;margin-bottom:0in;margin-right:0in;margin-top:0in;"><span style="font-family:Calibri, sans-serif;font-size:11pt;"><span style="font-family:Symbol;"></span><span>OncoKB<o:p></o:p></span></span>         <ul>             <li style="line-height:normal;margin-bottom:0in;margin-right:0in;margin-top:0in;"><span style="font-family:Calibri, sans-serif;font-size:11pt;"><span style="font-family:&quot;Courier New&quot;;"></span><span>Updated case disease diagnosis.<o:p></o:p></span></span></li>         </ul>     </li>     <li style="line-height:normal;margin-bottom:0in;margin-right:0in;margin-top:0in;"><span style="font-family:Calibri, sans-serif;font-size:11pt;"><span style="font-family:Symbol;"></span><span>Pediatric Cancer Data Commons (PCDC)<o:p></o:p></span></span>         <ul>             <li style="line-height:normal;margin-bottom:0in;margin-right:0in;margin-top:0in;"><span style="font-family:Calibri, sans-serif;font-size:11pt;"><span style="font-family:&quot;Courier New&quot;;"></span><span><strong>New Dataset&nbsp;</strong>– International Acute Myeloid Leukemia Consortium (INTERACT)<o:p></o:p></span></span></li>             <li style="line-height:normal;margin-bottom:0in;margin-right:0in;margin-top:0in;"><span style="font-family:Calibri, sans-serif;font-size:11pt;"><span style="font-family:&quot;Courier New&quot;;"></span><span>Updated case and sample counts for the </span><i><span>Hodgkin Lymphoma Data Collaboration (NODAL)</span></i><span>, </span><i><span>International Neuroblastoma Risk Group (INRG)</span></i><span>, and </span><i><span>International Soft Tissue Sarcoma Consortium (INSTRuCT)</span></i><span> datasets.<o:p></o:p></span></span></li>         </ul>     </li> </ul> <h1 style="break-after:avoid;font-weight:normal;line-height:107%;margin:12pt 0in 0in;"><a name="_Toc97732894"><span style="color:rgb(47,84,150);font-family:&quot;Calibri Light&quot;, sans-serif;font-size:16pt;"><span>General</span></span></a><span style="color:rgb(47,84,150);font-family:&quot;Calibri Light&quot;, sans-serif;font-size:16pt;"><span> Site Updates<o:p></o:p></span></span></h1> <ul style="list-style-type:disc;margin-bottom:0in;margin-top:0in;" type="disc">     <li style="line-height:normal;margin-bottom:8pt;margin-right:0in;margin-top:0in;"><span style="color:black;font-family:Calibri, sans-serif;font-size:11pt;">A new </span><a href="https://datacatalog.ccdi.cancer.gov/contribute"><span style="color:#0563C1;font-family:&quot;Calibri&quot;,sans-serif;font-size:11.0pt;">Contribute to the CCDC</span></a><span style="color:black;font-family:Calibri, sans-serif;font-size:11pt;"> page, available under the About menu, was added to share information on how to contribute data to the CCDC.</span><span style="color:black;font-family:Calibri, sans-serif;font-size:11pt;"><span>&nbsp;<o:p></o:p></span></span>         <ul style="list-style-type:circle;margin-bottom:0in;" type="circle">             <li style="line-height:normal;margin-bottom:8pt;margin-right:0in;margin-top:0in;"><span style="color:black;font-family:Calibri, sans-serif;font-size:11pt;"><span class="normaltextrun">If a resource or study involves participants younger than 40 and focuses on cancer or supports cancer research, resource or study is eligible to contribute.</span><span class="eop">&nbsp;</span></span><span style="color:black;font-family:Calibri, sans-serif;font-size:11pt;"><span class="eop">&nbsp;<o:p></o:p></span></span></li>             <li style="line-height:normal;margin-bottom:8pt;margin-right:0in;margin-top:0in;"><span style="color:black;font-family:Calibri, sans-serif;font-size:11pt;"><span>A submission templates can be completed and&nbsp;</span></span><span style="color:black;font-family:Calibri, sans-serif;font-size:11pt;"><span class="normaltextrun">sent to&nbsp;</span></span><a href="mailto:NCIChildhoodCancerDataInitiative@mail.nih.gov"><span style="color:#0563C1;font-family:&quot;Calibri&quot;,sans-serif;font-size:11.0pt;"><span class="normaltextrun">NCIChildhoodCancerDataInitiative@mail.nih.gov</span></span></a><span style="color:black;font-family:Calibri, sans-serif;font-size:11pt;"><span class="normaltextrun">.</span></span><span style="color:black;font-family:Calibri, sans-serif;font-size:11pt;"><span>&nbsp;<o:p></o:p></span></span></li>         </ul>     </li>     <li style="line-height:normal;margin-bottom:8pt;margin-right:0in;margin-top:0in;"><span style="color:black;font-family:Calibri, sans-serif;font-size:11pt;"><span>The ‘CCDI Studies’ menu was updated to include direct links to the following CCDI Applications:</span></span><span style="color:black;font-family:Calibri, sans-serif;font-size:10.5pt;">&nbsp;<o:p></o:p></span>         <ul style="list-style-type:circle;margin-bottom:0in;" type="circle">             <li style="line-height:normal;margin-bottom:8pt;margin-right:0in;margin-top:0in;"><span style="color:black;font-family:Calibri, sans-serif;font-size:11pt;"><span>The </span></span><a href="https://ccdi.cancer.gov/home"><span style="color:#0563C1;font-family:&quot;Calibri&quot;,sans-serif;font-size:11.0pt;"><span>Childhood Cancer Data Initiative Hub (CCDI Hub)</span></span></a><span style="color:black;font-family:Calibri, sans-serif;font-size:11pt;"><span> is an entry point to the Data Ecosystem and provides direct links to applications, tools, resources, and additional technical information, including the CCDC.<o:p></o:p></span></span></li>             <li style="line-height:normal;margin-bottom:8pt;margin-right:0in;margin-top:0in;"><span style="color:black;font-family:Calibri, sans-serif;font-size:11pt;"><span>The </span></span><a href="https://moleculartargets.ccdi.cancer.gov/"><span style="color:#0563C1;font-family:&quot;Calibri&quot;,sans-serif;font-size:11.0pt;"><span>CCDI''s Molecular Targets Platform (MTP)</span></span></a><span style="color:black;font-family:Calibri, sans-serif;font-size:11pt;"><span> includes a computable interpretation of the FDA''s Relevant Molecular Target List at an individual gene level. The MTP is open access and currently includes nearly 59,000 potential genes and 215 relevant molecular targets in more than 60 specific pediatric cancers.<o:p></o:p></span></span></li>             <li style="line-height:normal;margin-bottom:8pt;margin-right:0in;margin-top:0in;"><span style="color:black;font-family:Calibri, sans-serif;font-size:11pt;"><span>The </span></span><a href="https://clinicalcommons.ccdi.cancer.gov/"><span style="color:#0563C1;font-family:&quot;Calibri&quot;,sans-serif;font-size:11.0pt;"><span>Childhood Cancer Clinical Data Commons (C3DC)</span></span></a><span style="color:black;font-family:Calibri, sans-serif;font-size:11pt;"><span> is an open-access web application that serves as the primary source for deidentified, individual-level harmonized data that describes the demographic and phenotypic characteristics of participants.<o:p></o:p></span></span></li>         </ul>     </li>     <li style="line-height:normal;margin-bottom:8pt;margin-right:0in;margin-top:0in;"><span style="color:black;font-family:Calibri, sans-serif;font-size:11pt;"><span>The Glossary has been updated with new acronyms and abbreviations.</span></span><span style="color:black;font-family:Calibri, sans-serif;font-size:10.5pt;">&nbsp;<o:p></o:p></span></li>     <li style="line-height:normal;margin-bottom:8pt;margin-right:0in;margin-top:0in;"><span style="color:black;font-family:Calibri, sans-serif;font-size:11pt;">The User Guide is updated to reflect new and updated resource information.</span><span style="font-family:Calibri, sans-serif;font-size:11pt;">&nbsp;<o:p></o:p></span></li> </ul> <h1 style="break-after:avoid;font-weight:normal;line-height:107%;margin:12pt 0in 0in;"><span style="color:rgb(47,84,150);font-family:&quot;Calibri Light&quot;, sans-serif;font-size:16pt;"><span class="normaltextrun">Additional Support and Inquiries</span>&nbsp;<o:p></o:p></span></h1> <p class="paragraph" style="margin:0in;vertical-align:baseline;"><span style="font-family:&quot;Calibri&quot;,sans-serif;font-size:11.0pt;"><span class="normaltextrun">Users requiring any additional support or with any questions about the CCDC can contact the Childhood Cancer Data Initiative at&nbsp;</span></span><a href="mailto:NCIChildhoodCancerDataInitiative@mail.nih.gov"><span style="color:#0563C1;font-family:&quot;Calibri&quot;,sans-serif;font-size:11.0pt;"><span class="normaltextrun">NCIChildhoodCancerDataInitiative@mail.nih.gov</span></span></a><span style="font-family:&quot;Calibri&quot;,sans-serif;font-size:11.0pt;"><span class="normaltextrun">.&nbsp; Please include a name and a reference to the CCDC with the submitted inquiry.<o:p></o:p></span></span></p> <p class="paragraph" style="margin:0in;vertical-align:baseline;"><span style="font-family:&quot;Times New Roman&quot;, serif;font-size:12pt;"><span style="font-family:&quot;Calibri&quot;,sans-serif;font-size:11.0pt;"></span></span></p>

