  - 2 new resources, 10 new datasets, and 9 resource updates. Check out all that is new.
  - >
    <p><span style="font-size:12pt"><span style="background-color:white"><span style="font-family:&quot;Times New Roman&quot;,serif"><span style="font-size:11.0pt"><span style="font-family:&quot;Calibri&quot;,sans-serif"><span style="color:black">This update includes the addition of the National Clinical Trials Network (NCTN) Navigator and the</span></span></span><span style="font-size:11.0pt"><span style="font-family:&quot;Calibri&quot;,sans-serif"><span style="color:black">Cancer Epidemiology Descriptive Cohort Database (CEDCD). The NCTN Navigator allows Investigators to query from available biospecimens, and to request biospecimens to validate exploratory correlative analysis hypotheses. The CEDCD is a searchable database that contains general study information (e.g., eligibility criteria and size), the type of data collected at baseline, cancer sites, number of participants diagnosed with cancer, and biospecimen information to facilitate collaboration and highlight the opportunities for research within existing cohort studies.</span></span></span></span></span></p><p><span style="font-size:12pt"><span style="background-color:white"><span style="font-family:&quot;Times New Roman&quot;,serif"><span style="font-size:11.0pt"><span style="font-family:&quot;Calibri&quot;,sans-serif"><span style="color:black">The Catalog also updated 9 existing resources, including 8 new datasets, along with numerous data updates.</span></span></span></span></span></span></p><p><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">Explore the data and site updates in more detail below.</span></span><br />&nbsp;</p><h1><span style="font-size:16pt"><span style="font-family:&quot;Calibri Light&quot;,sans-serif"><span style="color:#2f5496">Data Updates</span></span></span></h1><h2><span style="font-size:13pt"><span style="font-family:&quot;Calibri Light&quot;,sans-serif"><span style="color:#2f5496">New Participating Resource and Dataset</span></span></span></h2><p><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif"><span style="background-color:white"><span style="color:black">The CCDC has added&nbsp;<strong><span style="font-family:&quot;Calibri&quot;,sans-serif">2</span></strong>&nbsp;new resources.</span></span></span></span></p><ul><li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">National Clinical Trials Network (NCTN) Navigator </span></span></li><li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">Cancer Epidemiology Descriptive Cohort Database (CEDCD)</span></span></li></ul><p>&nbsp;</p><h2><span style="font-size:13pt"><span style="font-family:&quot;Calibri Light&quot;,sans-serif"><span style="color:#2f5496">Existing Participating Resources and Datasets</span></span></span></h2><p><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif"><strong><span style="background-color:white"><span style="font-family:&quot;Calibri&quot;,sans-serif"><span style="color:black">9&nbsp;</span></span></span></strong><span style="background-color:white"><span style="color:black">existing resources have been updated with additional<strong>&nbsp;</strong>data and information.</span></span></span></span></p><ul><li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">cBioPortal for Cancer Genomics</span></span><ul style="list-style-type:circle"><li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif"><strong>New Dataset </strong>&ndash; China Pan-cancer</span></span></li><li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif"><strong>New Dataset </strong>&ndash; Pediatric Pan-Cancer DKFZ</span></span></li><li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif"><strong>New Dataset </strong>&ndash; Pediatric Preclinical Testing Consortium</span></span></li><li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif"><strong>New Dataset </strong>&ndash; Pediatric Pan-cancer Columbia University</span></span></li></ul></li><li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">Childhood Cancer Data Initiative (CCDI)</span></span><ul style="list-style-type:circle"><li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">&lsquo;National Childhood Cancer Registry Database in SEER*Stat&rsquo; dataset was moved to the CCDI resource.</span></span></li></ul></li><li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">Genomic Data Commons (GDC)</span></span><ul style="list-style-type:circle"><li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">&nbsp;Updated the case, case disease diagnosis, and sample counts for Molecular Analysis for Therapy Choice Program dataset.</span></span></li></ul></li><li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">Kids First Data Resource</span></span><ul style="list-style-type:circle"><li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">Updated the case, case disease diagnosis, and sample counts for Kids First: Myeloid Malignancies dataset.</span></span></li></ul></li><li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">MicroRNA Childhood Cancer Catalog (M3C)</span></span><ul style="list-style-type:circle"><li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">Updated case and case disease diagnosis counts.</span></span></li></ul></li><li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif"><span style="background-color:white"><span style="color:black">Removed: </span></span>National Childhood Cancer Registry (NCCR) Database in SEER*Stat</span></span><ul style="list-style-type:circle"><li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">&lsquo;National Childhood Cancer Registry Database in SEER*Stat&rsquo; dataset was moved to the CCDI resource.</span></span></li></ul></li><li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">Pediatric Cancer Data Commons (PCDC)</span></span><ul style="list-style-type:circle"><li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif"><strong>New Dataset </strong>&ndash; Malignant Germ Cell International Consortium (MaGIC)</span></span></li></ul></li><li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">Texas Pediatric Cancer Drug Testing Core &amp; Pediatric Preclinical In Vivo Testing Consortium</span></span><ul style="list-style-type:circle"><li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">Updated resource name to <em>Texas Pediatric Cancer Drug Testing Core &amp; Pediatric Preclinical In Vivo Testing Consortium</em> from <em>Greehey Children&rsquo;s Cancer Research Institute</em>.</span></span></li><li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">Updated resource URL, description, and Resource Type.</span></span></li></ul></li><li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">The Cancer Imaging Archive</span></span><ul style="list-style-type:circle"><li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif"><strong>New Dataset </strong>&ndash; Annotations for Risk-Based Therapy in Treating Younger Patients With Newly Diagnosed Liver Cancer (AHEP0731-Tumor-Annotations)</span></span></li><li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif"><strong>New Dataset </strong>&ndash; Annotations for Radiation Therapy, Amifostine, and Chemotherapy in Treating Young Patients With Newly Diagnosed Nasopharyngeal Cancer Collection (ARAR0331-Tumor-Annotations)</span></span></li><li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif"><strong>New Dataset </strong>&ndash; Data Analysis Centers</span></span></li></ul></li></ul><p>&nbsp;</p><h1><span style="font-size:16pt"><span style="font-family:&quot;Calibri Light&quot;,sans-serif"><span style="color:#2f5496">General Site Updates</span></span></span></h1><ul><li><span style="font-size:11pt"><span style="background-color:white"><span style="color:black"><span style="font-family:Calibri,sans-serif">A major update to the &lsquo;Accessing CCDI Data&rsquo; guide expanding the information on how to find, request, access, download, and analyze controlled-access data from CCDI.</span></span></span></span><ul style="list-style-type:circle"><li><span style="font-size:11pt"><span style="background-color:white"><span style="color:black"><span style="font-family:Calibri,sans-serif">Expanded information on access control <a href="https://public.era.nih.gov/commonsplus/public/login.era?TARGET=https%3A%2F%2Fpublic.era.nih.gov%3A443%2Fcommons" style="color:#0563c1; text-decoration:underline">NIH eRA Commons</a> and <a href="https://dbgap.ncbi.nlm.nih.gov/aa/wga.cgi?page=login" style="color:#0563c1; text-decoration:underline">dbGaP</a>.</span></span></span></span></li><li><span style="font-size:11pt"><span style="background-color:white"><span style="color:black"><span style="font-family:Calibri,sans-serif">A new section on using the <a href="https://ccdi.cancer.gov/explore" style="color:#0563c1; text-decoration:underline">CCDI Hub&rsquo;s Explore Dashboard</a> to find participants, samples, and files and how to generate a manifest from those queries to use within the Cancer Genomics Cloud (CGC).</span></span></span></span></li><li><span style="font-size:11pt"><span style="background-color:white"><span style="color:black"><span style="font-family:Calibri,sans-serif">New information on using the <a href="https://datacommons.cancer.gov/data-commons-framework" style="color:#0563c1; text-decoration:underline">NCI&rsquo;s Data Commons Framework Services (DCFS)</a> for controlled data access to CCDI data.</span></span></span></span></li></ul></li><li><span style="font-size:11pt"><span style="background-color:white"><span style="color:black"><span style="font-family:Calibri,sans-serif">The Glossary has been updated with new acronyms and abbreviations.</span></span></span></span></li><li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">The User Guide is updated to reflect new and updated resource information.</span></span></li></ul><p>&nbsp;</p><h1><span style="font-size:16pt"><span style="font-family:&quot;Calibri Light&quot;,sans-serif"><span style="color:#2f5496">Dataset Details</span></span></span></h1><ul><li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif"><span style="color:black">The </span><span style="background-color:white"><span style="color:black">Core Data Element dynamic charts on the Dataset Details page have been updated to display large numbers with a comma separator (e.g., 1,185).</span></span></span></span></li></ul><h1><span style="font-size:16pt"><span style="font-family:&quot;Calibri Light&quot;,sans-serif"><span style="color:#2f5496">Additional Support and Inquiries</span></span></span></h1><p><span style="font-size:12pt"><span style="font-family:&quot;Times New Roman&quot;,serif"><span style="font-size:11.0pt"><span style="font-family:&quot;Calibri&quot;,sans-serif">Users requiring any additional support or with any questions about the CCDC can contact the Childhood Cancer Data Initiative at </span></span><a href="mailto:NCIChildhoodCancerDataInitiative@mail.nih.gov" style="color:#0563c1; text-decoration:underline"><span style="font-size:11.0pt"><span style="font-family:&quot;Calibri&quot;,sans-serif"><span style="color:#0563c1">NCIChildhoodCancerDataInitiative@mail.nih.gov</span></span></span></a><span style="font-size:11.0pt"><span style="font-family:&quot;Calibri&quot;,sans-serif">.&nbsp; Please include a name and a reference to the CCDC with the submitted inquiry.</span></span></span></span></p>

