    <p style="line-height:107%;margin:0in 0in 8pt;"> <span style="color:black;font-family:Calibri, sans-serif;font-size:11pt;">Version 1.5.5 of the Childhood Cancer Data Initiative Data Catalog features dataset updates to counts, disease lists, publications, and URLs, and one new dataset – Childhood Cancer Data Initiative (CCDI): Texas Pediatric Patient Derived Xenograft. Two pages were updated for 508 best practices, and some additional stylistic updates were made to provide a more consistent experience for users. The “Site Updates” page was renamed “Release Notes” to better describe the information displayed there and improvements were made to the organization and description of some of the page contents and features. The User Guide was updated to reflect the latest resource update dates.</span> <span style="font-family:Calibri, sans-serif;font-size:11pt;"></span> </p> <h1 style="break-after:avoid;font-weight:normal;line-height:107%;margin:12pt 0in 0in;"> <a name="_Hlk174970223"> <span style="color:rgb(47,84,150);font-family:&quot;Calibri Light&quot;, sans-serif;font-size:16pt;">Statistics at a Glance</span> </a> </h1> <h2 style="break-after:avoid;font-weight:normal;line-height:107%;margin:2pt 0in 0in;"> <span style="color:rgb(47,84,150);font-family:&quot;Calibri Light&quot;, sans-serif;font-size:13pt;"> <span>v1.5.5 Summary</span> </span> </h2> <p style="line-height:107%;margin:0in 0in 8pt;"> <span style="color:black;font-family:&quot;Calibri&quot;,sans-serif;font-size:11pt;"> <strong>31st</strong> </span> <span style="color:black;font-family:Calibri, sans-serif;font-size:11pt;"> Release</span> </p><p style="line-height:107%;margin:0in 0in 8pt;"> <span style="color:black;font-family:&quot;Calibri&quot;,sans-serif;font-size:11pt;"> <strong>363</strong> </span> <span style="color:black;font-family:Calibri, sans-serif;font-size:11pt;"> Datasets</span> </p><p style="line-height:107%;margin:0in 0in 8pt;"> <span style="color:black;font-family:&quot;Calibri&quot;,sans-s