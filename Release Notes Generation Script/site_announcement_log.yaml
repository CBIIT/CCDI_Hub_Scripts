       <p style="line-height:107%;margin:0in 0in 8pt;"><span style="color:black;font-family:Calibri, sans-serif;font-size:11pt;">The first Childhood Cancer Data Initiative Data Catalog release of 2025 includes two new datasets: Genomic Profiling of Pediatric B-cell Acute Lymphoblastic Leukemia from dbGaP and the NCTN Biobanks dataset from the newly added resource, NCI National Clinical Trials Network (NCTN) Biobanks. Dataset counts have been updated for datasets from several resources, including Kids First Data Resource, St. Jude Cloud, and The Cancer Imaging Archive. Sample and other counts have been updated for NCTN Navigator, PDX for Childhood Cancer Therapeutics, and The Cancer Proteome Atlas. Additional updates include addition of a banner to the page header to notify users they are accessing an official website of the United States government and substantial updates to figures and content in the user guide to more accurately describe the current state of the application. Detailed updates are below.</span><span style="font-family:Calibri, sans-serif;font-size:11pt;"></span></p> <h1 style="break-after:avoid;font-weight:normal;line-height:107%;margin:12pt 0in 0in;"><a name="_Hlk174970223"><span style="color:rgb(47,84,150);font-family:&quot;Calibri Light&quot;, sans-serif;font-size:16pt;">Data Updates</span></a></h1> <h2 style="break-after:avoid;font-weight:normal;line-height:107%;margin:2pt 0in 0in;"><span style="color:rgb(47,84,150);font-family:&quot;Calibri Light&quot;, sans-serif;font-size:13pt;"><span>New Resources</span></span></h2> <p style="line-height:107%;margin:0in 0in 8pt;"><span style="color:black;font-family:&quot;Calibri&quot;,sans-serif;font-size:11pt;"><span><strong>1</strong></span></span><span style="color:black;font-family:Calibri, sans-serif;font-size:11pt;"><span> new resource has been added.</span></span><span style="font-family:Calibri, sans-serif;font-size:11pt;"></span></p> <ul style="padding-left:48px;"> <li> <p style="line-height:107%;m