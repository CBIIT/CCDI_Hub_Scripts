    <p><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">The National Cancer Institute is pleased to announce an update to the Childhood Cancer Data Catalog website: <a href="https://datacatalog.ccdi.cancer.gov/" style="color:#0563c1; text-decoration:underline">https://datacatalog.ccdi.cancer.gov/</a>.</span></span></p><p><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">This update includes the addition of the Cancer Dependency Map (DepMap) as a new analytic tool resource. &nbsp;The DepMap portal is an open access to analytical and visualization toolsets using broad panels of cancer models that represent the diversity of human cancers to identify and understand the landscape of cancer dependencies and create a resource for drug target and biomarker discovery.&nbsp; Additionally, 6 existing resources have been updated to included new count information. </span></span></p><p><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">Explore the data and site updates in more detail below.</span></span></p><h1><span style="font-size:16pt"><span style="font-family:&quot;Calibri Light&quot;,sans-serif"><span style="color:#2f5496">Data Updates</span></span></span></h1><h2><span style="font-size:13pt"><span style="font-family:&quot;Calibri Light&quot;,sans-serif"><span style="color:#2f5496">New Participating Resource and Dataset</span></span></span></h2><p><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">The CCDC has added <strong>1</strong> new analytic tool resource.</span></span></p><ul><li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif"><span style="color:black">Cancer Dependency Map</span></span></span></li></ul><h2><span style="font-size:13pt"><span style="font-family:&quot;Calibri Light&quot;,sans-serif"><span style="color:#2f5496">Existing Participating Resources and Datasets</span></span></span></h2><p><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif"><strong>6 </strong>existing resources have been updated with additional<strong> </strong>data and information. </span></span></p><ul><li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">Genomic Data Commons (GDC)</span></span><ul style="list-style-type:circle"><li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">Updated case counts, case disease diagnosis information, and sample counts for HCMI dataset.</span></span></li></ul></li><li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">Human Cancer Models Initiative (HCMI)</span></span><ul style="list-style-type:circle"><li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">Updated case counts, case disease diagnosis information, and sample counts for HCMI Participants Under 40 Years Old. </span></span></li></ul></li><li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">Kids First Data Resource</span></span><ul style="list-style-type:circle"><li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">Updated case counts and case disease diagnosis information for Pediatric Brain Tumor Atlas&rsquo;s Children&rsquo;s Brain Tumor Network (CBTN).</span></span></li></ul></li><li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">PDX Development and Trial Centers Research Network (PDXNet) </span></span><ul style="list-style-type:circle"><li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">Updated case counts and case disease diagnosis information for<strong> </strong>PDXNet Portal PDMR Data and PDXNet Portal Model datasets.</span></span></li></ul></li><li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">Victorian Paediatric Cancer Consortium (VPCC)</span></span><ul style="list-style-type:circle"><li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">Updated case counts, case disease diagnosis information, and sample counts for Childhood Cancer Model Atlas dataset.</span></span></li></ul></li><li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">Xena Browser</span></span><ul style="list-style-type:circle"><li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">Added Data Access information.</span></span></li></ul></li></ul><h1><span style="font-size:16pt"><span style="font-family:&quot;Calibri Light&quot;,sans-serif"><span style="color:#2f5496">General Site Updates</span></span></span></h1><ul><li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">The Glossary has been updated with new acronyms and abbreviations.</span></span></li><li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">The User Guide is updated to reflect new and updated resource information.</span></span></li></ul><h2><span style="font-size:13pt"><span style="font-family:&quot;Calibri Light&quot;,sans-serif"><span style="color:#2f5496">Dataset Details</span></span></span></h2><ul><li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">ClinicalTrials.gov links have been updated from &lsquo;Clinical Trial&#39; to &lsquo;Clinical Trial Identifier.&rsquo;</span></span></li><li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">Dataset identifiers&mdash;Clinical Trial Identifier, dbGaP Study Identifier, GEO Identifier, and SRA Identifier&mdash;are now grouped together under the Additional Data Elements column.</span></span></li></ul><h1><span style="font-size:16pt"><span style="font-family:&quot;Calibri Light&quot;,sans-serif"><span style="color:#2f5496">Additional Support and Inquiries</span></span></span></h1><p><span style="font-size:12pt"><span style="font-family:&quot;Times New Roman&quot;,serif"><span style="font-size:11.0pt"><span style="font-family:&quot;Calibri&quot;,sans-serif">Users requiring any additional support or with any questions about the CCDC can contact Childhood Cancer Data Initiative at </span></span><a href="mailto:NCIChildhoodCancerDataInitiative@mail.nih.gov" style="color:#0563c1; text-decoration:underline"><span style="font-size:11.0pt"><span style="font-family:&quot;Calibri&quot;,sans-serif"><span style="color:#0563c1">NCIChildhoodCancerDataInitiative@mail.nih.gov</span></span></span></a><span style="font-size:11.0pt"><span style="font-family:&quot;Calibri&quot;,sans-serif">.&nbsp; Please include a name and a reference to the CCDC with the submitted inquiry.</span></span></span></span></p>
