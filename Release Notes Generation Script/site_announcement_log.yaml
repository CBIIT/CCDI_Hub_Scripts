    <p style="line-height:107%;margin:0in 0in 8pt;"><span style="background-color:white;color:black;font-family:Calibri, sans-serif;font-size:11pt;">May Catalog updates include 13 new datasets, in addition to a disease list from Xena Browser and updated counts from the St. Jude Cloud Real-Time Clinical Genomics and PDX Development and Trial Centers PDXNet Portal PDMR datasets. This update also includes the addition of&nbsp;The South African National Cancer Registry (NCR) and the&nbsp;</span><span style="color:black;font-family:Calibri, sans-serif;font-size:11pt;">World Health Organization - International Agency for Research on Cancer (WHO-IARC). NCR&nbsp;</span><span style="background-color:white;color:black;font-family:Calibri, sans-serif;font-size:11pt;">has demographic, clinical, and reporting source cancer registration data and has played a critical role in the development of cancer prevention and control policy for the country.&nbsp;</span><span style="color:black;font-family:Calibri, sans-serif;font-size:11pt;">The objective of IARC is to promote international collaboration in cancer research so that preventive measures may be adopted, and the burden of disease and associated suffering reduced.&nbsp;</span></p> <p style="line-height:107%;margin:0in;"><span style="background-color:white;color:black;font-family:Calibri, sans-serif;font-size:11pt;">A function to pause the Resource Carousel has been added, allowing users to interact with and digest the displayed content at their preferred pace.</span><span style="font-family:Calibri, sans-serif;font-size:11pt;"><span style="background-color:white;"></span></span></p> <p style="line-height:107%;margin:0in;"><span style="font-family:Calibri, sans-serif;font-size:11pt;"><span style="background-color:white;"></span></span></p> <p style="line-height:107%;margin:0in;"><span style="font-family:Calibri, sans-serif;font-size:11pt;"><span>Detailed data and site updates are described below.</span><span class="NoSpacingChar">