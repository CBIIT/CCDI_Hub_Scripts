    <p><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">This update includes the addition of the CancerModels.Org catalog resource. &nbsp;CancerModels.Org is a free, open-source cancer research platform that aggregates clinical, genomic, and functional data from patient-derived xenografts, organoids and cell lines.&nbsp; The resource currently has over 7,000 patient-derived cancer models available for the cancer community. &nbsp;<span style="background-color:white"><span style="color:black">Additionally, 7 existing resources have been updated to include 13 new datasets, 8 of which come from the Single-cell Pediatric Cancer Atlas Portal (ScPCA).</span></span> </span></span></p><p><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">Explore the data and site updates in more detail below.</span></span></p><h1><span style="font-size:16pt"><span style="font-family:&quot;Calibri Light&quot;,sans-serif"><span style="color:#2f5496">Data Updates</span></span></span></h1><h2><span style="font-size:13pt"><span style="font-family:&quot;Calibri Light&quot;,sans-serif"><span style="color:#2f5496">New Participating Resource and Dataset</span></span></span></h2><p><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">The CCDC has added <strong>1</strong> new catalog resource.</span></span></p><ul><li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif"><span style="color:black">CancerModels.Org</span></span></span></li></ul><h2><span style="font-size:13pt"><span style="font-family:&quot;Calibri Light&quot;,sans-serif"><span style="color:#2f5496">Existing Participating Resources and Datasets</span></span></span></h2><p><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif"><strong><span style="background-color:white"><span style="font-family:&quot;Calibri&quot;,sans-serif"><span style="color:black">7&nbsp;</span></span></span></strong><span style="background-color:white"><span style="color:black">existing resources have been updated with additional<strong>&nbsp;</strong>data and information, including&nbsp;<strong><span style="font-family:&quot;Calibri&quot;,sans-serif">13</span></strong>&nbsp;new dataset</span></span>s.</span></span></p><ul><li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">Childhood Cancer Data Initiative (CCDI)</span></span><ul style="list-style-type:circle"><li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif"><strong><span style="background-color:white"><span style="font-family:&quot;Calibri&quot;,sans-serif"><span style="color:black">New dataset - </span></span></span></strong><span style="background-color:white"><span style="font-family:&quot;Calibri&quot;,sans-serif"><span style="color:black">Molecular Characterization across Pediatric Brain Tumors and Other Solid and Hematologic Malignancies for Research, Diagnostic, and Precision Medicine</span></span></span></span></span></li><li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">Updated case counts, case disease diagnosis information, and sample counts for Molecular Characterization Initiative dataset</span></span></li></ul></li><li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif"><span style="background-color:white"><span style="color:black">The database of Genotypes and Phenotypes (dbGaP)</span></span></span></span><ul style="list-style-type:circle"><li><span style="font-size:11pt"><span style="background-color:white"><span style="font-family:Calibri,sans-serif"><strong><span style="color:black">New dataset&nbsp;</span></strong><span style="color:black">&ndash; </span><span style="color:windowtext !msorm"><span style="color:black">Detection and Targeting of Splicing Deregulation in Pediatric Acute Myeloid Leukemia Stem Cells</span></span></span></span></span></li><li><span style="font-size:11pt"><span style="background-color:white"><span style="font-family:Calibri,sans-serif"><strong><span style="color:black">New dataset&nbsp;</span></strong><span style="color:black">&ndash; INCLUDE: The Epidemiology of Transient Leukemia in Newborns with Down Syndrome</span></span></span></span></li><li><span style="font-size:11pt"><span style="background-color:white"><span style="font-family:Calibri,sans-serif"><strong><span style="color:black">New dataset&nbsp;</span></strong><span style="color:black">&ndash; Structurally Complex Osteosarcoma Genomes Exhibit Limited Heterogeneity within Individual Tumors and across Evolutionary Time</span></span></span></span></li></ul></li><li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">Genomic Data Commons (GDC)</span></span><ul style="list-style-type:circle"><li><span style="font-size:11pt"><span style="background-color:white"><span style="font-family:Calibri,sans-serif"><span style="color:black">Updated Clinical Proteomic Tumor Analysis Consortium (CPTAC) dataset to include a link to the ProTrack data portal.</span></span></span></span></li></ul></li><li><span style="font-size:11pt"><span style="background-color:white"><span style="font-family:Calibri,sans-serif"><span style="color:black">Population-based Research to Optimize the Screening Process (PROSPR)</span></span></span></span><ul style="list-style-type:circle"><li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">Updated case counts, case disease diagnosis information, and sample counts for PROSPR 1 Breast Cancer Public Use Dataset.</span></span></li></ul></li><li><span style="font-size:11pt"><span style="background-color:white"><span style="font-family:Calibri,sans-serif"><span style="color:black">Single-cell Pediatric Cancer Atlas Portal (ScPCA)</span></span></span></span><ul style="list-style-type:circle"><li><span style="font-size:11pt"><span style="background-color:white"><span style="font-family:Calibri,sans-serif"><strong><span style="color:black">New dataset&nbsp;</span></strong><span style="color:black">&ndash; </span><span style="color:black">Delineating pediatric brain tumor progression using single-nuclei sequencing</span></span></span></span></li><li><span style="font-size:11pt"><span style="background-color:white"><span style="font-family:Calibri,sans-serif"><strong><span style="color:black">New dataset&nbsp;</span></strong><span style="color:black">&ndash; </span><span style="color:black">Profiling the transcriptional heterogeneity of diverse pediatric solid tumors &ndash; Ewing sarcoma</span></span></span></span></li><li><span style="font-size:11pt"><span style="background-color:white"><span style="font-family:Calibri,sans-serif"><strong><span style="color:black">New dataset&nbsp;</span></strong><span style="color:black">&ndash; </span><span style="color:black">Profiling the transcriptional heterogeneity of diverse pediatric solid tumors &ndash; Non-rhabdomyosarcoma soft tissue sarcomas</span></span></span></span></li><li><span style="font-size:11pt"><span style="background-color:white"><span style="font-family:Calibri,sans-serif"><strong><span style="color:black">New dataset&nbsp;</span></strong><span style="color:black">&ndash; </span><span style="color:black">Profiling the transcriptional heterogeneity of diverse pediatric solid tumors &ndash; Other solid tumors</span></span></span></span></li><li><span style="font-size:11pt"><span style="background-color:white"><span style="font-family:Calibri,sans-serif"><strong><span style="color:black">New dataset&nbsp;</span></strong><span style="color:black">&ndash; </span><span style="color:black">Profiling the transcriptional heterogeneity of diverse pediatric solid tumors &ndash; Retinoblastoma</span></span></span></span></li><li><span style="font-size:11pt"><span style="background-color:white"><span style="font-family:Calibri,sans-serif"><strong><span style="color:black">New dataset&nbsp;</span></strong><span style="color:black">&ndash; </span><span style="color:black">Profiling the transcriptional heterogeneity of diverse pediatric solid tumors &ndash; Rhabdoid tumor</span></span></span></span></li><li><span style="font-size:11pt"><span style="background-color:white"><span style="font-family:Calibri,sans-serif"><strong><span style="color:black">New dataset&nbsp;</span></strong><span style="color:black">&ndash; </span><span style="color:black">Profiling the transcriptional heterogeneity of diverse pediatric solid tumors &ndash; Wilms tumor</span></span></span></span></li><li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif"><strong><span style="color:black">New dataset&nbsp;</span></strong><span style="color:black">&ndash; </span><span style="color:black">Single Cell Profiling of Early T cell Precursor Acute Lymphoblastic Leukemia</span></span></span></span></li></ul></li><li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">St. Jude Cloud</span></span><ul style="list-style-type:circle"><li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif"><strong>New dataset</strong> &ndash; Pediatric Cancer Knowledge Base (PeCan)</span></span></li></ul></li><li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">Victorian Paediatric Cancer Consortium (VPCC)</span></span><ul style="list-style-type:circle"><li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">Updated case counts, case disease diagnosis information, and sample counts for Childhood Cancer Model Atlas dataset.</span></span></li></ul></li></ul><h1><span style="font-size:16pt"><span style="font-family:&quot;Calibri Light&quot;,sans-serif"><span style="color:#2f5496">General Site Updates</span></span></span></h1><ul><li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">The Glossary has been updated with new acronyms and abbreviations.</span></span></li><li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">The User Guide is updated to reflect new and updated resource information.</span></span></li></ul><h2><span style="font-size:13pt"><span style="font-family:&quot;Calibri Light&quot;,sans-serif"><span style="color:#2f5496">About </span></span></span></h2><p style="margin-left:48px"><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">The About page has a new banner image.</span></span></p><h1><span style="font-size:16pt"><span style="font-family:&quot;Calibri Light&quot;,sans-serif"><span style="color:#2f5496">Additional Support and Inquiries</span></span></span></h1><p><span style="font-size:12pt"><span style="font-family:&quot;Times New Roman&quot;,serif"><span style="font-size:11.0pt"><span style="font-family:&quot;Calibri&quot;,sans-serif">Users requiring any additional support or with any questions about the CCDC can contact Childhood Cancer Data Initiative at </span></span><a href="mailto:NCIChildhoodCancerDataInitiative@mail.nih.gov" style="color:#0563c1; text-decoration:underline"><span style="font-size:11.0pt"><span style="font-family:&quot;Calibri&quot;,sans-serif"><span style="color:#0563c1">NCIChildhoodCancerDataInitiative@mail.nih.gov</span></span></span></a><span style="font-size:11.0pt"><span style="font-family:&quot;Calibri&quot;,sans-serif">.&nbsp; Please include a name and a reference to the CCDC with the submitted inquiry.</span></span></span></span></p>
