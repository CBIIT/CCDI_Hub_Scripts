    <p style="line-height:107%;margin:0in 0in 8pt;"> <span style="color:black;font-family:Calibri, sans-serif;font-size:11pt;">The May 2025 Childhood Cancer Data Initiative Data Catalog (CCDC) release features updated counts and resource details for many resources and four new datasets: CBTRUS Fact Sheet 2024, Childhood Cancer Data Initiative (CCDI): Pediatric In Vivo Testing Program - Neuroblastoma, GENIE Cohort v17.0-public, and IDC’s Pediatric-CT-SEG. A fifth new dataset has been added along with a new resource: the Childhood Cancer Catalog of Extrachromosomal DNA. The footer has been updated for consistent styling and user experience across NCI CCDI applications and help text was added to the About page to provide information for citing the Data Catalog. Detailed updates are below.</span> <span style="font-family:Calibri, sans-serif;font-size:11pt;"></span> </p> <h1 style="break-after:avoid;font-weight:normal;line-height:107%;margin:12pt 0in 0in;"> <a name="_Hlk174970223"> <span style="color:rgb(47,84,150);font-family:&quot;Calibri Light&quot;, sans-serif;font-size:16pt;">Data Updates</span> </a> </h1> <h2 style="break-after:avoid;font-weight:normal;line-height:107%;margin:2pt 0in 0in;"> <span style="color:rgb(47,84,150);font-family:&quot;Calibri Light&quot;, sans-serif;font-size:13pt;"> <span>New Resources</span> </span> </h2> <p style="line-height:107%;margin:0in 0in 8pt;"> <span style="color:black;font-family:&quot;Calibri&quot;,sans-serif;font-size:11pt;"> <span> <strong>1</strong> </span> </span> <span style="color:black;font-family:Calibri, sans-serif;font-size:11pt;"> <span> new resource has been added.</span> </span> <span style="font-family:Calibri, sans-serif;font-size:11pt;"></span> </p> <ul style="padding-left:48px;"> <li> <p style="line-height:107%;margin:0;"> <span style="font-family:Calibri, sans-serif;font-size:11pt;"> <span style="font-family:Symbol;"></span> </span> <span style="color:black;font-family:Calibri, sans-serif;font-size:11pt;">Childhood Cancer Catalog of Circular Extrachromosomal DNA (ecDNA)</span> <span style="font-family:Calibri, sans-serif;font-size:11pt;"></span> </p> <ul style="padding-left:48px;"> <li> <p style="line-height:107%;margin:0;"> <span style="color:black;font-family:Calibri, sans-serif;font-size:11pt;"> <span> <strong>New Dataset</strong> – </span>Childhood Cancer Catalog of Circular Extrachromosomal DNA (ecDNA)</span> </p> </li> </ul> </li> </ul> <h2 style="break-after:avoid;font-weight:normal;line-height:107%;margin:2pt 0in 0in;"> <span style="color:rgb(47,84,150);font-family:&quot;Calibri Light&quot;, sans-serif;font-size:13pt;"> <span>Existing Participating Resources and Datasets</span> </span> </h2> <p style="line-height:107%;margin:0in 0in 8pt;"> <span style="color:black;font-family:&quot;Calibri&quot;,sans-serif;font-size:11pt;"> <strong>16</strong> </span> <span style="color:black;font-family:Calibri, sans-serif;font-size:11pt;"> existing resources have been updated with additional data and information or with datasets removed.</span> <ul style="padding-left:48px;"> <li> <p style="line-height:107%;margin:0;"> <span style="font-family:Calibri, sans-serif;font-size:11pt;"> <span style="font-family:Symbol;"></span> </span> <span style="color:black;font-family:Calibri, sans-serif;font-size:11pt;">Central Brain Tumor Registry of the United States (CBTRUS)</span> <span style="font-family:Calibri, sans-serif;font-size:11pt;"></span> </p> <ul style="padding-left:48px;"> <li> <p style="line-height:107%;margin:0;"> <span style="color:black;font-family:Calibri, sans-serif;font-size:11pt;"> <span> <strong>New Dataset</strong> – </span>CBTRUS Fact Sheet 2024 </span> </p> </li> </ul> </li> <li> <p style="line-height:107%;margin:0;"> <span style="font-family:Calibri, sans-serif;font-size:11pt;"> <span style="font-family:Symbol;"></span> </span> <span style="color:black;font-family:Calibri, sans-serif;font-size:11pt;">Childhood Cancer Data Initiative (CCDI)</span> <span style="font-fa