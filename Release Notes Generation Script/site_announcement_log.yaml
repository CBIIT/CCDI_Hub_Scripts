    <p><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">The National Cancer Institute is pleased to announce the addition of the Analytic Tool resource type to the Childhood Cancer Data Catalog website: <a href="https://datacatalog.ccdi.cancer.gov/" style="color:#0563c1; text-decoration:underline">https://datacatalog.ccdi.cancer.gov/</a>. This new resource type allows the Catalog to capture any platform, methodology, framework or other software designed for the use of and interpretation of biomedical research data and expands its reach to connect with even more resources. For this initial 2023 release, we are adding 3 Analytic Tool resources with 8 new datasets &ndash; Cancer Genomic Cloud (CGC) (4), HitWalker2 (1), and Vizome (3).</span></span></p> <p><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">The Catalog is also expanded to add 5 new resources with 38 new datasets - Gene Expression Omnibus (GEO) (25), Childhood Leukemia International Consortium (CLIC) (1), Population-based Research to Optimize the Screening Process (PROSPR) (3), Single-cell Pediatric Cancer Atlas Portal (ScPCA) (8), Victorian Paediatric Cancer Consortium (VPCC) (1).</span></span></p> <p><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">There are several site improvements in this update, including a new dynamic chart to display Core Data Elements on the Dataset Details page.</span></span></p> <h1><span style="font-size:16pt"><span style="font-family:&quot;Calibri Light&quot;,sans-serif"><span style="color:#2f5496">Data Updates</span></span></span></h1> <h2><span style="font-size:13pt"><span style="font-family:&quot;Calibri Light&quot;,sans-serif"><span style="color:#2f5496">New Resource Type and Datasets </span></span></span></h2> <p><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">The CCDC has added a new resource type, &lsquo;Analytic Tool&rsquo; with <strong>3</strong> new resources and <strong>8</strong> new datasets.</span></span></p> <ul> <li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">Cancer Genomics Cloud (CGC)</span></span> <ul style="list-style-type:circle"> <li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif"><strong><span style="background-color:white"><span style="font-family:&quot;Calibri&quot;,sans-serif"><span style="color:black">New dataset</span></span></span></strong><span style="background-color:white"><span style="color:black">&nbsp;-&nbsp;</span></span>CICERO - Algorithm </span></span></li> <li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif"><strong><span style="background-color:white"><span style="font-family:&quot;Calibri&quot;,sans-serif"><span style="color:black">New dataset</span></span></span></strong><span style="background-color:white"><span style="color:black">&nbsp;-&nbsp;</span></span>NetBID - System biology pipeline</span></span></li> <li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif"><strong><span style="background-color:white"><span style="font-family:&quot;Calibri&quot;,sans-serif"><span style="color:black">New dataset</span></span></span></strong><span style="background-color:white"><span style="color:black">&nbsp;-&nbsp;</span></span>RNAIndel &ndash; Indel prediction tool</span></span></li> <li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif"><strong><span style="background-color:white"><span style="font-family:&quot;Calibri&quot;,sans-serif"><span style="color:black">New dataset</span></span></span></strong><span style="background-color:white"><span style="color:black">&nbsp;-&nbsp;</span></span>Teltale - Telomeric read tool</span></span></li> </ul> </li> <li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">HitWalker2</span></span> <ul style="list-style-type:circle"> <li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif"><strong><span style="background-color:white"><span style="font-family:&quot;Calibri&quot;,sans-serif"><span style="color:black">New dataset</span></span></span></strong><span style="background-color:white"><span style="color:black">&nbsp;-&nbsp;</span></span>HitWalker2 - Visualization tool</span></span></li> </ul> </li> <li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">Vizome - discovery platform</span></span> <ul style="list-style-type:circle"> <li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif"><strong><span style="background-color:white"><span style="font-family:&quot;Calibri&quot;,sans-serif"><span style="color:black">New dataset</span></span></span></strong><span style="background-color:white"><span style="color:black">&nbsp;-&nbsp;</span></span>BEAT AML</span></span></li> <li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif"><strong><span style="background-color:white"><span style="font-family:&quot;Calibri&quot;,sans-serif"><span style="color:black">New dataset</span></span></span></strong><span style="background-color:white"><span style="color:black">&nbsp;-&nbsp;</span></span>BEAT AML 2.0</span></span></li> <li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif"><strong><span style="background-color:white"><span style="font-family:&quot;Calibri&quot;,sans-serif"><span style="color:black">New dataset</span></span></span></strong><span style="background-color:white"><span style="color:black">&nbsp;-&nbsp;</span></span>Chronic neutrophilic leukemia (CNL)</span></span></li> </ul> </li> </ul> <h2><span style="font-size:13pt"><span style="font-family:&quot;Calibri Light&quot;,sans-serif"><span style="color:#2f5496">New Participating Resource and Datasets</span></span></span></h2> <p><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">The CCDC has added <strong>5</strong> new resources that include <strong>38</strong> new datasets.</span></span></p> <ul> <li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif"><span style="color:black">Childhood Leukemia International Consortium (CLIC)</span></span></span> <ul style="list-style-type:circle"> <li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif"><strong><span style="background-color:white"><span style="font-family:&quot;Calibri&quot;,sans-serif"><span style="color:black">New dataset</span></span></span></strong><span style="background-color:white"><span style="color:black">&nbsp;-&nbsp;</span></span><span style="color:black">Childhood Cancer &amp; Leukemia International Consortium</span></span></span></li> </ul> </li> <li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif"><span style="color:black">Gene Expression Omnibus (GEO)</span></span></span> <ul style="list-style-type:circle"> <li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif"><strong><span style="background-color:white"><span style="font-family:&quot;Calibri&quot;,sans-serif"><span style="color:black">New dataset</span></span></span></strong><span style="background-color:white"><span style="color:black">&nbsp;-&nbsp;</span></span><span style="color:black">Bone morphogenetic protein-7 is a MYC target with pro-survival functions in childhood medulloblastoma</span></span></span></li> <li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif"><strong><span style="background-color:white"><span style="font-family:&quot;Calibri&quot;,sans-serif"><span style="color:black">New dataset</span></span></span></strong><span style="background-color:white"><span style="color:black">&nbsp;-&nbsp;</span></span><span style="color:black">Clear Cell Sarcoma of the Kidney</span></span></span></li> <li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif"><strong><span style="background-color:white"><span style="font-family:&quot;Calibri&quot;,sans-serif"><span style="color:black">New dataset</span></span></span></strong><span style="background-color:white"><span style="color:black">&nbsp;-&nbsp;</span></span><span style="color:black">Discovery of novel recurrent mutations and rearrangements in early T-cell precursor acute lymphoblastic leukemia by whole genome sequencing</span></span></span></li> <li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif"><strong><span style="background-color:white"><span style="font-family:&quot;Calibri&quot;,sans-serif"><span style="color:black">New dataset</span></span></span></strong><span style="background-color:white"><span style="color:black">&nbsp;-&nbsp;</span></span><span style="color:black">Distinctive microRNA signature of medulloblastomas associated with the WNT signaling pathway</span></span></span></li> <li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif"><strong><span style="background-color:white"><span style="font-family:&quot;Calibri&quot;,sans-serif"><span style="color:black">New dataset</span></span></span></strong><span style="background-color:white"><span style="color:black">&nbsp;-&nbsp;</span></span><span style="color:black">Early Relapse in ALL is identified by Time To Leukemia in NOD/SCID mice and is characterized by a gene signature involving survival pathways</span></span></span></li> <li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif"><strong><span style="background-color:white"><span style="font-family:&quot;Calibri&quot;,sans-serif"><span style="color:black">New dataset</span></span></span></strong><span style="background-color:white"><span style="color:black">&nbsp;-&nbsp;</span></span><span style="color:black">Expression data from Burkitt lymphoma cases</span></span></span></li> <li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif"><strong><span style="background-color:white"><span style="font-family:&quot;Calibri&quot;,sans-serif"><span style="color:black">New dataset</span></span></span></strong><span style="background-color:white"><span style="color:black">&nbsp;-&nbsp;</span></span><span style="color:black">Frequent driver mutations in histone H3.3 and chromatin remodeling genes in paediatric glioblastoma</span></span></span></li> <li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif"><strong><span style="background-color:white"><span style="font-family:&quot;Calibri&quot;,sans-serif"><span style="color:black">New dataset</span></span></span></strong><span style="background-color:white"><span style="color:black">&nbsp;-&nbsp;</span></span><span style="color:black">Gene expression analysis of primitive neuroectodermal tumors</span></span></span></li> <li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif"><strong><span style="background-color:white"><span style="font-family:&quot;Calibri&quot;,sans-serif"><span style="color:black">New dataset</span></span></span></strong><span style="background-color:white"><span style="color:black">&nbsp;-&nbsp;</span></span><span style="color:black">Gene expression data from glioblastoma tumor samples</span></span></span></li> <li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif"><strong><span style="background-color:white"><span style="font-family:&quot;Calibri&quot;,sans-serif"><span style="color:black">New dataset</span></span></span></strong><span style="background-color:white"><span style="color:black">&nbsp;-&nbsp;</span></span><span style="color:black">Gene expression data of glucocorticoid resistant and sensitive acute lymphoblastic leukemia cell lines</span></span></span></li> <li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif"><strong><span style="background-color:white"><span style="font-family:&quot;Calibri&quot;,sans-serif"><span style="color:black">New dataset</span></span></span></strong><span style="background-color:white"><span style="color:black">&nbsp;-&nbsp;</span></span><span style="color:black">Gene expression profiling of children affected by acute lymphoblastic leukemia</span></span></span></li> <li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif"><strong><span style="background-color:white"><span style="font-family:&quot;Calibri&quot;,sans-serif"><span style="color:black">New dataset</span></span></span></strong><span style="background-color:white"><span style="color:black">&nbsp;-&nbsp;</span></span><span style="color:black">Gene expression profiling of children affected by Alveolar Rhabdomyosarcoma (ARMS)</span></span></span></li> <li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif"><strong><span style="background-color:white"><span style="font-family:&quot;Calibri&quot;,sans-serif"><span style="color:black">New dataset</span></span></span></strong><span style="background-color:white"><span style="color:black">&nbsp;-&nbsp;</span></span><span style="color:black">Gene expression profiling of MYC-amplified medulloblastoma cell lines treated by JQ1, a BET bromodomain inhibitor</span></span></span></li> <li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif"><strong><span style="background-color:white"><span style="font-family:&quot;Calibri&quot;,sans-serif"><span style="color:black">New dataset</span></span></span></strong><span style="background-color:white"><span style="color:black">&nbsp;-&nbsp;</span></span><span style="color:black">Genome-wide SNP Profiling of 27 Neuroblastoma Cell Lines</span></span></span></li> <li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif"><strong><span style="background-color:white"><span style="font-family:&quot;Calibri&quot;,sans-serif"><span style="color:black">New dataset</span></span></span></strong><span style="background-color:white"><span style="color:black">&nbsp;-&nbsp;</span></span><span style="color:black">GRHL1 acts as a tumor suppressor in neuroblastoma and is negatively regulated by MYCN and HDAC3</span></span></span></li> <li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif"><strong><span style="background-color:white"><span style="font-family:&quot;Calibri&quot;,sans-serif"><span style="color:black">New dataset</span></span></span></strong><span style="background-color:white"><span style="color:black">&nbsp;-&nbsp;</span></span><span style="color:black">In vitro prednisolone resistance signature in MLL-rearranged infant ALL</span></span></span></li> <li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif"><strong><span style="background-color:white"><span style="font-family:&quot;Calibri&quot;,sans-serif"><span style="color:black">New dataset</span></span></span></strong><span style="background-color:white"><span style="color:black">&nbsp;-&nbsp;</span></span><span style="color:black">miR-483 overexpression in human sarcoma cell line MHH-ES-1</span></span></span></li> <li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif"><strong><span style="background-color:white"><span style="font-family:&quot;Calibri&quot;,sans-serif"><span style="color:black">New dataset</span></span></span></strong><span style="background-color:white"><span style="color:black">&nbsp;-&nbsp;</span></span><span style="color:black">MLL partner genes confer distinct biological and clinical signatures of pediatric AML, an AIEOP study</span></span></span></li> <li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif"><strong><span style="background-color:white"><span style="font-family:&quot;Calibri&quot;,sans-serif"><span style="color:black">New dataset</span></span></span></strong><span style="background-color:white"><span style="color:black">&nbsp;-&nbsp;</span></span><span style="color:black">Novel mutations target distinct subgroups of medulloblastoma</span></span></span></li> <li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif"><strong><span style="background-color:white"><span style="font-family:&quot;Calibri&quot;,sans-serif"><span style="color:black">New dataset</span></span></span></strong><span style="background-color:white"><span style="color:black">&nbsp;-&nbsp;</span></span><span style="color:black">Pediatric AML and Normal Bone Marrow</span></span></span></li> <li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif"><strong><span style="background-color:white"><span style="font-family:&quot;Calibri&quot;,sans-serif"><span style="color:black">New dataset</span></span></span></strong><span style="background-color:white"><span style="color:black">&nbsp;-&nbsp;</span></span><span style="color:black">Pediatric malignant germ cell tumors show characteristic transcriptome profiles</span></span></span></li> <li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif"><strong><span style="background-color:white"><span style="font-family:&quot;Calibri&quot;,sans-serif"><span style="color:black">New dataset</span></span></span></strong><span style="background-color:white"><span style="color:black">&nbsp;-&nbsp;</span></span><span style="color:black">Pediatric Sarcoma: Rhabdomyosarcoma &amp; Ewing&#39;s Sarcoma</span></span></span></li> <li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif"><strong><span style="background-color:white"><span style="font-family:&quot;Calibri&quot;,sans-serif"><span style="color:black">New dataset</span></span></span></strong><span style="background-color:white"><span style="color:black">&nbsp;-&nbsp;</span></span><span style="color:black">The leukemia-specific fusion gene ETV6/RUNX1 perturbs distinct key biological functions primarily by gene repression</span></span></span></li> <li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif"><strong><span style="background-color:white"><span style="font-family:&quot;Calibri&quot;,sans-serif"><span style="color:black">New dataset</span></span></span></strong><span style="background-color:white"><span style="color:black">&nbsp;-&nbsp;</span></span><span style="color:black">Transcriptomic Profiling of 39 Neuroblastoma Cell Lines</span></span></span></li> <li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif"><strong><span style="background-color:white"><span style="font-family:&quot;Calibri&quot;,sans-serif"><span style="color:black">New dataset</span></span></span></strong><span style="background-color:white"><span style="color:black">&nbsp;-&nbsp;</span></span><span style="color:black">Transient treatment with epigenetic modifiers yields stable neuroblastoma stem cells resembling aggressive large-cell neuroblastomas</span></span></span></li> </ul> </li> <li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif"><span style="color:black">Population-based Research to Optimize the Screening Process (PROSPR)</span></span></span> <ul style="list-style-type:circle"> <li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif"><strong><span style="background-color:white"><span style="font-family:&quot;Calibri&quot;,sans-serif"><span style="color:black">New dataset</span></span></span></strong><span style="background-color:white"><span style="color:black">&nbsp;-&nbsp;</span></span><span style="color:black">PROSPR 1 Breast Cancer Screening Dataset</span></span></span></li> <li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif"><strong><span style="background-color:white"><span style="font-family:&quot;Calibri&quot;,sans-serif"><span style="color:black">New dataset</span></span></span></strong><span style="background-color:white"><span style="color:black">&nbsp;-&nbsp;</span></span><span style="color:black">PROSPR 1 Cervical Cancer Public Use Dataset</span></span></span></li> <li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif"><strong><span style="background-color:white"><span style="font-family:&quot;Calibri&quot;,sans-serif"><span style="color:black">New dataset</span></span></span></strong><span style="background-color:white"><span style="color:black">&nbsp;-&nbsp;</span></span><span style="color:black">PROSPR 2 Cervical Cancer Public Use Dataset</span></span></span></li> </ul> </li> <li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif"><span style="color:black">Single-cell Pediatric Cancer Atlas Portal (ScPCA) &ndash; 8 Datasets</span></span></span> <ul style="list-style-type:circle"> <li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif"><strong><span style="background-color:white"><span style="font-family:&quot;Calibri&quot;,sans-serif"><span style="color:black">New dataset</span></span></span></strong><span style="background-color:white"><span style="color:black">&nbsp;-&nbsp;</span></span><span style="color:black">Profiling the transcriptional heterogeneity of diverse pediatric solid tumors - Neuroblastoma</span></span></span></li> <li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif"><strong><span style="background-color:white"><span style="font-family:&quot;Calibri&quot;,sans-serif"><span style="color:black">New dataset</span></span></span></strong><span style="background-color:white"><span style="color:black">&nbsp;-&nbsp;</span></span><span style="color:black">Profiling the transcriptional heterogeneity of diverse pediatric solid tumors - Rhabdomyosarcoma</span></span></span></li> <li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif"><strong><span style="background-color:white"><span style="font-family:&quot;Calibri&quot;,sans-serif"><span style="color:black">New dataset</span></span></span></strong><span style="background-color:white"><span style="color:black">&nbsp;-&nbsp;</span></span><span style="color:black">Single cell RNA sequencing of pediatric high-grade gliomas</span></span></span></li> <li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif"><strong><span style="background-color:white"><span style="font-family:&quot;Calibri&quot;,sans-serif"><span style="color:black">New dataset</span></span></span></strong><span style="background-color:white"><span style="color:black">&nbsp;-&nbsp;</span></span><span style="color:black">Single cell RNA sequencing of pediatric low-grade gliomas</span></span></span></li> <li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif"><strong><span style="background-color:white"><span style="font-family:&quot;Calibri&quot;,sans-serif"><span style="color:black">New dataset</span></span></span></strong><span style="background-color:white"><span style="color:black">&nbsp;-&nbsp;</span></span><span style="color:black">Single nuclear RNA-seq and spatial transcriptomic analysis of anaplastic and favorable histology Wilms tumor</span></span></span></li> <li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif"><strong><span style="background-color:white"><span style="font-family:&quot;Calibri&quot;,sans-serif"><span style="color:black">New dataset</span></span></span></strong><span style="background-color:white"><span style="color:black">&nbsp;-&nbsp;</span></span><span style="color:black">Single-cell gene expression and cytosine modification profiling in pediatric central nervous system tumors</span></span></span></li> <li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif"><strong><span style="background-color:white"><span style="font-family:&quot;Calibri&quot;,sans-serif"><span style="color:black">New dataset</span></span></span></strong><span style="background-color:white"><span style="color:black">&nbsp;-&nbsp;</span></span><span style="color:black">Single-cell profiling of Acute Myeloid Leukemia for high-resolution chemo-immunotherapy target discovery</span></span></span></li> <li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif"><strong><span style="background-color:white"><span style="font-family:&quot;Calibri&quot;,sans-serif"><span style="color:black">New dataset</span></span></span></strong><span style="background-color:white"><span style="color:black">&nbsp;-&nbsp;</span></span><span style="color:black">Single-cell sequencing of acute lymphoblastic leukemia</span></span></span></li> </ul> </li> <li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif"><span style="color:black">Victorian Paediatric Cancer Consortium (VPCC)</span></span></span> <ul style="list-style-type:circle"> <li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif"><strong><span style="background-color:white"><span style="font-family:&quot;Calibri&quot;,sans-serif"><span style="color:black">New dataset</span></span></span></strong><span style="background-color:white"><span style="color:black">&nbsp;-&nbsp;</span></span><span style="color:black">Childhood Cancer Model Atlas</span></span></span></li> </ul> </li> </ul> <h2><span style="font-size:13pt"><span style="font-family:&quot;Calibri Light&quot;,sans-serif"><span style="color:#2f5496">Existing Participating Resources and Datasets</span></span></span></h2> <p><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif"><strong>4 </strong>existing resources have been updated to include the addition of<strong> 1 </strong>new dataset and several updates to existing datasets<strong>.</strong></span></span></p> <ul> <li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">Childhood Cancer Data Initiative (CCDI)</span></span> <ul style="list-style-type:circle"> <li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif"><strong>New dataset</strong> - OncoKids - NGS Panel for Pediatric Malignancies</span></span></li> </ul> </li> <li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">Clinical Interpretations of Variants in Cancer (CIViC)</span></span> <ul style="list-style-type:circle"> <li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">Update Homepage URL</span></span></li> </ul> </li> <li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">Oncogenomics</span></span> <ul style="list-style-type:circle"> <li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">Added dbGaP accession numbers to multiple datasets</span></span></li> </ul> </li> <li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">Pediatric Preclinical Testing Consortium (PPTC)</span></span> <ul style="list-style-type:circle"> <li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">Update with additional Publications</span></span></li> </ul> </li> </ul> <p>&nbsp;</p> <h1><span style="font-size:16pt"><span style="font-family:&quot;Calibri Light&quot;,sans-serif"><span style="color:#2f5496">General Site Updates</span></span></span></h1> <ul> <li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">The homepage text &lsquo;What can you expect from the Data Catalog&rsquo; has been updated to remove text overlap.</span></span></li> <li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">The breadcrumb navigation has been updated to have a more distinguished coloration</span></span></li> <li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">Tooltips now display better on small windows.</span></span></li> <li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">A header image has been added to the Document Search page. </span></span></li> <li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">A new category, Image Type, has been added to the Glossary to better distinguish terms related to imaging.&nbsp; Additionally, the Glossary has been updated with new acronyms and abbreviations.</span></span></li> <li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">The entries on the Site Update page now include an icon(s) to identify the Data Content Type includes in the update.&nbsp; These new icons convey information across all the newly added datasets at a quick glance.</span></span></li> <li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">The User Guide is updated to reflect new and updated resource information.</span></span></li> </ul> <h1><span style="font-size:16pt"><span style="font-family:&quot;Calibri Light&quot;,sans-serif"><span style="color:#2f5496">Search Catalog</span></span></span></h1> <ul> <li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">The Search Catalog export was updated to include the following additional Core Data Elements on export</span></span> <ul style="list-style-type:circle"> <li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">Case Gender, Sample Anatomic Site, Sample Composition Type, Sample is Normal, Sample is Xenograft </span></span></li> </ul> </li> </ul> <h1><span style="font-size:16pt"><span style="font-family:&quot;Calibri Light&quot;,sans-serif"><span style="color:#2f5496">Dataset Details</span></span></span></h1> <ul> <li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">A new set of dynamic charts has been added to the Dataset Details page to display the available Core Data Elements.&nbsp; Each available core data element can now be displayed as a donut chart with age displayed as a histogram.</span></span></li> <li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">Links in the dataset&rsquo;s Description are now functional.</span></span></li> </ul> <h1><span style="font-size:16pt"><span style="font-family:&quot;Calibri Light&quot;,sans-serif"><span style="color:#2f5496">Participating Resources</span></span></span></h1> <ul> <li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">Users can now filter by the new Resource Type &lsquo;Analytic Tool&rsquo;</span></span></li> <li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">The Resource Filter column now includes a clear button that clears all the selected fields in the filter and clear the navigation pane of filtered results.</span></span></li> </ul> <h1><span style="font-size:16pt"><span style="font-family:&quot;Calibri Light&quot;,sans-serif"><span style="color:#2f5496">Participating Resources Details</span></span></span></h1> <ul> <li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">Fixed an issue where dataset type bubbles were displaying incorrectly from the participating resource details page.</span></span></li> </ul> <p style="margin-left:48px">&nbsp;</p> <h1><span style="font-size:16pt"><span style="font-family:&quot;Calibri Light&quot;,sans-serif"><span style="color:#2f5496">Additional Support and Inquiries</span></span></span></h1> <p><span style="font-size:12pt"><span style="font-family:&quot;Times New Roman&quot;,serif"><span style="font-size:11.0pt"><span style="font-family:&quot;Calibri&quot;,sans-serif">Users requiring any additional support or with any questions about the CCDC can contact Childhood Cancer Data Initiative at </span></span><a href="mailto:NCIChildhoodCancerDataInitiative@mail.nih.gov" style="color:#0563c1; text-decoration:underline"><span style="font-size:11.0pt"><span style="font-family:&quot;Calibri&quot;,sans-serif"><span style="color:#0563c1">NCIChildhoodCancerDataInitiative@mail.nih.gov</span></span></span></a><span style="font-size:11.0pt"><span style="font-family:&quot;Calibri&quot;,sans-serif">.&nbsp; Please include a name and a reference to the CCDC with the submitted inquiry.</span></span></span></span></p>
