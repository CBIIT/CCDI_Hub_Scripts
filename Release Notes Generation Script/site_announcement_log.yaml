    <p style="line-height:107%;margin:0in 0in 8pt;"><span style="color:black;font-family:Calibri, sans-serif;font-size:11pt;">The August release includes numerous updates to existing resources and six new datasets: CCDI’s Single-Cell Atlas of NF1 Nerve Sheath Tumors and Identification and Targeting of Treatment Resistant Progenitor Populations in T-cell Acute Lymphoblastic Leukemia; TCIA’s MR Imaging of Pediatric Subjects with High-Grade Gliomas (DFCI-BCH-BWH-PEDs-HGG); and ScPCA’s Single-cell Atlas of Pediatric Sarcoma, Single-cell profiling of pediatric bone sarcoma, and Profiling the transcriptional heterogeneity of diverse pediatric solid tumors - Osteosarcoma. Additional changes include updated counts of seven resources, updated case disease diagnosis lists for two resources, and updated references, resource-level properties, and other minor changes for numerous resources. Links were removed for the NCI CCSG CCDI Supplement Additional Genomic Submission and the ICGC Data Portal, and datasets were removed from Kids First Data Resource (ICR-DIPG, TARGET-AML, TARGET-NB, and PBTA-PNOC) and the Cancer Genome Characterization Initiative (NHL). No new functional updates were made to the user interface, but a critical software update was made to mitigate a potential security vulnerability.&nbsp;</span></p> <p style="line-height:107%;margin:0in 0in 8pt;"><span style="color:black;font-family:Calibri, sans-serif;font-size:11pt;">Detailed updates are described below. </span><span style="color:black;font-family:Calibri, sans-serif;font-size:11pt;">[<i>Edited 9/25/2024 to correct errors in resource and dataset count summaries</i>]</span><span style="font-family:Calibri, sans-serif;font-size:11pt;"></span><span style="font-family:Calibri, sans-serif;font-size:11pt;"></span></p> <p style="line-height:107%;margin:0in 0in 8pt;">&nbsp;</p> <h1 style="break-after:avoid;font-weight:normal;line-height:107%;margin:12pt 0in 0in;"><span style="color:rgb(47,84,150);font-family:&quot;Calibri Light&quot;, sans-serif;font-size:16pt;">Data Updates</span></h1> <h2 style="break-after:avoid;font-weight:normal;line-height:107%;margin:2pt 0in 0in;"><span style="color:rgb(47,84,150);font-family:&quot;Calibri Light&quot;, sans-serif;font-size:13pt;"><span>Existing Participating Resources and Datasets</span></span></h2> <p style="line-height:107%;margin:0in 0in 8pt;"><span style="color:black;font-family:&quot;Calibri&quot;,sans-serif;font-size:11pt;"><strong>15&nbsp;</strong></span><span style="color:black;font-family:Calibri, sans-serif;font-size:11pt;">existing resources have been updated with additional</span><span style="color:black;font-family:&quot;Calibri&quot;,sans-serif;font-size:11pt;"><strong>&nbsp;</strong></span><span style="color:black;font-family:Calibri, sans-serif;font-size:11pt;">data and information or removed.</span><span style="font-family:Calibri, sans-serif;font-size:11pt;"></span></p> <ul style="padding-left:48px;">     <li>         <p style="line-height:107%;margin-bottom:0in;margin-right:0in;margin-top:0in;"><span style="font-family:Calibri, sans-serif;font-size:11pt;"><span style="font-family:Symbol;"></span></span><span style="color:black;font-family:Calibri, sans-serif;font-size:11pt;">Childhood Cancer Data Initiative (CCDI) </span><span style="font-family:Calibri, sans-serif;font-size:11pt;"></span></p>         <ul style="padding-left:48px;">             <li>                 <p style="line-height:107%;margin-bottom:0in;margin-right:0in;margin-top:0in;"><span style="font-family:Calibri, sans-serif;font-size:11pt;"><span style="font-family:&quot;Courier New&quot;;"></span></span><span style="color:black;font-family:Calibri, sans-serif;font-size:11pt;">New Dataset – Childhood Cancer Data Initiative (CCDI): Single-Cell Atlas of NF1 Nerve Sheath Tumors</span><span style="font-family:Calibri, sans-serif;font-size:11pt;"></span></p>             </li>             <li>                 <p style="line-height:107%;margin-bottom:0in;margin-ri