<span style="font-family:Calibri, sans-serif;font-size:11pt;"></span></li>         </ul>     </li>     <li style="line-height:normal;margin-bottom:8pt;margin-right:0in;margin-top:0in;"><span style="color:black;font-family:Calibri, sans-serif;font-size:11pt;">A “Metadata Files” link was added to the navigation bar under the CCDI Studies menu to enable users to download all digests directly from the UI. &nbsp;</span><span style="font-family:Calibri, sans-serif;font-size:11pt;"></span></li>     <li style="line-height:normal;margin-bottom:8pt;margin-right:0in;margin-top:0in;"><span style="color:black;font-family:Calibri, sans-serif;font-size:11pt;">An index was added to the Site Updates page to improve navigation between release notes and provide a more consistent experience across CCDI resources.<span style="font-size:10.5pt;"></span></span></li>     <li style="line-height:normal;margin-bottom:8pt;margin-right:0in;margin-top:0in;"><span style="color:black;font-family:Calibri, sans-serif;font-size:11pt;"><span>1.5.0 release notes were updated to reflect the correct an error in the summary count of datasets added in the last release. </span><span style="font-size:10.5pt;"></span></span></li>     <li style="line-height:normal;margin-bottom:8pt;margin-right:0in;margin-top:0in;"><span style="color:black;font-family:Calibri, sans-serif;font-size:11pt;">The User Guide is updated to reflect new and updated resource information.</span></li> </ul> <h1 style="break-after:avoid;font-weight:normal;line-height:107%;margin:12pt 0in 0in;"><span style="color:rgb(47,84,150);font-family:&quot;Calibri Light&quot;, sans-serif;font-size:16pt;"><span class="normaltextrun">Additional Support and Inquiries</span></span></h1> <p class="paragraph" style="margin:0in;vertical-align:baseline;"><span style="font-family:&quot;Calibri&quot;,sans-serif;font-size:11.0pt;"><span class="normaltextrun">Users requiring any additional support or with any questions about the CCDC can contact the Childhood Cancer Data Initiative at </span></span><a href="mailto:NCIChildhoodCancerDataInitiative@mail.nih.gov"><span style="color:#0563C1;font-family:&quot;Calibri&quot;,sans-serif;font-size:11.0pt;"><span class="normaltextrun">NCIChildhoodCancerDataInitiative@mail.nih.gov</span></span></a><span style="font-family:&quot;Calibri&quot;,sans-serif;font-size:11.0pt;"><span class="normaltextrun">. Please include a name and a reference to the CCDC with the submitted inquiry.</span></span><span style="font-family:&quot;Times New Roman&quot;, serif;font-size:12pt;"><span style="font-family:&quot;Calibri&quot;,sans-serif;font-size:11.0pt;"></span></span></p>

