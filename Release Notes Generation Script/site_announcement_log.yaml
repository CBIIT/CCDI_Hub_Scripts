    <p style="line-height:107%;margin:0in 0in 8pt;"> <span style="color:black;font-family:Calibri, sans-serif;font-size:11pt;">The first release of the Childhood Cancer Data Initiative Data Catalog in 2026 is overflowing with new resources, new datasets, and updates to existing resources and datasets. New resources added to version 1.5.7 include the CONCORD*Explorer, NF Data Portal, and scMINER, boasting a combined 16 new datasets. 32 new datasets have also been added to six existing resources with notable additions to cBioPortal, Gene Expression Omnibus (GEO), and dbGaP. Eight additional studies have been updated with respect to counts, dbGaP accessions, or references, and PDX AIM was renamed to PDX INSIGHTS. Functional enhancements include the addition of “Available Files” links to download clinical data for more TARGET datasets and updates to the Participating Resources page to adhere to 508 compliance best practices. The User Guide was updated to reflect version 1.5.7 changes.</span> <span style="font-family:Calibri, sans-serif;font-size:11pt;"></span> </p> <h1 style="break-after:avoid;font-weight:normal;line-height:107%;margin:12pt 0in 0in;"> <a name="_Hlk174970223"> <span style="color:rgb(47,84,150);font-family:&quot;Calibri Light&quot;, sans-serif;font-size:16pt;">Statistics at a Glance</span> </a> </h1> <h2 style="break-after:avoid;font-weight:normal;line-height:107%;margin:2pt 0in 0in;"> <span style="color:rgb(47,84,150);font-family:&quot;Calibri Light&quot;, sans-serif;font-size:13pt;"> <span>v1.5.7 Summary</span> </span> </h2> <p style="line-height:107%;margin:0in 0in 8pt;"> <span style="color:black;font-family:&quot;Calibri&quot;,sans-serif;font-size:11pt;"> <strong>33rd</strong> </span> <span style="color:black;font-family:Calibri, sans-serif;font-size:11pt;"> Release</span> </p><p style="line-height:107%;margin:0in 0in 8pt;"> <span style="color:black;font-family:&quot;Calibri&quot;,sans-serif;font-size:11pt;"> <strong>412</strong> </span> <span style="color:black;font-family:Calibri, sans-serif;font-size:11pt;"> Datasets</span> </p><p style="line-height:107%;margin:0in 0in 8pt;"> <span style="color:black;font-family:&quot;Calibri&quot;,sans-serif;font-size:11pt;"> <strong>68</strong> </span> <span style="color:black;font-family:Calibri, sans-serif;font-size:11pt;"> Resources</span> </p><ul style="padding-left:48px;"> <li> <p style="line-height:107%;margin:0;"> <span style="color:black;font-family:Calibri, sans-serif;font-size:11pt;"> <span> <strong>11</strong></span> Analytical Tools</span> </p> </li> <li> <p style="line-height:107%;margin:0;"> <span style="color:black;font-family:Calibri, sans-serif;font-size:11pt;"> <span> <strong>6</strong></span> Biorepositories</span> </p> </li><li> <p style="line-height:107%;margin:0;"> <span style="color:black;font-family:Calibri, sans-serif;font-size:11pt;"> <span> <strong>8</strong></span> Catalogs</span> </p> </li> <li> <p style="line-height:107%;margin:0;"> <span style="color:black;font-family:Calibri, sans-serif;font-size:11pt;"> <span> <strong>20</strong></span> Data Repositories</span> </p> </li> <li> <p style="line-height:107%;margin:0;"> <span style="color:black;font-family:Calibri, sans-serif;font-size:11pt;"> <span> <strong>3</strong></span> Knowledgebases</span> </p> </li> <li> <p style="line-height:107%;margin:0;"> <span style="color:black;font-family:Calibri, sans-serif;font-size:11pt;"> <span> <strong>14</strong></span> Programs</span> </p> </li> <li> <p style="line-height:107%;margin:0;"> <span style="color:black;font-family:Calibri, sans-serif;font-size:11pt;"> <span> <strong>1</strong></span> Project</span> </p> </li> <li> <p style="line-height:107%;margin:0;"> <span style="color:black;font-family:Calibri, sans-serif;font-size:11pt;"> <span> <strong>5</strong></span> Registries</span> </p> </li> </ul><h1 style="break-after:avoid;font-weight:normal;line-height:107%;margin:12pt 0in 0in;"> <a name="_Hlk174970223"> <span style="color:rgb(47,84,150);font-famil