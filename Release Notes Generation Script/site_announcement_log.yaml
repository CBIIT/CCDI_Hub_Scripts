ns-serif">Updated case counts, case disease diagnosis information, and sample counts for Molecular Characterization Initiative (MCI).</span></span></li></ul></li><li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">The database of Genotypes and Phenotypes (dbGaP)</span></span><ul style="list-style-type:circle"><li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif"><strong>New dataset </strong>&ndash; ARST17B2-Q Germline and Somatic Genetic Landscape of Pediatric Rhabdomyosarcoma</span></span></li><li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif"><strong>New dataset </strong>&ndash;<strong> </strong>Comprehensive Omics Analysis of Pediatric Solid Tumors and Establishment of a Repository for Related Biologic Studies (10C0086)</span></span></li></ul></li><li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">Genomic Data Commons (GDC)</span></span><ul style="list-style-type:circle"><li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">Updated case counts, case disease diagnosis information, and sample counts for <em>MP2PRT: Identification of Genetic Changes Associated with Relapse and/or Adaptive Resistance in Patients Registered as Favorable Histology Wilms Tumor on AREN03B2</em></span></span></li></ul></li><li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">Human Cancer Models Initiative (HCMI)</span></span><ul style="list-style-type:circle"><li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">Added dbGaP accession.</span></span></li></ul></li><li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">My Pediatric and Adult Rare Tumor (MyPART) network</span></span><ul style="list-style-type:circle"><li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">Added additional Clinical Trial Identifiers</span></span></li></ul></li><li><span style="font-size:11pt"