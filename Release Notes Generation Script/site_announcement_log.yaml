    <p style="line-height:107%;margin:0in 0in 8pt;"><span style="color:black;font-family:Calibri, sans-serif;font-size:11pt;">This release of the Childhood Cancer Data Catalog includes 4 new datasets in 3 resources, updated counts from the CancerModels.org and&nbsp;Patient-Derived Xenograft and Advanced In Vivo Models (PDX-AIM) datasets, and a reorganization of the&nbsp;Childhood Cancer and Leukemia International Consortium (CLIC) dataset as a part of the&nbsp;</span><span style="color:black;font-family:Calibri, sans-serif;font-size:11pt;">World Health Organization - International Agency for Research on Cancer (WHO-IARC).&nbsp;</span></p> <p style="line-height:107%;margin:0in 0in 8pt;"><span style="color:black;font-family:Calibri, sans-serif;font-size:11pt;">Additional functional improvements include the clean-up of an issue resulting in blocks of unreadable text in the site updates export PDFs, and updating the DNS&nbsp;certificate for the Catalog.</span></p> <p style="line-height:107%;margin:0in 0in 8pt;"><span style="color:black;font-family:Calibri, sans-serif;font-size:11pt;">Detailed data and site updates are described below.</span></p> <h1 style="break-after:avoid;font-weight:normal;line-height:107%;margin:12pt 0in 0in;"><span style="color:rgb(47,84,150);font-family:&quot;Calibri Light&quot;, sans-serif;font-size:16pt;">Data Updates</span></h1> <h2 style="break-after:avoid;font-weight:normal;line-height:107%;margin:2pt 0in 0in;"><span style="color:rgb(47,84,150);font-family:&quot;Calibri Light&quot;, sans-serif;font-size:13pt;"><span>Existing Participating Resources and Datasets</span></span></h2> <p style="line-height:107%;margin:0in 0in 8pt;"><span style="color:black;font-family:&quot;Calibri&quot;,sans-serif;font-size:11pt;"><strong>6&nbsp;</strong></span><span style="color:black;font-family:Calibri, sans-serif;font-size:11pt;">existing resources have been updated with additional</span><span style="color:black;font-family:&quot;Calibri&quot;,sans-serif;font-size:11pt;"><strong>&nbsp;</strong></span><span style="color:black;font-family:Calibri, sans-serif;font-size:11pt;">data and information.</span></p> <ul style="padding-left:48px;">     <li>         <p style="line-height:normal;margin-bottom:0in;margin-right:0in;margin-top:0in;"><span style="font-family:Calibri, sans-serif;font-size:11pt;"><span style="font-family:Symbol;"></span><span>CancerModels.org</span></span></p>         <ul style="padding-left:48px;">             <li>                 <p style="line-height:normal;margin-bottom:0in;margin-right:0in;margin-top:0in;"><span style="font-family:Calibri, sans-serif;font-size:11pt;"><span style="font-family:&quot;Courier New&quot;;"></span><span>Added total case count and updated counts</span></span></p>             </li>         </ul>     </li>     <li>         <p style="line-height:normal;margin-bottom:0in;margin-right:0in;margin-top:0in;"><span style="font-family:Calibri, sans-serif;font-size:11pt;"><span style="font-family:Symbol;"></span><span>cBioPortal for Cancer Genomics</span></span></p>         <ul style="padding-left:48px;">             <li>                 <p style="line-height:normal;margin-bottom:0in;margin-right:0in;margin-top:0in;"><span style="font-family:Calibri, sans-serif;font-size:11pt;"><span style="font-family:&quot;Courier New&quot;;"></span><span><strong>New Dataset&nbsp;</strong>– Low-Grade Gliomas UCSF</span></span></p>             </li>             <li>                 <p style="line-height:normal;margin-bottom:0in;margin-right:0in;margin-top:0in;"><span style="font-family:Calibri, sans-serif;font-size:11pt;"><span style="font-family:&quot;Courier New&quot;;"></span><span><strong>New Dataset&nbsp;</strong>– Rhabdomyosarcoma NIH</span></span></p>             </li>         </ul>     </li>     <li>         <p style="line-height:normal;margin-bottom:0in;margin-right:0in;margin-top:0in;"><span style="font-family:Calibri, sans-serif;font-size:11pt;"><span style="font-family:Symbol;"></span><span>Childhood Cancer Data Initiative (CCDI)</span></span></p>         <ul style="padding-left:48px;">             <li>                 <p style="line-height:normal;margin-bottom:0in;margin-right:0in;margin-top:0in;"><span style="font-family:Calibri, sans-serif;font-size:11pt;"><span style="font-family:&quot;Courier New&quot;;"></span><span><strong>New Dataset&nbsp;</strong>–&nbsp;</span></span><span style="color:black;font-family:Calibri, sans-serif;font-size:11pt;">Childhood Cancer Data Initiative (CCDI): CCDI Pediatric In Vivo Testing Program – Leukemia</span></p>             </li>             <li>                 <p style="line-height:normal;margin-bottom:0in;margin-right:0in;margin-top:0in;"><span style="font-family:Calibri, sans-serif;font-size:11pt;"><span style="font-family:&quot;Courier New&quot;;"></span><span>Updated point of contact names</span></span></p>             </li>         </ul>     </li>     <li>         <p style="line-height:normal;margin-bottom:0in;margin-right:0in;margin-top:0in;"><span style="font-family:Calibri, sans-serif;font-size:11pt;"><span style="font-family:Symbol;"></span><span>Gene Expression Omnibus (GEO)</span></span></p>         <ul style="padding-left:48px;">             <li>                 <p style="line-height:normal;margin-bottom:0in;margin-right:0in;margin-top:0in;"><span style="font-family:Calibri, sans-serif;font-size:11pt;"><span style="font-family:&quot;Courier New&quot;;"></span><span><strong>New Dataset&nbsp;</strong>– Genes regulated in EML1 cells expressing the TEL-AML1 oncogene after 5 and 7 days of treatment with IL7 and FLT3 ligand</span></span></p>             </li>         </ul>     </li>     <li>         <p style="line-height:normal;margin-bottom:0in;margin-right:0in;margin-top:0in;"><span style="font-family:Calibri, sans-serif;font-size:11pt;"><span style="font-family:Symbol;"></span><span>Patient-Derived Xenograft and Advanced In Vivo Models (PDX AIM)&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</span></span></p>         <ul style="padding-left:48px;">             <li>                 <p style="line-height:normal;margin-bottom:0in;margin-right:0in;margin-top:0in;"><span style="font-family:Calibri, sans-serif;font-size:11pt;"><span style="font-family:&quot;Courier New&quot;;"></span><span>Updated counts</span></span></p>             </li>         </ul>     </li>     <li>         <p style="line-height:normal;margin-bottom:0in;margin-right:0in;margin-top:0in;"><span style="font-family:Calibri, sans-serif;font-size:11pt;"><span style="font-family:Symbol;"></span><span>World Health Organization - International Agency for Research on Cancer (WHO-IARC)</span></span></p>         <ul style="padding-left:48px;">             <li>                 <p style="line-height:normal;margin-bottom:0in;margin-right:0in;margin-top:0in;"><span style="font-family:Calibri, sans-serif;font-size:11pt;"><span style="font-family:&quot;Courier New&quot;;"></span><span>Added Childhood Cancer and Leukemia International Consortium (CLIC) as a dataset within WHO-IARC and removed it as an independent resource</span></span></p>             </li>         </ul>     </li> </ul> <h1 style="break-after:avoid;font-weight:normal;line-height:107%;margin:12pt 0in 0in;"><a name="_Toc97732894"><span style="color:rgb(47,84,150);font-family:&quot;Calibri Light&quot;, sans-serif;font-size:16pt;"><span>General</span></span></a><span style="color:rgb(47,84,150);font-family:&quot;Calibri Light&quot;, sans-serif;font-size:16pt;"><span> Site Updates</span></span></h1> <ul style="list-style-type:disc;">     <li style="line-height:normal;margin-bottom:8pt;margin-right:0in;margin-top:0in;"><span style="color:black;font-family:Calibri, sans-serif;font-size:11pt;">Readability of the site updates export PDFs was improved.</span></li>     <li style="line-height:normal;margin-bottom:8pt;margin-right:0in;margin-top:0in;"><span style="color:black;font-family:Calibri, sans-serif;font-size:11pt;">The DNS certificate was updated.&nbsp;<span>&nbsp;</span></span></li>     <li style="line-height:normal;margin-bottom:8pt;margin-right:0in;margin-top:0in;"><span style="color:black;font-family:Calibri, sans-serif;font-size:11pt;"><span>The Glossary has been updated.</span><span style="font-size:10.5pt;"></span></span></li>     <li style="line-height:normal;margin-bottom:8pt;margin-right:0in;margin-top:0in;"><span style="color:black;font-family:Calibri, sans-serif;font-size:11pt;">The User Guide is updated to reflect new and updated resource information.</span></li> </ul> <h1 style="break-after:avoid;font-weight:normal;line-height:107%;margin:12pt 0in 0in;"><span style="color:rgb(47,84,150);font-family:&quot;Calibri Light&quot;, sans-serif;font-size:16pt;"><span class="normaltextrun">Additional Support and Inquiries</span></span></h1> <p class="paragraph" style="margin:0in;vertical-align:baseline;"><span style="font-family:&quot;Calibri&quot;,sans-serif;font-size:11.0pt;"><span class="normaltextrun">Users requiring any additional support or with any questions about the CCDC can contact the Childhood Cancer Data Initiative at&nbsp;</span></span><a href="mailto:NCIChildhoodCancerDataInitiative@mail.nih.gov"><span style="color:#0563C1;font-family:&quot;Calibri&quot;,sans-serif;font-size:11.0pt;"><span class="normaltextrun">NCIChildhoodCancerDataInitiative@mail.nih.gov</span></span></a><span style="font-family:&quot;Calibri&quot;,sans-serif;font-size:11.0pt;"><span class="normaltextrun">.&nbsp; Please include a name and a reference to the CCDC with the submitted inquiry.</span></span></p> <p class="paragraph" style="margin:0in;vertical-align:baseline;"><span style="font-family:&quot;Times New Roman&quot;, serif;font-size:12pt;"><span style="font-family:&quot;Calibri&quot;,sans-serif;font-size:11.0pt;"></span></span></p>

