hildhood Cancer Data Initiative at </span> </span> <a href="mailto:NCIChildhoodCancerDataInitiative@mail.nih.gov"> <span style="color:#0563C1;font-family:&quot;Calibri&quot;,sans-serif;font-size:11.0pt;"> <span class="normaltextrun">NCIChildhoodCancerDataInitiative@mail.nih.gov</span> </span> </a> <span style="font-family:&quot;Calibri&quot;,sans-serif;font-size:11.0pt;"> <span class="normaltextrun">. Please include a name and a reference to the CCDC with the submitted inquiry.</span> </span> <span style="font-family:&quot;Times New Roman&quot;, serif;font-size:12pt;"> <span style="font-family:&quot;Calibri&quot;,sans-serif;font-size:11.0pt;"></span> </span> </p>

