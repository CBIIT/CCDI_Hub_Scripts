    <p><span style="font-size:12pt"><span style="background-color:white"><span style="font-family:&quot;Times New Roman&quot;,serif"><span style="font-size:11.0pt"><span style="font-family:&quot;Calibri&quot;,sans-serif"><span style="color:black">This update includes the addition of the cBioPortal for Cancer Genomics repository and the Innovative Therapies for Children with Cancer Paediatric Preclinical Proof-of-Concept Platform (ITCC-P4) program. &nbsp;The cBioPortal for Cancer Genomics is a tool for interactive exploration of genomics data sets that aims to lower the barriers between complex genomic data and cancer researchers.&nbsp; The ITCC-P4 is a multi-country consortium that aims to establish new patient-derived preclinical models of high-risk pediatric tumors which can be fully characterized.</span></span></span></span></span></span></p><p><span style="font-size:12pt"><span style="background-color:white"><span style="font-family:&quot;Times New Roman&quot;,serif"><span style="font-size:11.0pt"><span style="font-family:&quot;Calibri&quot;,sans-serif"><span style="color:black">The Catalog also updated 8 existing resources, including 1 new dataset, along with numerous data updates.</span></span></span></span></span></span></p><p><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">Explore the data and site updates in more detail below.</span></span><br />&nbsp;</p><h1><span style="font-size:16pt"><span style="font-family:&quot;Calibri Light&quot;,sans-serif"><span style="color:#2f5496">Data Updates</span></span></span></h1><h2><span style="font-size:13pt"><span style="font-family:&quot;Calibri Light&quot;,sans-serif"><span style="color:#2f5496">New Participating Resource and Dataset</span></span></span></h2><p><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif"><span style="background-color:white"><span style="color:black">The CCDC has added&nbsp;<strong><span style="font-family:&quot;Calibri&quot;,sans-serif">2</span></strong>&nbsp;new resources.</span></span></span></span></p><ul><li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">cBioPortal for Cancer Genomics</span></span><ul style="list-style-type:circle"><li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif"><strong>New Dataset</strong> - Sarcoma MSK 2022</span></span></li></ul></li><li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">Innovative Therapies for Children with Cancer Paediatric Preclinical Proof-of-Concept Platform (ITCC-P4)</span></span></li></ul><p>&nbsp;</p><h2><span style="font-size:13pt"><span style="font-family:&quot;Calibri Light&quot;,sans-serif"><span style="color:#2f5496">Existing Participating Resources and Datasets</span></span></span></h2><p><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif"><strong><span style="background-color:white"><span style="font-family:&quot;Calibri&quot;,sans-serif"><span style="color:black">8&nbsp;</span></span></span></strong><span style="background-color:white"><span style="color:black">existing resources have been updated with additional<strong>&nbsp;</strong>data and information.</span></span></span></span></p><ul><li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">Children&#39;s Oncology Group (COG)</span></span><ul style="list-style-type:circle"><li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">Updated Clinical Trial List URL</span></span></li></ul></li><li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">Genomic Data Commons </span></span><ul style="list-style-type:circle"><li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">Remove GENIE dataset.</span></span></li><li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">Remove Project Name data element from BEAT AML dataset</span></span></li></ul></li><li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">Greehey Children&#39;s Cancer Research Institute</span></span><ul style="list-style-type:circle"><li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">Updated resource name to <em>Greehey Children&#39;s Cancer Research Institute</em> from <em>Greehey Children&#39;s Cancer Research Institute Xenograft &amp; Cell-Lines Core.</em></span></span></li><li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">Updated resource Point of Contact (POC) and URL.</span></span></li><li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">Updated dataset name to <em>Texas Pediatric Cancer Drug Testing Core and Pediatric Preclinical In Vivo Testing Consortium</em> from <em>Pediatric Preclinical Testing Program.</em></span></span></li><li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">Updated dataset POC information, dataset Descriptions, and Published In URLs.</span></span></li><li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">Added Data Repositories URLs to dataset.</span></span></li></ul></li><li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">Kids First Data Resource</span></span><ul style="list-style-type:circle"><li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">Updated Description for TARGET: Acute Myeloid Leukemia dataset</span></span></li></ul></li><li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">National Childhood Cancer Registry Database in SEER*Stat </span></span><ul style="list-style-type:circle"><li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">Updated resources name to <em>National Childhood Cancer Registry Database in SEER*Stat</em> from <em>Surveillance, Epidemiology, and End Results Program</em></span></span></li><li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">Updated resource Description and URL.</span></span></li><li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">Updated dataset name to <em>NCCR Database in SEER*Stat </em>from <em>National Childhood Cancer Registry Explorer</em></span></span></li><li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">Updated dataset description and Data Repository link.&nbsp; Removed Published In URL. </span></span></li></ul></li><li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">PDX for Childhood Cancer Therapeutics (PCAT)</span></span><ul style="list-style-type:circle"><li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">Updated Case Tumor Site and Sample Anatomic Site values and counts</span></span></li></ul></li><li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">Pediatric Preclinical Testing Consortium (PPTC)</span></span><ul style="list-style-type:circle"><li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">Updated resource and data repository URLs</span></span></li></ul></li><li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">St. Jude Cloud</span></span><ul style="list-style-type:circle"><li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif"><strong>New Dataset</strong> - Public Resource of Patient-derived and Expanded Leukemias (PROPEL)</span></span></li></ul></li></ul><p>&nbsp;</p><h1><span style="font-size:16pt"><span style="font-family:&quot;Calibri Light&quot;,sans-serif"><span style="color:#2f5496">General Site Updates</span></span></span></h1><ul><li><span style="font-size:11pt"><span style="background-color:white"><span style="color:black"><span style="font-family:Calibri,sans-serif">The Glossary has been updated with new acronyms and abbreviations.</span></span></span></span></li><li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">The User Guide is updated to reflect new and updated resource information.</span></span></li></ul><p>&nbsp;</p><h1><span style="font-size:16pt"><span style="font-family:&quot;Calibri Light&quot;,sans-serif"><span style="color:#2f5496">Additional Support and Inquiries</span></span></span></h1><p><span style="font-size:12pt"><span style="font-family:&quot;Times New Roman&quot;,serif"><span style="font-size:11.0pt"><span style="font-family:&quot;Calibri&quot;,sans-serif">Users requiring any additional support or with any questions about the CCDC can contact the Childhood Cancer Data Initiative at </span></span><a href="mailto:NCIChildhoodCancerDataInitiative@mail.nih.gov"><span style="font-size:11.0pt"><span style="font-family:&quot;Calibri&quot;,sans-serif"><span style="color:#0563c1">NCIChildhoodCancerDataInitiative@mail.nih.gov</span></span></span></a><span style="font-size:11.0pt"><span style="font-family:&quot;Calibri&quot;,sans-serif">.&nbsp; Please include a name and a reference to the CCDC with the submitted inquiry.</span></span></span></span></p>


