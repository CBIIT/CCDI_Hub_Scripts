Resource</span> <span style="font-family:Calibri, sans-serif;font-size:11pt;"></span> </p> <ul style="padding-left:48px;"> <li> <p style="line-height:107%;margin:0;"> <span style="color:black;font-family:Calibri, sans-serif;font-size:11pt;">Added dbGaP accession to Kids First: Novel Cancer Susceptibility in Families (from BASIC3)</span> </p> </li> </ul> </li>  <li> <p style="line-height:107%;margin:0;"> <span style="font-family:Calibri, sans-serif;font-size:11pt;"> <span style="font-family:Symbol;"></span> </span> <span style="color:black;font-family:Calibri, sans-serif;font-size:11pt;">National Clinical Trials Network (NCTN) Navigator</span> <span style="font-family:Calibri, sans-serif;font-size:11pt;"></span> </p> <ul style="padding-left:48px;"> <li> <p style="line-height:107%;margin:0;"> <span style="color:black;font-family:Calibri, sans-serif;font-size:11pt;">Updated counts</span> </p> </li> </ul> </li> <li> <p style="line-height:107%;margin:0;"> <span style="font-family:Calibri, sans-serif;font-size:11pt;"> <span style="font-family:Symbol;"></span> </span> <span style="color:black;font-family:Calibri, sans-serif;font-size:11pt;">PedcBioPortal for Integrated Childhood Cancer Genomics</span> <span style="font-family:Calibri, sans-serif;font-size:11pt;"></span> </p> <ul style="padding-left:48px;"> <li> <p style="line-height:107%;margin:0;"> <span style="color:black;font-family:Calibri, sans-serif;font-size:11pt;">Updated counts</span> </p> </li></ul> </li> <li> <p style="line-height:107%;margin:0;"> <span style="font-family:Calibri, sans-serif;font-size:11pt;"> <span style="font-family:Symbol;"></span> </span> <span style="color:black;font-family:Calibri, sans-serif;font-size:11pt;">PDX INSIGHTS</span> <span style="font-family:Calibri, sans-serif;font-size:11pt;"></span> </p> <ul style="padding-left:48px;"> <li> <p style="line-height:107%;margin:0;"> <span style="color:black;font-family:Calibri, sans-serif;font-size:11pt;">Renamed from "PDX AIM"</span> </p> </li><