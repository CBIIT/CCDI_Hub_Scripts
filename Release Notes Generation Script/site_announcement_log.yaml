  - 1.4.10
  - '2024-09-25'
  - Clinical, Genomics/Omics
  - 5 new datasets, updated counts, new clinical trial lists, updated resource URLs, and a new reference link. Fall into the CCDC’s latest information!
  - >
    <p style="line-height:107%;margin:0in 0in 8pt;"><span style="color:black;font-family:Calibri, sans-serif;font-size:11pt;">September’s release includes updates to several existing resources and the addition of five new datasets: CCDI’s National Childhood Cancer Registry Data Platform and dbGaP’s Exploring the Microbiome-Gut-Brain Axis with Respect to Psychoneurological Symptoms for Children with Solid Tumors, Correlative Studies for Protocol #14-C-0059: T Cells Expressing an Anti-GD2 Chimeric Antigen Receptor in Patients with GD2+ Solid Tumors, a Collaboration with CIMAC-CIDC, Aberrant&nbsp;<span> </span>Activation of Wound Healing Programs within the Metastatic Niche Facilitates Lung Colonization by Osteosarcoma Cells, and Early Detection of Malignant and Pre-Malignant Peripheral Nerve Tumors Using Cell-Free DNA Fragmentomics. Counts were updated for the Human Cancer Models Initiative (HCMI) and Pediatric Cancer Data Commons (PCDC) resources, and clinical trial lists were added to multiple datasets for the Biopathology Center (BPC). Additional changes were made to repository links, resource URLs, and reference links. No new features were added in this release.</span><span style="color:black;font-family:Calibri, sans-serif;font-size:11pt;">&nbsp;</span></p> <p style="line-height:107%;margin:0in 0in 8pt;"><span style="color:black;font-family:Calibri, sans-serif;font-size:11pt;">Detailed updates are described below.</span><span style="font-family:Calibri, sans-serif;font-size:11pt;"></span><span style="font-family:Calibri, sans-serif;font-size:11pt;"></span></p> <p style="line-height:107%;margin:0in 0in 8pt;">&nbsp;</p> <h1 style="break-after:avoid;font-weight:normal;line-height:107%;margin:12pt 0in 0in;"><span style="color:rgb(47,84,150);font-family:&quot;Calibri Light&quot;, sans-serif;font-size:16pt;">Data Updates</span></h1> <h2 style="break-after:avoid;font-weight:normal;line-height:107%;margin:2pt 0in 0in;"><span style="color:rgb(47,84,150);font-family:&quot;