  - The updates include better support mobile browsing, improve accessibility, and enhancement to our data search tools.  We also added 7 new resources and 10 new datasets
  - >
    <p><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">The National Cancer Institute is pleased to announce an update of the Childhood Cancer Data Catalog website. </span></span></p> <p><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">This latest update to the site includes changes to support mobile browsing, improved accessibility, enhancement of site search tools, and new and updated resource data, including a new resource type, <em>Knowledgebase</em>.</span></span></p> <h1><span style="font-size:16pt"><span style="font-family:&quot;Calibri Light&quot;,sans-serif"><span style="color:#2f5496">General</span></span></span></h1> <ul> <li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">Elements of responsive design have been incorporated into the site to improve small screen and mobile viewing experience.</span></span></li> <li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">Color contrast across the site has been increased to improve accessibility and consistency.</span></span></li> <li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">Users navigating to a page that does not exist on the site (404 error) will now be notified and given direction to return to the home page.</span></span></li> <li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">The site vertical scroll bar has been updated to match the site design from the previous browser default.</span></span></li> <li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">The About page was updated with expanded information about the CCDC&rsquo;s aim of connecting users to data resources.</span></span></li> <li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">The Glossary was updated with new acronyms and abbreviations.</span></span></li> </ul> <h1><span style="font-size:16pt"><span style="font-family:&quot;Calibri Light&quot;,sans-serif"><span style="color:#2f5496">Search Catalog </span></span></span></h1> <ul> <li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif"><em>Resource</em> has been added as an additional filter option.&nbsp; </span></span> <ul style="list-style-type:circle"> <li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">Users can now select a resource(s) in the left-hand column to limit results to a specific resource or set of resources.&nbsp; </span></span></li> <li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">Selecting multiple resources functions with the OR Boolean operator</span></span></li> <li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">Resource and text searches work together as an AND Boolean search.&nbsp; </span></span></li> </ul> </li> <li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">Results sorting and display have been improved and expanded with additional user customization options.</span></span> <ul style="list-style-type:circle"> <li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">In Card View, the Sort By filter has been expanded to include sort by <em>Case</em> and <em>Sample</em> counts.</span></span></li> <li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">Card View results can now be sorted in ascending and descending order by selecting two new icons to the right of the Sort By filter.</span></span></li> <li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">In Table View, all column headers are now selectable for sorting in ascending and descending order.</span></span></li> <li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">Displayed results can now be adjusted to be 10, 20, 50, or 100 results per page by selecting the desired display value in the Results per Page filter</span></span></li> <li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">Forward and backwards navigation of paginated results is now done using arrows at the ends of the pagination bar and not &lsquo;Previous&rsquo; or &lsquo;Next&rsquo; buttons.</span></span></li> </ul> </li> <div class="html2pdf__page-break"></div> <li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">Anatomical site searches now leverage the NCI Thesaurus to display synonym matches for the Case Tumor Site data element in addition to matches of the searched term.</span></span></li> </ul> <h1><span style="font-size:16pt"><span style="font-family:&quot;Calibri Light&quot;,sans-serif"><span style="color:#2f5496">Participating Resources </span></span></span></h1> <ul> <li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif"><em>Knowledgebase</em> has been added as an additional Resource Type.</span></span> <ul style="list-style-type:circle"> <li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">Knowledgebase - Biomedical knowledgebases extract, accumulate, organize, annotate, and link the growing body of information that is related to and relies on core datasets.</span></span></li> </ul> </li> <li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">Each participating resource now includes information indicating if the resource is pediatric specific or contains mixed adult and pediatric data.</span></span></li> <li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">When viewing and filtering participating resources, the results display has been improved and expanded.</span></span> <ul style="list-style-type:circle"> <li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">Results are now paginated and can be navigated by selecting the forwards or backwards arrows.</span></span></li> <li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">Displayed results can be adjusted to be 10, 20, 50, or 100 results per page by selecting the desired display value in the Results per Page filter</span></span></li> </ul> </li> </ul> <h1><span style="font-size:16pt"><span style="font-family:&quot;Calibri Light&quot;,sans-serif"><span style="color:#2f5496">Data Updates</span></span></span></h1> <h2><span style="font-size:13pt"><span style="font-family:&quot;Calibri Light&quot;,sans-serif"><span style="color:#2f5496">New Participating Resources and Datasets</span></span></span></h2> <p><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">The CCDC has added 7 new resources that include 8 new datasets.</span></span></p> <ul> <li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif"><span style="color:black">Human Cancer Model Initiative</span></span></span> <ul style="list-style-type:circle"> <li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif"><span style="color:black">HCMI Participants Under 40 Years Old</span></span></span></li> </ul> </li> <li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif"><span style="color:black">Clinical Interpretations of Variants in Cancer (CIViC)</span></span></span> <ul style="list-style-type:circle"> <li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif"><span style="color:black">Clinical Interpretations of Variants in Cancer</span></span></span></li> </ul> </li> <li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif"><span style="color:black">OncoKB</span></span></span> <ul style="list-style-type:circle"> <li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif"><span style="color:black">OncoKB</span></span></span></li> </ul> </li> <li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif"><span style="color:black">Central Brain Tumor Registry of the United States (CBTRUS)</span></span></span> <ul style="list-style-type:circle"> <li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif"><span style="color:black">CBTRUS Fact Sheet 2021</span></span></span></li> </ul> </li> <li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif"><span style="color:black">Patient-Derived Xenograft and Advanced In Vivo Models (PDX-AIM)</span></span></span> <ul style="list-style-type:circle"> <li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif"><span style="color:black">Patient-Derived Xenograft and Advanced In Vivo Models</span></span></span></li> </ul> </li> <li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif"><span style="color:black">PDX Development and Trial Centers Research Network (PDXNet)</span></span></span> <ul style="list-style-type:circle"> <li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif"><span style="color:black">PDXNet Portal PDMR Data</span></span></span></li> <li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif"><span style="color:black">PDXNet Portal Model</span></span></span></li> </ul> </li> <li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif"><span style="color:black">The Jackson Laboratory PDX Models (JAX PDX)</span></span></span> <ul style="list-style-type:circle"> <li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif"><span style="color:black">Mouse Models of Human Cancer database</span></span></span></li> </ul> </li> </ul> <h2><span style="font-size:13pt"><span style="font-family:&quot;Calibri Light&quot;,sans-serif"><span style="color:#2f5496">Updated Participating Resources</span></span></span></h2> <p><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">Two existing resources have been updated to include the addition of 2 new datasets.</span></span></p> <ul> <li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">St. Jude Cloud &ndash; Updated Case counts</span></span></li> <li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">The Cancer Imaging Archive</span></span> <ul style="list-style-type:circle"> <li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">New - Clinical Trial NCT00352534</span></span></li> <li><span style="font-size:11pt"><span style="font-family:Calibri,sans-serif">New - Clinical Trial NCT00379340</span></span></li> </ul> </li> </ul> <div class="html2pdf__page-break"></div> <h1><span style="font-size:16pt"><span style="font-family:&quot;Calibri Light&quot;,sans-serif"><span style="color:#2f5496">Additional Support and Inquiries&nbsp;</span></span></span></h1> <p><span style="font-size:11.0pt"><span style="font-family:&quot;Calibri&quot;,sans-serif">Users requiring any additional support or with any questions about the CCDC can contact Childhood Cancer Data Initiative at </span></span><span style="font-size:11.0pt"><span style="font-family:&quot;Calibri&quot;,sans-serif"><a href="mailto:NCIChildhoodCancerDataInitiative@mail.nih.gov" style="color:#0563c1; text-decoration:underline"><span style="color:#0563c1">NCIChildhoodCancerDataInitiative@mail.nih.gov</span></a></span></span><span style="font-size:11.0pt"><span style="font-family:&quot;Calibri&quot;,sans-serif">.&nbsp; Please include a name and a reference to the CCDC with the submitted inquiry</span></span></p>
